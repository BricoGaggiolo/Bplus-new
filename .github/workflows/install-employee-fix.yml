name: Install employee anagrafica fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: "!contains(github.event.head_commit.message, '[employee-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject employee editor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./employee-anagrafica-fix.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker in s:
                  s=s.replace(marker, tag+marker, 1)
              else:
                  s += tag
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit injected script
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: install employee anagrafica fix [employee-fix]"
          git push
