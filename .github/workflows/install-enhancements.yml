name: Install Bplus enhancements
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    if: "!contains(github.event.head_commit.message, '[enhancements-installed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject enhancement script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text()
          tag='<script src="./bplus-test-complete.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git diff --cached --quiet || (git commit -m 'chore: install complete requested features [enhancements-installed]' && git push)
