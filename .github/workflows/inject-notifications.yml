name: Inject B+ notifications
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject notification bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./bplus-notifications.js"></script>'
          if tag not in s:
              if '</body>' in s:
                  s=s.replace('</body>', tag+'</body>', 1)
              else:
                  s += tag
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit injected bridge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git diff --cached --quiet || git commit -m 'chore: wire app notification bridge'
          git push