<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c62828">
<title>B+ – Cambia password</title><style>
body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;box-sizing:border-box}.card{width:min(390px,100%);background:#1e1e1e;border:1px solid #333;border-radius:16px;padding:24px;box-sizing:border-box}h1{font-size:21px;margin-top:0}p{color:#aaa;font-size:13px;line-height:1.5}label{display:block;color:#aaa;font-size:11px;font-weight:700;margin:14px 0 6px;text-transform:uppercase}input{width:100%;padding:13px;box-sizing:border-box;background:#292929;color:#fff;border:1px solid #444;border-radius:10px;font-size:16px}button{width:100%;min-height:48px;margin-top:18px;border:0;border-radius:10px;background:#c62828;color:#fff;font-weight:700;font-size:16px}.msg{display:none;margin-top:12px;padding:10px;border-radius:8px;font-size:13px}.ok{background:#102719;color:#a9e6bc}.bad{background:#2a0000;color:#ef9a9a}</style>
</head><body>
<main class="card"><h1>Imposta la tua password</h1><p>La password provvisoria <b>1234</b> deve essere sostituita al primo accesso.</p>
<label>Nuova password</label><input id="p1" type="password" autocomplete="new-password">
<label>Conferma password</label><input id="p2" type="password" autocomplete="new-password">
<button id="saveBtn" onclick="save()">Salva e continua</button><div id="msg" class="msg"></div></main>
<script>
if(!sessionStorage.getItem('bplus_uid')||sessionStorage.getItem('bplus_force_password')!=='1')location.replace('./index.html');
const P='bplus_passwords_v1';
function setMsg(t,ok=false){msg.textContent=t;msg.className='msg '+(ok?'ok':'bad');msg.style.display='block'}
function save();
 const a=p1.value,b=p2.value;if(a.length<8)return setMsg('La password deve contenere almeno 8 caratteri.');if(!/[A-Z]/.test(a)||!/[0-9]/.test(a))return setMsg('Usa almeno una maiuscola e un numero.');if(a==='1234')return setMsg('Scegli una password diversa da quella provvisoria.');if(a!==b)return setMsg('Le password non coincidono.');
 saveBtn.disabled=true;let u={};try{u=JSON.parse(sessionStorage.getItem('bplus_user')||'{}')}catch(e){}
 let synced=false;try{const r=await BPlusAuth.updatePassword(a);synced=!r.error}catch(e){}
 if(!synced){try{const r=await BPlusAuth.signIn(u.email,a);synced=!r.error}catch(e){}}
 let x={};try{x=JSON.parse(localStorage.getItem(P)||'{}')}catch(e){}x[String(sessionStorage.getItem('bplus_uid'))]=a;localStorage.setItem(P,JSON.stringify(x));
 sessionStorage.removeItem('bplus_force_password');setMsg('Password aggiornata. Accesso in corso…',true);setTimeout(()=>location.replace('./app.html?login=1'),250);
}
</script></body></html>
