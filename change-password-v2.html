<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c62828"><title>B+ – Cambia password</title><style>body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;box-sizing:border-box}.card{width:min(390px,100%);background:#1e1e1e;border:1px solid #333;border-radius:16px;padding:24px;box-sizing:border-box}h1{font-size:21px}p{color:#aaa;font-size:13px;line-height:1.5}label{display:block;color:#aaa;font-size:11px;font-weight:700;margin:14px 0 6px;text-transform:uppercase}input{width:100%;padding:13px;box-sizing:border-box;background:#292929;color:#fff;border:1px solid #444;border-radius:10px;font-size:16px}button{width:100%;min-height:48px;margin-top:18px;border:0;border-radius:10px;background:#c62828;color:#fff;font-weight:700;font-size:16px}.msg{display:none;margin-top:12px;padding:10px;border-radius:8px;background:#2a0000;color:#ef9a9a;font-size:13px}.back{display:none;position:fixed;inset:0;background:#0009;align-items:flex-end;justify-content:center;padding:16px;box-sizing:border-box}.notify{width:min(430px,100%);background:#1e1e1e;border:1px solid #444;border-radius:18px;padding:22px;box-sizing:border-box}.actions{display:flex;gap:10px}.actions button{flex:1}.no{background:#343434}@media(min-width:769px){.back{align-items:center}}</style></head><body><main class="card"><h1>Imposta la tua password</h1><p>La password provvisoria <b>1234</b> deve essere sostituita al primo accesso.</p><label>Nuova password</label><input id="p1" type="password" autocomplete="new-password"><label>Conferma password</label><input id="p2" type="password" autocomplete="new-password"><button onclick="save()">Salva e accedi</button><div id="msg" class="msg"></div></main><div id="back" class="back"><div class="notify"><h2>🔔 Rimani aggiornato sui tuoi turni</h2><p>Abilita le notifiche B+ per ricevere aggiornamenti sui tuoi turni, assenze e corsi.</p><div class="actions"><button class="no" onclick="go()">Non ora</button><button onclick="notify()">Abilita notifiche</button></div></div></div><script>const P='bplus_passwords_v1';if(!sessionStorage.getItem('bplus_uid')||sessionStorage.getItem('bplus_force_password')!=='1')location.replace('./index.html');function go(){location.replace('./app.html')}async function notify(){try{if('Notification'in window){const p=await Notification.requestPermission();if(p==='granted'&&'serviceWorker'in navigator)try{await navigator.serviceWorker.register('./sw.js')}catch(e){}}}catch(e){}go()}function save(){const a=p1.value,b=p2.value;msg.style.display='block';if(a.length<8){msg.textContent='La password deve contenere almeno 8 caratteri.';return}if(!/[A-Z]/.test(a)||!/[0-9]/.test(a)){msg.textContent='Usa almeno una maiuscola e un numero.';return}if(a==='1234'){msg.textContent='Scegli una password diversa da quella provvisoria.';return}if(a!==b){msg.textContent='Le password non coincidono.';return}let x={};try{x=JSON.parse(localStorage.getItem(P)||'{}')}catch(e){}x[String(sessionStorage.getItem('bplus_uid'))]=a;localStorage.setItem(P,JSON.stringify(x));sessionStorage.removeItem('bplus_force_password');msg.style.display='none';if('Notification'in window&&Notification.permission!=='granted')back.style.display='flex';else go()}</script></body></html>
