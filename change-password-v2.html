<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c62828"><meta http-equiv="Cache-Control" content="no-store"><title>B+ – Cambia password</title><style>body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;box-sizing:border-box}.card{width:min(390px,100%);background:#1e1e1e;border:1px solid #333;border-radius:16px;padding:24px;box-sizing:border-box}h1{font-size:21px;margin-top:0}p{color:#aaa;font-size:13px;line-height:1.5}label{display:block;color:#aaa;font-size:11px;font-weight:700;margin:14px 0 6px;text-transform:uppercase}input{width:100%;padding:13px;box-sizing:border-box;background:#292929;color:#fff;border:1px solid #444;border-radius:10px;font-size:16px}button{width:100%;min-height:48px;margin-top:18px;border:0;border-radius:10px;background:#c62828;color:#fff;font-weight:700;font-size:16px}.msg{display:none;margin-top:12px;padding:10px;border-radius:8px;font-size:13px}.ok{background:#102719;color:#a9e6bc}.bad{background:#2a0000;color:#ef9a9a}</style></head><body><main class="card"><h1>Imposta la tua password</h1><p>Al primo accesso devi sostituire la password provvisoria con una password personale.</p><label>Nuova password</label><input id="p1" type="password" autocomplete="new-password"><label>Conferma password</label><input id="p2" type="password" autocomplete="new-password"><button id="saveBtn" type="button">Salva e continua</button><div id="msg" class="msg"></div></main><script src="./auth-v3.js?build=20261002-login-v3"></script><script>(function(){const a=BPlusAuth.get();if(!a||!a.forcePassword){location.replace('./app.html');return}const p1=document.getElementById('p1'),p2=document.getElementById('p2'),btn=document.getElementById('saveBtn'),msg=document.getElementById('msg');function show(t,ok){msg.textContent=t;msg.className='msg '+(ok?'ok':'bad');msg.style.display='block'}function save(){const a=BPlusAuth.get(),x=p1.value,y=p2.value;if(x.length<8)return show('La password deve contenere almeno 8 caratteri.');if(!/[A-Z]/.test(x)||!/[0-9]/.test(x))return show('Usa almeno una lettera maiuscola e un numero.');if(x==='1234')return show('Scegli una password diversa da quella provvisoria.');if(x!==y)return show('Le password non coincidono.');let p={};try{p=JSON.parse(localStorage.getItem('bplus_passwords_v3')||'{}')}catch(e){}p[String(a.uid)]=x;localStorage.setItem('bplus_passwords_v3',JSON.stringify(p));BPlusAuth.set(a.user,false);show('Password aggiornata. Accesso in corso…',true);setTimeout(function(){location.replace('./app.html?login=password-updated')},250)}btn.addEventListener('click',save);p2.addEventListener('keydown',e=>{if(e.key==='Enter')save()})})();</script></body></html>
