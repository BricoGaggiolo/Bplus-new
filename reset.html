<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B+ Reset</title><style>body{font-family:system-ui;background:#111;color:#eee;padding:24px}button{min-height:48px;padding:12px 16px;border:0;border-radius:10px;background:#c62828;color:#fff;font-weight:700}</style><h1>Reset B+</h1><p>Rimuove Service Worker, cache e dati locali del browser.</p><button id="go">Esegui reset</button><p id="msg"></p><script>go.onclick=async()=>{localStorage.clear();sessionStorage.clear();if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}msg.textContent='Reset completato. Chiudi e riapri il browser.'}</script>
