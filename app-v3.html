<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c62828"><title>B+ Gestionale HR</title><link rel="manifest" href="./manifest.json"><style>
:root{--bg:#0f1012;--p:#181a1e;--p2:#22252b;--line:#30343b;--txt:#f6f7f9;--muted:#9ba1aa;--red:#c62828;--green:#2e9b58;--orange:#d88919;--blue:#2878d7}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation;min-height:44px}.side{position:fixed;z-index:40;inset:0 auto 0 0;width:255px;background:#15171a;border-right:1px solid var(--line);padding:16px;overflow:auto}.brand{font-size:24px;font-weight:900;margin:5px 8px 18px}.brand i{color:#e53935;font-style:normal}.who,.card{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:14px}.who{margin-bottom:14px}.who b{display:block}.muted{color:var(--muted);font-size:13px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c6c9ce;text-align:left;border-radius:10px;padding:11px}.nav button.active,.nav button:hover{background:#292d33;color:#fff}.main{margin-left:255px;padding:22px 24px 90px;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top h1{margin:0;font-size:24px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--red);color:#fff;font-weight:750}.btn.secondary{background:#34383e}.btn.green{background:var(--green)}.btn.blue{background:var(--blue)}.btn.danger{background:#6e2020}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{font-size:28px;font-weight:900;margin-top:6px}.section{margin-top:16px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:12px;color:#9ca1aa}.pill{display:inline-block;border-radius:999px;padding:4px 8px;background:#333;font-size:12px}.ok{background:#173820;color:#8ee3a7}.warn{background:#3b2d16;color:#ffd07c}.bad{background:#401b1b;color:#ff9d9d}.tabs{display:flex;gap:6px;overflow:auto;margin:0 0 12px}.tabs button{border:1px solid var(--line);background:var(--p);color:#bbb;border-radius:9px;padding:8px 12px;white-space:nowrap}.tabs button.active{background:#30343a;color:#fff}.modal{display:none;position:fixed;inset:0;z-index:80;background:#000b;padding:16px;align-items:center;justify-content:center}.modal.open{display:flex}.dialog{width:min(950px,100%);max-height:92vh;overflow:auto;background:#1a1c20;border:1px solid #3a3e45;border-radius:16px;padding:18px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form label{font-size:12px;color:#aeb3ba;display:grid;gap:5px}.form input,.form select,.form textarea{width:100%;background:#292d33;color:#fff;border:1px solid #454a52;border-radius:8px;padding:10px}.form textarea{min-height:90px}.checkrow{display:flex;flex-wrap:wrap;gap:8px}.checkrow label{display:flex;align-items:center;gap:5px;background:#25282d;border-radius:8px;padding:8px}.week{display:grid;grid-template-columns:165px repeat(7,135px);overflow:auto}.week>div{border:1px solid var(--line);border-width:0 1px 1px 0;padding:8px;min-height:72px}.shift{background:#292d33;border-radius:8px;padding:7px;font-size:12px;min-height:50px}.shift.click{cursor:pointer}.calendar{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}.day{min-height:80px;padding:7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.heat0{background:#18241b}.heat1{background:#3b3318}.heat2{background:#451c1c}.matrix{overflow:auto}.matrix table{border-collapse:collapse;min-width:900px}.matrix th,.matrix td{border:1px solid var(--line);padding:7px;text-align:center;white-space:nowrap}.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:#181a1e;text-align:left;z-index:2}.worked{background:#8a6410;color:#fff;font-weight:800}.bottom{display:none}.toast{position:fixed;z-index:100;right:18px;bottom:18px;background:#25282d;border:1px solid #444;padding:12px 15px;border-radius:10px}.hidden{display:none}.subcard{background:#14161a;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}.dangerText{color:#ff9d9d}
@media(max-width:800px){.side{transform:translateX(-105%);transition:.2s;width:285px;box-shadow:10px 0 30px #0008}.side.open{transform:none}.main{margin:0;padding:15px 13px 96px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top h1{font-size:20px}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;z-index:45;left:0;right:0;bottom:0;background:#15171a;border-top:1px solid var(--line);padding:5px 3px calc(5px + env(safe-area-inset-bottom))}.bottom button{border:0;background:transparent;color:#a2a6ad;padding:5px 2px;font-size:10px}.bottom button b{display:block;font-size:18px;line-height:20px}.bottom button.active{color:#fff}.form{grid-template-columns:1fr}.modal{align-items:flex-end;padding:0}.dialog{width:100%;max-height:92vh;border-radius:18px 18px 0 0;padding:15px}.calendar{grid-template-columns:repeat(7,110px);overflow:auto}.table{min-width:780px}.week{grid-template-columns:135px repeat(7,120px)}}
@media(max-width:460px){.grid{grid-template-columns:1fr}.actions .btn{flex:1}.card{padding:12px}.top{align-items:flex-start}.top .actions{max-width:55%}}
</style></head><body>
<aside class="side" id="side"><div class="brand">B<i>+</i> Gestionale</div><div class="who" id="who"></div><nav class="nav" id="nav"></nav></aside>
<main class="main"><header class="top"><div><h1 id="title">Dashboard</h1><div class="muted">Versione test completa</div></div><div class="actions"><button class="btn secondary" onclick="menu()">☰</button><button class="btn" onclick="logout()">Esci</button></div></header><section id="view"></section></main>
<nav class="bottom" id="bottom"></nav><div class="modal" id="modal"><div class="dialog"><div class="top"><h2 id="mTitle"></h2><button class="btn secondary" onclick="closeM()">Chiudi</button></div><div id="mBody"></div></div></div><div class="toast hidden" id="toast"></div>
<script>
'use strict';
if(!sessionStorage.getItem('bplus_uid'))location.replace('./index.html');
const K='bplus_new_v2', user=JSON.parse(sessionStorage.getItem('bplus_user')||'{}');
const days=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'], roles=['','Lavoratore','Direttore','Titolare'];
const storesDefault=[{id:'GAG',name:'Gaggiolo'},{id:'COC',name:'Cocquio'},{id:'DAV',name:'Daverio'},{id:'VAR',name:'Varese'}];
const seed={employees:[],shifts:[],absences:[],courses:[],history:[],notifications:[],stores:storesDefault.map(s=>({id:s.id,name:s.name,days:{},exceptions:{}})),genCounter:0};
let db=JSON.parse(localStorage.getItem(K)||'null')||seed;
if(!db.employees)db.employees=[];if(!db.shifts)db.shifts=[];if(!db.absences)db.absences=[];if(!db.courses)db.courses=[];if(!db.history)db.history=[];if(!db.notifications)db.notifications=[];if(!db.stores||db.stores.length!==4)db.stores=storesDefault.map(s=>({id:s.id,name:s.name,days:{},exceptions:{}}));
function save(){localStorage.setItem(K,JSON.stringify(db))}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function menu(){side.classList.toggle('open')}function logout(){sessionStorage.clear();location='./index.html'}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)}function openM(t,b){mTitle.textContent=t;mBody.innerHTML=b;modal.classList.add('open')}function closeM(){modal.classList.remove('open')}function notify(text,emp='all'){db.notifications.unshift({id:Date.now()+Math.random(),text,emp,read:false,date:new Date().toISOString()});save()}
const pages={dashboard:'Dashboard',employees:'Dipendenti',shifts:'Turni',history:'Storico turni',absences:'Assenze & Ferie',stores:'Punti vendita',courses:'Corsi',reports:'Report',notifications:'Notifiche',profile:'Profilo'};let page='dashboard',subtab='main';
function can(p){if(user.ruolo===3)return true;if(user.ruolo===2)return ['dashboard','shifts','history','absences','notifications','profile'].includes(p);return ['dashboard','absences','notifications','profile'].includes(p)}
function nav(){let arr=Object.entries(pages).filter(([p])=>can(p));navEl().innerHTML=arr.map(([p,n])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${n}</button>`).join('');bottom.innerHTML=[['dashboard','⌂'],['shifts','▦'],['absences','🏖'],['notifications','🔔'],['menu','☰']].map(([p,i])=>`<button class="${page===p?'active':''}" onclick="${p==='menu'?'menu()':`go('${p}')`}"><b>${i}</b>${p==='menu'?'Altro':pages[p]}</button>`).join('');who.innerHTML=`<b>${esc(user.nome||'Utente')} ${esc(user.cognome||'')}</b><small>${roles[user.ruolo]||''}${user.negozio?' · '+esc(user.negozio):''}</small>`}function navEl(){return document.getElementById('nav')}function go(p){if(!can(p))return;page=p;side.classList.remove('open');title.textContent=pages[p];nav();render()}
function today(){return new Date().toISOString().slice(0,10)}function monday(d=new Date()){let x=new Date(d);x.setHours(12);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}function dateAt(base,i){let d=new Date(base);d.setDate(d.getDate()+i);return d.toISOString().slice(0,10)}function employee(id){return db.employees.find(e=>String(e.id)===String(id))}
function dashboard(){let es=db.employees.filter(e=>e.stato==='attivo'), a=db.absences.filter(x=>x.stato==='approvato'&&x.da<=today()&&x.a>=today()), s=db.shifts.filter(x=>x.date===today());return `<div class="grid"><div class="card"><div class="muted">Dipendenti attivi</div><div class="stat">${es.length}</div></div><div class="card"><div class="muted">Turni oggi</div><div class="stat">${s.length}</div></div><div class="card"><div class="muted">Assenti oggi</div><div class="stat">${a.length}</div></div><div class="card"><div class="muted">Notifiche</div><div class="stat">${db.notifications.filter(n=>!n.read&&(n.emp==='all'||String(n.emp)===String(user.id))).length}</div></div></div><div class="section grid">${storesDefault.map(st=>{let n=s.filter(x=>x.store===st.id).length;return `<div class="card"><b>${st.name}</b><div class="muted">Presenti oggi</div><div class="stat">${n}</div></div>`}).join('')}</div>`}
function employeesPage(){if(user.ruolo!==3)return `<div class="card">Accesso non disponibile.</div>`;let q=document.getElementById('empSearch')?.value||'',f=db.employees.filter(e=>(`${e.nome} ${e.cognome} ${e.email}`.toLowerCase().includes(q.toLowerCase())));return `<div class="actions"><button class="btn" onclick="employeeModal()">+ Nuovo lavoratore</button><input id="empSearch" value="${esc(q)}" oninput="render()" placeholder="Cerca..." style="background:#292d33;color:#fff;border:1px solid #454a52;border-radius:8px;padding:10px"></div><div class="section tablewrap"><table class="table"><thead><tr><th>Nome</th><th>Email</th><th>Ruolo</th><th>Negozio</th><th>Stato</th><th></th></tr></thead><tbody>${f.map(e=>`<tr><td><b>${esc(e.nome)} ${esc(e.cognome)}</b></td><td>${esc(e.email||'')}</td><td>${roles[e.ruolo]||''}</td><td>${esc(e.negozio||'')}</td><td>${esc(e.stato||'')}</td><td><button class="btn secondary" onclick="employeeModal('${e.id}')">Apri</button></td></tr>`).join('')}</tbody></table></div>`}
function employeeModal(id){let e=id?employee(id):{id:Date.now(),nome:'',cognome:'',email:'',telefono:'',ruolo:1,negozio:'GAG',contratto:'indeterminato',ore:40,pausaTipo:'flessibile',pausaInizio:'12:00',pausaFine:'13:30',pausaMin:60,riposiFissi:[],compensativi:[],mobilita:[],stato:'attivo',inTurni:true};if(id&&!e.pausaTipo){e.pausaTipo=e.pausa==='fissa'?'fissa':'flessibile';e.riposiFissi=(e.riposo||'').split(',').filter(Boolean);e.compensativi=(e.riposoDom||'').split(',').filter(Boolean)}openM('Scheda lavoratore',`<div class="tabs"><button id="et1" class="active" onclick="empTab('an',${e.id})">Anagrafica</button><button id="et2" onclick="empTab('ct',${e.id})">Contratto & Turni</button><button id="et3" onclick="empTab('as',${e.id})">Assenze</button></div><div id="empTabBody"></div>`);window._emp=e;empTab('an',e.id)}
function empTab(t,id){let e=window._emp||employee(id);document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.getElementById(t==='an'?'et1':t==='ct'?'et2':'et3').classList.add('active');let b='';if(t==='an')b=`<div class="form"><label>Nome<input id="en" value="${esc(e.nome)}"></label><label>Cognome<input id="ec" value="${esc(e.cognome)}"></label><label>Email<input id="ee" type="email" value="${esc(e.email)}"></label><label>Telefono<input id="et" value="${esc(e.telefono)}"></label><label>Ruolo<select id="er"><option value="1" ${e.ruolo==1?'selected':''}>Lavoratore</option><option value="2" ${e.ruolo==2?'selected':''}>Direttore</option><option value="3" ${e.ruolo==3?'selected':''}>Titolare</option></select></label><label>Negozio<select id="es">${storesDefault.map(s=>`<option ${e.negozio===s.id?'selected':''} value="${s.id}">${s.name}</option>`).join('')}</select></label><label>Stato<select id="est"><option>attivo</option><option>assente</option><option>ferie</option><option>malattia</option></select></label><label>Includi nei turni <input id="eit" type="checkbox" ${e.inTurni?'checked':''}></label></div><h3>Capacità generali</h3><input id="cap" type="number" min="1" max="5" value="${e.capacita||3}"><h3>Competenze</h3><div class="checkrow">${['tintometro','chiavi','muletto','cassa','taglio legno','kasanova'].map(k=>`<label><input type="checkbox" id="c_${k.replace(/ /g,'_')}" ${(e.comp||{})[k]?'checked':''}>${k}</label>`).join('')}</div><button class="btn green" onclick="saveEmp()">Salva anagrafica</button>`;else if(t==='ct')b=`<div class="form"><label>Contratto<select id="ctc"><option>indeterminato</option><option>determinato</option><option>part-time</option></select></label><label>Ore settimanali<input id="cto" type="number" value="${e.ore||40}"></label><label>Tipo pausa<select id="pt" onchange="togglePause()"><option value="fissa" ${e.pausaTipo==='fissa'?'selected':''}>Fissa</option><option value="flessibile" ${e.pausaTipo!=='fissa'?'selected':''}>Flessibile</option></select></label><label id="pf">Orario pausa fissa<input id="pfo" value="${esc((e.pausaInizio||'12:00')+' / '+(e.pausaFine||'13:30'))}" placeholder="12:00 / 13:30"></label><label id="px">Durata pausa flessibile (minuti)<input id="pxm" type="number" value="${e.pausaMin||60}"></label></div><h3>Riposo fisso settimanale</h3><div class="checkrow">${days.map((d,i)=>`<label><input type="checkbox" class="rf" value="${i}" ${(e.riposiFissi||[]).includes(String(i))?'checked':''}>${d}</label>`).join('')}</div><h3>Riposo compensativo se lavora la domenica</h3><div class="muted">Seleziona uno o più giorni possibili della stessa settimana. Deve essere diverso dal riposo fisso.</div><div class="checkrow">${days.slice(0,6).map((d,i)=>`<label><input type="checkbox" class="rc" value="${i}" ${(e.compensativi||[]).includes(String(i))?'checked':''}>${d}</label>`).join('')}</div><h3>Mobilità inter-negozio</h3><div class="checkrow">${storesDefault.map(s=>`<label><input type="checkbox" class="mob" value="${s.id}" ${(e.mobilita||[]).includes(s.id)?'checked':''}>${s.name}</label>`).join('')}</div><button class="btn green" onclick="saveEmpContract()">Salva Contratto & Turni</button>`;else b=`<div class="actions"><button class="btn" onclick="newAbs('${e.id}')">+ Inserisci assenza</button></div><div class="tablewrap section"><table class="table"><tr><th>Tipo</th><th>Dal</th><th>Al</th><th>Stato</th><th>Note</th></tr>${db.absences.filter(a=>String(a.emp)===String(e.id)).map(a=>`<tr><td>${esc(a.tipo)}</td><td>${a.da}</td><td>${a.a}</td><td>${esc(a.stato)}</td><td>${esc(a.note||'')}</td></tr>`).join('')}</table></div>`;document.getElementById('empTabBody').innerHTML=b;togglePause()}
function togglePause(){let fixed=pt?.value==='fissa';if(pf)pf.style.display=fixed?'grid':'none';if(px)px.style.display=fixed?'none':'grid'}
function saveEmp(){let e=window._emp;e.nome=en.value.trim();e.cognome=ec.value.trim();e.email=ee.value.trim();e.telefono=et.value.trim();e.ruolo=+er.value;e.negozio=es.value;e.stato=est.value;e.inTurni=eit.checked;e.capacita=+cap.value;e.comp=e.comp||{};['tintometro','chiavi','muletto','cassa','taglio legno','kasanova'].forEach(k=>e.comp[k]=document.getElementById('c_'+k.replace(/ /g,'_')).checked?1:0);commitEmp(e)}function saveEmpContract(){let e=window._emp;e.ore=+cto.value;e.contratto=ctc.value;e.pausaTipo=pt.value;if(pt.value==='fissa'){let v=pfo.value.split('/').map(x=>x.trim());e.pausaInizio=v[0]||'12:00';e.pausaFine=v[1]||'13:30'}else e.pausaMin=+pxm.value;e.riposiFissi=[...document.querySelectorAll('.rf:checked')].map(x=>x.value);e.compensativi=[...document.querySelectorAll('.rc:checked')].map(x=>x.value).filter(x=>!e.riposiFissi.includes(x));e.mobilita=[...document.querySelectorAll('.mob:checked')].map(x=>x.value);commitEmp(e)}function commitEmp(e){let i=db.employees.findIndex(x=>String(x.id)===String(e.id));if(i<0)db.employees.push(e);else db.employees[i]=e;save();closeM();render();toast('Dati lavoratore salvati')}
function newAbs(emp){openM('Nuova assenza',`<div class="form"><label>Tipo<select id="at"><option>Ferie</option><option>Permesso</option><option>Malattia</option><option>Corso</option></select></label><label>Dal<input id="ad" type="date" value="${today()}"></label><label>Al<input id="aa" type="date" value="${today()}"></label><label>Note<textarea id="an"></textarea></label></div><button class="btn green" onclick="saveAbs('${emp}')">Salva</button>`)}function saveAbs(emp){db.absences.push({id:Date.now(),emp:+emp,tipo:at.value,da:ad.value,a:aa.value,note:an.value,stato:user.ruolo===3?'approvato':'in_attesa'});notify('È stata inserita una nuova assenza',emp);save();closeM();render()}
function absencesPage(){let mine=user.ruolo===1, lf=mine?String(user.id):'', f=document.getElementById('afEmp')?.value||'', st=document.getElementById('afSt')?.value||'',tp=document.getElementById('afTp')?.value||'';let list=db.absences.filter(a=>(!mine||String(a.emp)===lf)&&(!f||String(a.emp)===f)&&(!st||a.stato===st)&&(!tp||a.tipo===tp));return `<div class="actions"><select id="afEmp" onchange="render()"><option value="">Tutti i lavoratori</option>${db.employees.map(e=>`<option value="${e.id}" ${String(f)===String(e.id)?'selected':''}>${esc(e.nome)} ${esc(e.cognome)}</option>`).join('')}</select><select id="afTp" onchange="render()"><option value="">Tutti i tipi</option>${['Ferie','Permesso','Malattia','Corso'].map(x=>`<option ${tp===x?'selected':''}>${x}</option>`).join('')}</select><select id="afSt" onchange="render()"><option value="">Tutti gli stati</option>${['in_attesa','approvato','rifiutato'].map(x=>`<option ${st===x?'selected':''}>${x}</option>`).join('')}</select>${mine?`<button class="btn" onclick="newAbs('${user.id}')">+ Richiedi</button>`:''}</div><div class="section tablewrap"><table class="table"><tr><th>Lavoratore</th><th>Tipo</th><th>Dal</th><th>Al</th><th>Stato</th><th></th></tr>${list.map(a=>{let e=employee(a.emp);return `<tr><td>${e?esc(e.nome+' '+e.cognome):a.emp}</td><td>${a.tipo}</td><td>${a.da}</td><td>${a.a}</td><td>${a.stato}</td><td>${user.ruolo>=2&&a.stato==='in_attesa'?`<button class="btn green" onclick="answerAbs(${a.id},'approvato')">Approva</button> <button class="btn danger" onclick="answerAbs(${a.id},'rifiutato')">Rifiuta</button>`:''}</td></tr>`}).join('')}</table></div>`}
function answerAbs(id,status){let a=db.absences.find(x=>x.id===id);if(!a)return;a.stato=status;notify(`La richiesta di assenza è stata ${status==='approvato'?'approvata':'rifiutata'}`,a.emp);save();render()}
function storesPage(){if(user.ruolo!==3)return `<div class="card">Accesso non disponibile.</div>`;return `<div class="muted">Configura orario e minimi per ogni negozio e per ogni giorno. Le eccezioni per data prevalgono sulla regola settimanale.</div>${db.stores.map(s=>`<div class="section card"><div class="top"><h3>${esc(s.name)}</h3><button class="btn" onclick="storeModal('${s.id}')">Modifica giorni</button></div><div class="tablewrap"><table class="table"><tr><th>Giorno</th><th>Orario</th><th>Festivo/chiuso</th><th>Min giorno</th><th>Min apertura</th><th>Min chiusura</th><th>Min pausa</th></tr>${days.map((d,i)=>{let x=s.days[i]||{};return `<tr><td>${d}</td><td>${x.mode==='split'?`${x.m1||'08:30'}–${x.m2||'12:30'} / ${x.p1||'14:30'}–${x.p2||'19:30'}`:`${x.open||'08:30'}–${x.close||'19:30'}`}</td><td>${x.closed?'Sì':'No'}</td><td>${x.min||0}</td><td>${x.openMin||0}</td><td>${x.closeMin||0}</td><td>${x.breakMin??'N/A'}</td></tr>`}).join('')}</table></div><div class="subcard"><b>Eccezioni per data</b> <button class="btn secondary" onclick="exceptionModal('${s.id}')">+ Aggiungi eccezione</button>${Object.entries(s.exceptions||{}).map(([d,x])=>`<div>${d}: ${x.closed?'CHIUSO':(x.mode==='split'?'spezzato':'continuato')} · min ${x.min||0}</div>`).join('')}</div></div>`}).join('')}`}
function storeModal(id){let s=db.stores.find(x=>x.id===id);openM(`Orari ${s.name}`,`<div class="tabs">${days.map((d,i)=>`<button onclick="storeDay('${id}',${i})">${d}</button>`).join('')}</div><div id="storeDayBody"></div>`);storeDay(id,0)}function storeDay(id,i){let s=db.stores.find(x=>x.id===id),x=s.days[i]||{};document.getElementById('storeDayBody').innerHTML=`<div class="form"><label>Tipo orario<select id="smode"><option value="continuous" ${x.mode!=='split'?'selected':''}>Orario continuato</option><option value="split" ${x.mode==='split'?'selected':''}>Pausa pranzo / spezzato</option></select></label><label>Giorno festivo/chiuso<input id="sclosed" type="checkbox" ${x.closed?'checked':''}></label><label>Apertura<input id="sopen" type="time" value="${x.open||'08:30'}"></label><label>Chiusura<input id="sclose" type="time" value="${x.close||'19:30'}"></label><label>Mattina chiude<input id="sm2" type="time" value="${x.m2||'12:30'}"></label><label>Pomeriggio apre<input id="sp1" type="time" value="${x.p1||'14:30'}"></label><label>Min. personale giornaliero<input id="smin" type="number" min="0" value="${x.min||0}"></label><label>Min. persone in apertura<input id="som" type="number" min="0" value="${x.openMin||0}"></label><label>Min. persone in chiusura<input id="scm" type="number" min="0" value="${x.closeMin||0}"></label><label>Min. persone in pausa pranzo<input id="sbm" type="number" min="0" value="${x.breakMin??0}"></label></div><button class="btn green" onclick="saveStoreDay('${id}',${i})">Salva ${days[i]}</button>`}function saveStoreDay(id,i){let s=db.stores.find(x=>x.id===id);s.days[i]={mode:smode.value,closed:sclosed.checked,open:sopen.value,close:sclose.value,m2:sm2.value,p1:sp1.value,min:+smin.value,openMin:+som.value,closeMin:+scm.value,breakMin:+sbm.value};save();storeModal(id);toast('Orario salvato')}function exceptionModal(id){openM('Eccezione orario per data',`<div class="form"><label>Data<input id="xd" type="date" value="${today()}"></label><label>Tipo<select id="xm"><option value="continuous">Continuato</option><option value="split">Spezzato</option></select></label><label>Chiuso<input id="xc" type="checkbox"></label><label>Min personale<input id="xn" type="number" value="0"></label><label>Apertura<input id="xo" type="time" value="08:30"></label><label>Chiusura<input id="xx" type="time" value="19:30"></label></div><button class="btn green" onclick="saveException('${id}')">Salva eccezione</button>`)}function saveException(id){let s=db.stores.find(x=>x.id===id);s.exceptions[xd.value]={mode:xm.value,closed:xc.checked,min:+xn.value,open:xo.value,close:xx.value};save();closeM();render()}
function shiftsPage(){let base=monday(), st=document.getElementById('sfStore')?.value||storesDefault[0].id;return `<div class="actions"><select id="sfStore" onchange="render()">${storesDefault.map(s=>`<option value="${s.id}" ${st===s.id?'selected':''}>${s.name}</option>`).join('')}</select><button class="btn" onclick="generateWeek('${st}')">⚙ Auto-genera</button><button class="btn green" onclick="publishWeek('${st}')">Pubblica settimana</button></div><div class="section week"><div><b>Lavoratore</b></div>${days.map((d,i)=>`<div><b>${d}</b><br>${dateAt(base,i)}</div>`).join('')}${db.employees.filter(e=>e.negozio===st&&(e.ruolo!==3||e.inTurni)).map(e=>`<div><b>${esc(e.nome)} ${esc(e.cognome)}</b></div>${days.map((d,i)=>{let sh=db.shifts.find(x=>String(x.emp)===String(e.id)&&x.date===dateAt(base,i)&&x.store===st);return `<div class="shift click" onclick="shiftModal('${e.id}','${dateAt(base,i)}','${st}')">${sh?(sh.type||'Turno')+'<br>'+esc(sh.in||'')+'–'+esc(sh.out||'')+(sh.published?' 🔔':''):'+'}</div>`}).join('')}`).join('')}</div>`}
function shiftModal(empId,date,store){let sh=db.shifts.find(x=>String(x.emp)===String(empId)&&x.date===date&&x.store===store)||{type:'Turno',in:'08:30',out:'19:30',pause:''};openM('Modifica turno',`<div class="form"><label>Tipo<select id="stt"><option>Turno</option><option>Riposo</option><option>Ferie</option><option>Malattia</option></select></label><label>Entrata<input id="sti" type="time" value="${sh.in||''}"></label><label>Uscita<input id="sto" type="time" value="${sh.out||''}"></label><label>Pausa<input id="stp" value="${esc(sh.pause||'')}"></label></div><button class="btn green" onclick="saveShift('${empId}','${date}','${store}',${sh.id||0})">Salva</button>${sh.id?` <button class="btn danger" onclick="deleteShift(${sh.id})">Cancella</button>`:''}`)}function saveShift(empId,date,store,id){let x={id:id||Date.now(),emp:+empId,date,store,type:stt.value,in:sti.value,out:sto.value,pause:stp.value,published:id?true:false};let i=db.shifts.findIndex(s=>s.id===x.id);if(i<0)db.shifts.push(x);else db.shifts[i]=x;notify(`Il tuo turno del ${date} è stato ${id?'modificato':'pubblicato'}`,empId);save();closeM();render()}function deleteShift(id){let s=db.shifts.find(x=>x.id===id);if(!s)return;db.shifts=db.shifts.filter(x=>x.id!==id);notify(`Il tuo turno del ${s.date} è stato cancellato`,s.emp);save();closeM();render()}function generateWeek(store){let base=monday();db.genCounter=(db.genCounter||0)+1;db.employees.filter(e=>e.negozio===store&&(e.ruolo!==3||e.inTurni)&&e.stato==='attivo').forEach((e,idx)=>days.forEach((d,i)=>{let fixed=(e.riposiFissi||[]).map(Number).includes(i);let sun=i===6&&e.domenica==='nessuna';if(fixed||sun)return;let date=dateAt(base,i),old=db.shifts.find(s=>s.emp===e.id&&s.date===date&&s.store===store);let inT=(db.genCounter+idx+i)%2?'08:30':'10:00',out=(e.uscita18&&((i+1)%(e.uscitaX||99)<=((e.uscitaN||0)))?'18:00':'19:30');let x={id:old?.id||Date.now()+idx+i,emp:e.id,date,store,type:'Turno',in:inT,out,pause:e.pausaTipo==='fissa'?`${e.pausaInizio||'12:00'}–${e.pausaFine||'13:30'}`:`${e.pausaMin||60} min`,published:false};if(old)Object.assign(old,x);else db.shifts.push(x)}));save();render();toast('Settimana generata')}function publishWeek(store){let base=monday();db.shifts.filter(s=>s.store===store&&s.date>=dateAt(base,0)&&s.date<=dateAt(base,6)).forEach(s=>{s.published=true;notify(`È stata pubblicata la settimana dei tuoi turni`,s.emp)});save();render();toast('Settimana pubblicata')}
function historyPage(){let sundays=[];for(let i=0;i<12;i++){let d=new Date();d.setDate(d.getDate()-((d.getDay())||7)-i*7);sundays.push(d.toISOString().slice(0,10))}let f=document.getElementById('hfEmp')?.value||'',emps=db.employees.filter(e=>(!f||String(e.id)===f)&&(user.ruolo===3||e.negozio===user.negozio));return `<div class="tabs"><button class="active">Domeniche lavorate</button><button onclick="subtab='weeks';render()">Settimane</button></div><div class="actions"><select id="hfEmp" onchange="render()"><option value="">Tutti i lavoratori</option>${emps.map(e=>`<option value="${e.id}" ${String(f)===String(e.id)?'selected':''}>${esc(e.nome)} ${esc(e.cognome)}</option>`).join('')}</select></div><div class="section card"><h3>Domeniche lavorate</h3><div class="matrix"><table><tr><th>Negozio / lavoratore</th>${sundays.map(d=>`<th>${d.slice(8,10)}/${d.slice(5,7)}</th>`).join('')}</tr>${storesDefault.map(st=>{let ee=emps.filter(e=>e.negozio===st.id);return ee.length?`<tr><th colspan="13">${st.name}</th></tr>`+ee.map(e=>`<tr><td>${esc(e.nome)} ${esc(e.cognome)}</td>${sundays.map(d=>{let w=db.shifts.some(s=>String(s.emp)===String(e.id)&&s.date===d&&s.type==='Turno');return `<td class="${w?'worked':''}">${w?'●':'—'}</td>`}).join('')}</tr>`).join(''):''}).join('')}</table></div></div>`}
function coursesPage(){return `<div class="actions"><button class="btn" onclick="courseModal()">+ Nuovo corso</button></div><div class="section tablewrap"><table class="table"><tr><th>Titolo</th><th>Ente</th><th>Obbligatorio</th><th>Sessioni</th><th></th></tr>${db.courses.map(c=>`<tr><td>${esc(c.title)}</td><td>${esc(c.ente)}</td><td>${c.required?'Sì':'No'}</td><td>${(c.sessions||[]).length}</td><td><button class="btn secondary" onclick="courseModal(${c.id})">Modifica</button></td></tr>`).join('')}</table></div>`}function courseModal(id){let c=id?db.courses.find(x=>x.id===id):{id:Date.now(),title:'',ente:'',desc:'',required:false,sessions:[],participants:[]};openM('Corso',`<div class="form"><label>Titolo<input id="ctitle" value="${esc(c.title)}"></label><label>Ente<input id="cente" value="${esc(c.ente)}"></label><label>Obbligatorio<input id="creq" type="checkbox" ${c.required?'checked':''}></label><label>Descrizione<textarea id="cdesc">${esc(c.desc)}</textarea></label></div><button class="btn green" onclick="saveCourse(${c.id})">Salva corso</button>`)}function saveCourse(id){let c=db.courses.find(x=>x.id===id)||{id};c.title=ctitle.value;c.ente=cente.value;c.required=creq.checked;c.desc=cdesc.value;if(!db.courses.some(x=>x.id===id))db.courses.push(c);save();closeM();render()}
function reportsPage(){return `<div class="grid"><div class="card"><b>Presenze mensili</b><div class="stat">${db.shifts.length}</div></div><div class="card"><b>Assenze registrate</b><div class="stat">${db.absences.length}</div></div></div><div class="section tablewrap"><table class="table"><tr><th>Lavoratore</th><th>Turni</th><th>Assenze</th></tr>${db.employees.map(e=>`<tr><td>${esc(e.nome)} ${esc(e.cognome)}</td><td>${db.shifts.filter(s=>s.emp===e.id).length}</td><td>${db.absences.filter(a=>a.emp===e.id).length}</td></tr>`).join('')}</table></div>`}
function notificationsPage(){let ns=db.notifications.filter(n=>n.emp==='all'||String(n.emp)===String(user.id));return `<div class="actions"><button class="btn" onclick="markRead()">Segna tutte lette</button></div><div class="section">${ns.length?ns.map(n=>`<div class="card section" style="opacity:${n.read?.55:1}"><b>${n.read?'':'● '}${esc(n.text)}</b><div class="muted">${new Date(n.date).toLocaleString('it-IT')}</div></div>`).join(''):'<div class="card">Nessuna notifica.</div>'}</div>`}function markRead(){db.notifications.forEach(n=>{if(n.emp==='all'||String(n.emp)===String(user.id))n.read=true});save();render()}
function profilePage(){return `<div class="card"><h3>${esc(user.nome||'')} ${esc(user.cognome||'')}</h3><p>${esc(user.email||'')}</p><p class="muted">${roles[user.ruolo]||''}</p></div>`}
function render(){let h=page==='dashboard'?dashboard():page==='employees'?employeesPage():page==='shifts'?shiftsPage():page==='history'?historyPage():page==='absences'?absencesPage():page==='stores'?storesPage():page==='courses'?coursesPage():page==='reports'?reportsPage():page==='notifications'?notificationsPage():profilePage();view.innerHTML=h}
nav();render();
</script></body></html>
