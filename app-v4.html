<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c62828"><title>B+ Gestionale HR</title><style>:root{--bg:#101114;--p:#191b20;--line:#30343b;--txt:#f5f6f8;--muted:#9da3ad;--red:#c62828;--green:#2e9b58;--gold:#8a6410}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{min-height:44px;cursor:pointer}.side{position:fixed;left:0;top:0;bottom:0;width:250px;background:#15171a;border-right:1px solid var(--line);padding:16px;z-index:20}.brand{display:none}.brand span{display:block;text-align:center}.brand i{color:#e53935;font-style:normal}.who,.card{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:14px}.who{margin-bottom:14px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c8ccd2;text-align:left;border-radius:9px;padding:11px}.nav button.active,.nav button:hover{background:#292d33;color:#fff}.main{margin-left:250px;padding:20px 24px 90px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.top h1{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--red);color:#fff;font-weight:750}.secondary{background:#363a40}.green{background:var(--green)}.danger{background:#6e2020}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.section{margin-top:15px}.muted{color:var(--muted);font-size:13px}.stat{font-size:28px;font-weight:900;margin-top:5px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:12px;color:#a5aab3}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:var(--p);color:#bbb;border-radius:9px;padding:8px 12px}.tabs button.active{background:#30343a;color:#fff}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:50;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.dialog{width:min(950px,100%);max-height:92vh;overflow:auto;background:#1a1c20;border:1px solid #3b3f46;border-radius:16px;padding:16px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form label{display:grid;gap:5px;color:#b5bac2;font-size:12px}.form input,.form select,.form textarea{background:#292d33;color:#fff;border:1px solid #454a52;border-radius:8px;padding:10px}.checks{display:flex;flex-wrap:wrap;gap:8px}.checks label{background:#25282d;padding:8px;border-radius:8px}.matrix{overflow:auto}.matrix table{border-collapse:collapse;min-width:950px}.matrix th,.matrix td{border:1px solid var(--line);padding:7px;text-align:center;white-space:nowrap}.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:#191b20;text-align:left}.worked{background:var(--gold);font-weight:800}.bottom{display:none}.hidden{display:none}@media(max-width:800px){.side{transform:translateX(-105%);transition:.2s;width:285px}.side.open{transform:none}.main{margin:0;padding:14px 12px 90px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bottom{display:grid;position:fixed;bottom:0;left:0;right:0;grid-template-columns:repeat(5,1fr);background:#15171a;border-top:1px solid var(--line);z-index:25;padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0;background:transparent;color:#aaa;font-size:10px}.bottom b{display:block;font-size:18px}.form{grid-template-columns:1fr}.modal{align-items:flex-end;padding:0}.dialog{width:100%;border-radius:18px 18px 0 0}.grid{gap:8px}}@media(max-width:460px){.grid{grid-template-columns:1fr}}</style></head><body><aside id="side" class="side"><div id="who" class="who"></div><nav id="nav" class="nav"></nav></aside><main class="main"><header class="top"><div><h1 id="title">Dashboard</h1><div class="muted">Versione stabile di test</div></div><div class="actions"><button class="btn secondary" onclick="toggleMenu()">☰</button><button class="btn" onclick="logout()">Esci</button></div></header><section id="view"></section></main><nav id="bottom" class="bottom"></nav><div id="modal" class="modal"><div class="dialog"><div class="top"><h2 id="mtitle"></h2><button class="btn secondary" onclick="closeModal()">Chiudi</button></div><div id="mbody"></div></div></div><script src="./auth-v3.js?build=20261002-login-v3"></script><script>
'use strict';
const auth=BPlusAuth.get();
if(!auth||!auth.uid||!auth.user){location.replace('./index.html?login=required');throw new Error('login required')}
const user=auth.user;const roles=['','Lavoratore','Direttore','Titolare'];const DAYS=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];const STORES=[['GAG','Gaggiolo'],['COC','Cocquio'],['DAV','Daverio'],['VAR','Varese']];const KEY='bplus_new_v4';
const defaults={employees:[],absences:[],shifts:[],notifications:[],stores:STORES.map(([id,name])=>({id,name,days:{},exceptions:{}})),courses:[]};let db=JSON.parse(localStorage.getItem(KEY)||'null')||defaults;for(const k of Object.keys(defaults))if(!db[k])db[k]=defaults[k];save();let page='dashboard';
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function today(){return new Date().toISOString().slice(0,10)}function toggleMenu(){side.classList.toggle('open')}function logout(){BPlusAuth.clear();location.replace('./index.html?logout=1')}function openModal(t,h){mtitle.textContent=t;mbody.innerHTML=h;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}
const P={dashboard:'Dashboard',employees:'Dipendenti',shifts:'Turni',history:'Storico turni',absences:'Assenze & Ferie',stores:'Punti vendita',courses:'Corsi',reports:'Report',notifications:'Notifiche',profile:'Profilo'};function allowed(p){if(user.ruolo===3)return true;if(user.ruolo===2)return ['dashboard','shifts','history','absences','notifications','profile'].includes(p);return ['dashboard','absences','notifications','profile'].includes(p)}function go(p){if(!allowed(p))return;page=p;side.classList.remove('open');title.textContent=P[p];buildNav();render()}
function buildNav(){nav.innerHTML=Object.entries(P).filter(([p])=>allowed(p)).map(([p,n])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${n}</button>`).join('');bottom.innerHTML=[['dashboard','⌂'],['shifts','▦'],['absences','🏖'],['notifications','🔔'],['menu','☰']].map(([p,i])=>`<button onclick="${p==='menu'?'toggleMenu()':`go('${p}')`}"><b>${i}</b>${p==='menu'?'Altro':P[p]}</button>`).join('');who.innerHTML=`<b>${esc(user.nome||'Utente')} ${esc(user.cognome||'')}</b><div class="muted">${roles[user.ruolo]||''}${user.negozio?' · '+esc(user.negozio):''}</div>`}
function dashboard(){return `<div class="grid"><div class="card"><div class="muted">Dipendenti</div><div class="stat">${db.employees.length}</div></div><div class="card"><div class="muted">Turni</div><div class="stat">${db.shifts.length}</div></div><div class="card"><div class="muted">Assenze</div><div class="stat">${db.absences.length}</div></div><div class="card"><div class="muted">Notifiche</div><div class="stat">${db.notifications.filter(n=>!n.read&&(n.emp==='all'||String(n.emp)===String(user.id))).length}</div></div></div><div class="section grid">${STORES.map(s=>`<div class="card"><b>${s[1]}</b><div class="muted">Configurazione punto vendita</div><button class="btn section" onclick="go('stores')">Apri</button></div>`).join('')}</div>`}
function employees(){if(user.ruolo!==3)return '<div class="card">Accesso non disponibile.</div>';return `<div class="actions"><button class="btn" onclick="employeeModal()">+ Nuovo lavoratore</button></div><div class="section tablewrap"><table class="table"><tr><th>Nome</th><th>Email</th><th>Ruolo</th><th>Negozio</th><th>Stato</th><th></th></tr>${db.employees.map(e=>`<tr><td>${esc(e.nome)} ${esc(e.cognome)}</td><td>${esc(e.email)}</td><td>${roles[e.ruolo]}</td><td>${esc(e.negozio)}</td><td>${esc(e.stato)}</td><td><button class="btn secondary" onclick="employeeModal(${e.id})">Apri</button></td></tr>`).join('')}</table></div>`}
function employeeModal(id){let e=id?db.employees.find(x=>x.id==id):{id:Date.now(),nome:'',cognome:'',email:'',telefono:'',ruolo:1,negozio:'GAG',stato:'attivo',inTurni:true,contratto:'indeterminato',ore:40,pausaTipo:'flessibile',pausaInizio:'12:00',pausaFine:'13:30',pausaMin:60,riposiFissi:[],compensativi:[],mobilita:[]};window._emp=e;openModal('Scheda lavoratore',`<div class="tabs"><button class="active" onclick="empTab('an')">Anagrafica</button><button onclick="empTab('ct')">Contratto & Turni</button><button onclick="empTab('as')">Assenze</button></div><div id="etab"></div>`);empTab('an')}
function empTab(t){let e=window._emp;if(t==='an')etab.innerHTML=`<div class="form"><label>Nome<input id="en" value="${esc(e.nome)}"></label><label>Cognome<input id="ec" value="${esc(e.cognome)}"></label><label>Email<input id="ee" value="${esc(e.email)}"></label><label>Telefono<input id="ephone" value="${esc(e.telefono)}"></label><label>Ruolo<select id="er">${[1,2,3].map(r=>`<option value="${r}" ${e.ruolo==r?'selected':''}>${roles[r]}</option>`).join('')}</select></label><label>Negozio<select id="estore">${STORES.map(s=>`<option value="${s[0]}" ${e.negozio===s[0]?'selected':''}>${s[1]}</option>`).join('')}</select></label><label>Stato<select id="estate">${['attivo','assente','ferie','malattia'].map(x=>`<option ${e.stato===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Includi nei turni<input id="eit" type="checkbox" ${e.inTurni?'checked':''}></label></div><button class="btn green section" onclick="saveEmployee()">Salva anagrafica</button>`;else if(t==='ct')etab.innerHTML=`<div class="form"><label>Contratto<select id="contract"><option>indeterminato</option><option>determinato</option><option>part-time</option></select></label><label>Ore settimanali<input id="hours" type="number" value="${e.ore||40}"></label><label>Tipo di pausa<select id="pauseType" onchange="pauseFields()"><option value="fissa" ${e.pausaTipo==='fissa'?'selected':''}>Fissa</option><option value="flessibile" ${e.pausaTipo!=='fissa'?'selected':''}>Flessibile</option></select></label><label id="fixedPause">Orario pausa (es. 12:00 / 13:30)<input id="pauseTime" value="${esc((e.pausaInizio||'12:00')+' / '+(e.pausaFine||'13:30'))}"></label><label id="flexPause">Durata pausa (minuti)<input id="pauseMin" type="number" value="${e.pausaMin||60}"></label></div><h3>Riposo fisso settimanale</h3><div class="checks">${DAYS.map((d,i)=>`<label><input class="rf" type="checkbox" value="${i}" ${(e.riposiFissi||[]).includes(String(i))?'checked':''}>${d}</label>`).join('')}</div><h3>Riposo compensativo se lavora la domenica</h3><div class="muted">Giorni possibili della stessa settimana; vengono esclusi i giorni di riposo fisso.</div><div class="checks">${DAYS.slice(0,6).map((d,i)=>`<label><input class="rc" type="checkbox" value="${i}" ${(e.compensativi||[]).includes(String(i))?'checked':''}>${d}</label>`).join('')}</div><h3>Mobilità</h3><div class="checks">${STORES.map(s=>`<label><input class="mob" type="checkbox" value="${s[0]}" ${(e.mobilita||[]).includes(s[0])?'checked':''}>${s[1]}</label>`).join('')}</div><button class="btn green section" onclick="saveContract()">Salva Contratto & Turni</button>`;else etab.innerHTML=`<button class="btn" onclick="absenceModal(${e.id})">+ Inserisci assenza</button><div class="section tablewrap"><table class="table"><tr><th>Tipo</th><th>Dal</th><th>Al</th><th>Stato</th></tr>${db.absences.filter(a=>String(a.emp)===String(e.id)).map(a=>`<tr><td>${a.tipo}</td><td>${a.da}</td><td>${a.a}</td><td>${a.stato}</td></tr>`).join('')}</table></div>`;if(t==='ct')pauseFields()}
function pauseFields(){let fixed=document.getElementById('pauseType').value==='fissa';document.getElementById('fixedPause').style.display=fixed?'grid':'none';document.getElementById('flexPause').style.display=fixed?'none':'grid'}
function saveEmployee(){let e=_emp;e.nome=en.value.trim();e.cognome=ec.value.trim();e.email=ee.value.trim();e.telefono=ephone.value.trim();e.ruolo=+er.value;e.negozio=estore.value;e.stato=estate.value;e.inTurni=eit.checked;upsertEmployee(e)}function saveContract(){let e=_emp;e.contratto=contract.value;e.ore=+hours.value;e.pausaTipo=pauseType.value;if(e.pausaTipo==='fissa'){let x=pauseTime.value.split('/').map(s=>s.trim());e.pausaInizio=x[0]||'12:00';e.pausaFine=x[1]||'13:30'}else e.pausaMin=+pauseMin.value;e.riposiFissi=[...document.querySelectorAll('.rf:checked')].map(x=>x.value);e.compensativi=[...document.querySelectorAll('.rc:checked')].map(x=>x.value).filter(x=>!e.riposiFissi.includes(x));e.mobilita=[...document.querySelectorAll('.mob:checked')].map(x=>x.value);upsertEmployee(e)}function upsertEmployee(e){let i=db.employees.findIndex(x=>x.id==e.id);if(i<0)db.employees.push(e);else db.employees[i]=e;save();closeModal();render()}
function absenceModal(emp){openModal('Nuova assenza',`<div class="form"><label>Tipo<select id="atype"><option>Ferie</option><option>Permesso</option><option>Malattia</option><option>Corso</option></select></label><label>Dal<input id="afrom" type="date" value="${today()}"></label><label>Al<input id="ato" type="date" value="${today()}"></label><label>Note<input id="anote"></label></div><button class="btn green section" onclick="saveAbs(${emp})">Salva</button>`)}function saveAbs(emp){db.absences.push({id:Date.now(),emp,tipo:atype.value,da:afrom.value,a:ato.value,note:anote.value,stato:user.ruolo>=2?'approvato':'in_attesa'});db.notifications.unshift({id:Date.now(),emp,text:'È stata inserita una nuova assenza',read:false,date:new Date().toISOString()});save();closeModal();render()}
function absences(){let selected=document.getElementById('filterEmp')?.value||'',type=document.getElementById('filterType')?.value||'',status=document.getElementById('filterStatus')?.value||'';let list=db.absences.filter(a=>(user.ruolo!==1||String(a.emp)===String(user.id))&&(!selected||String(a.emp)===selected)&&(!type||a.tipo===type)&&(!status||a.stato===status));return `<div class="actions"><select id="filterEmp" onchange="render()"><option value="">Tutti i lavoratori</option>${db.employees.map(e=>`<option value="${e.id}" ${String(selected)===String(e.id)?'selected':''}>${esc(e.nome)} ${esc(e.cognome)}</option>`).join('')}</select><select id="filterType" onchange="render()"><option value="">Tutti i tipi</option>${['Ferie','Permesso','Malattia','Corso'].map(x=>`<option ${type===x?'selected':''}>${x}</option>`).join('')}</select><select id="filterStatus" onchange="render()"><option value="">Tutti gli stati</option>${['in_attesa','approvato','rifiutato'].map(x=>`<option ${status===x?'selected':''}>${x}</option>`).join('')}</select>${user.ruolo===1?`<button class="btn" onclick="absenceModal(${user.id})">+ Richiedi</button>`:''}</div><div class="section tablewrap"><table class="table"><tr><th>Lavoratore</th><th>Tipo</th><th>Dal</th><th>Al</th><th>Stato</th><th></th></tr>${list.map(a=>{let e=db.employees.find(x=>x.id==a.emp);return `<tr><td>${e?esc(e.nome+' '+e.cognome):a.emp}</td><td>${a.tipo}</td><td>${a.da}</td><td>${a.a}</td><td>${a.stato}</td><td>${user.ruolo>=2&&a.stato==='in_attesa'?`<button class="btn green" onclick="answerAbs(${a.id},'approvato')">Approva</button> <button class="btn danger" onclick="answerAbs(${a.id},'rifiutato')">Rifiuta</button>`:''}</td></tr>`}).join('')}</table></div>`}function answerAbs(id,status){let a=db.absences.find(x=>x.id==id);if(a){a.stato=status;db.notifications.unshift({id:Date.now(),emp:a.emp,text:'La tua richiesta di assenza è stata '+(status==='approvato'?'approvata':'rifiutata'),read:false,date:new Date().toISOString()});save();render()}}
function storeModal(id,date){let s=db.stores.find(x=>x.id===id),d=date||'weekly-'+new Date().getDay(),v=(date?s.exceptions[date]:s.days[d])||{closed:false,mode:'continuato',open:'08:30',close:'20:00',mopen:1,mclose:1,mtotal:1,mpause:0,lunch1:'12:30',lunch2:'14:30'};openModal(s.name+' — '+(date||'orario standard'),`<div class="form"><label>Data specifica (opzionale)<input id="sdate" type="date" value="${date||''}"></label><label>Festivo / chiuso<input id="sclosed" type="checkbox" ${v.closed?'checked':''}></label><label>Dalle<input id="sopen" type="time" value="${v.open||'08:30'}"></label><label>Alle<input id="sclose" type="time" value="${v.close||'20:00'}"></label><label style="display:flex;align-items:center;gap:8px;background:#25282d;padding:10px;border-radius:8px"><input id="ssplit" type="checkbox" ${v.mode==='spezzato'?'checked':''} onchange="splitFields()"> Orario spezzato</label><div id="splitFields" style="display:${v.mode==='spezzato'?'contents':'none'}"><label>Pausa pranzo dalle<input id="sl1" type="time" value="${v.lunch1||'12:30'}"></label><label>Pausa pranzo alle<input id="sl2" type="time" value="${v.lunch2||'14:30'}"></label></div><label>Min. personale giornaliero<input id="smt" type="number" min="0" value="${v.mtotal??1}"></label><label>Min. persone in apertura<input id="smo" type="number" min="0" value="${v.mopen??1}"></label><label>Min. persone in chiusura<input id="smc" type="number" min="0" value="${v.mclose??1}"></label><label>Min. persone in pausa<input id="smp" type="number" min="0" value="${v.mpause??0}"></label></div><button class="btn green section" onclick="saveStore('${id}','${date||''}')">Salva</button>`)}function splitFields(){let f=document.getElementById('splitFields');if(f)f.style.display=document.getElementById('ssplit').checked?'contents':'none'}function saveStore(id,date){let s=db.stores.find(x=>x.id===id);let split=document.getElementById('ssplit').checked;let v={closed:sclosed.checked,mode:split?'spezzato':'continuato',open:sopen.value,close:sclose.value,lunch1:document.getElementById('sl1')?.value||'12:30',lunch2:document.getElementById('sl2')?.value||'14:30',mtotal:+smt.value,mopen:+smo.value,mclose:+smc.value,mpause:+smp.value};let actual=sdate.value;if(actual){s.exceptions[actual]=v}else{s.days['weekly-'+new Date().getDay()]=v}save();closeModal();render()}
function stores(){if(user.ruolo!==3)return '<div class="card">Accesso non disponibile.</div>';return db.stores.map(s=>`<div class="section card"><div class="top"><h3>${esc(s.name)}</h3><button class="btn" onclick="storeModal('${s.id}')">Modifica giorno</button></div><div class="tablewrap"><table class="table"><tr><th>Giorno</th><th>Orario</th><th>Festivo</th><th>Min giornaliero</th><th>Min apertura</th><th>Min chiusura</th><th>Min pausa</th><th></th></tr>${DAYS.map((d,i)=>{let v=s.days['weekly-'+i]||{};return `<tr><td>${d}</td><td>${v.closed?'CHIUSO':(v.mode==='spezzato'?'Spezzato '+(v.lunch1||'')+'–'+(v.lunch2||'')+' / '+(v.open2||'')+'–'+(v.close2||''):(v.open||'—')+'–'+(v.close||'—'))}</td><td>${v.closed?'Sì':'No'}</td><td>${v.mtotal??'—'}</td><td>${v.mopen??'—'}</td><td>${v.mclose??'—'}</td><td>${v.mpause??'—'}</td><td><button class="btn secondary" onclick="storeModal('${s.id}','')">Modifica</button></td></tr>`}).join('')}</table></div><div class="actions section"><input id="ex_${s.id}" type="date"><button class="btn secondary" onclick="storeModal('${s.id}',document.getElementById('ex_${s.id}').value)">Modifica data specifica</button></div></div>`).join('')}
function history(){let sundays=[];let d=new Date();d.setDate(d.getDate()-((d.getDay()||7)));for(let i=0;i<12;i++){let x=new Date(d);x.setDate(d.getDate()-i*7);sundays.push(x.toISOString().slice(0,10))}let es=db.employees.filter(e=>user.ruolo===3||e.negozio===user.negozio);return `<div class="card"><h3>Domeniche lavorate</h3><div class="matrix"><table><tr><th>Negozio / lavoratore</th>${sundays.map(x=>`<th>${x.slice(8,10)}/${x.slice(5,7)}</th>`).join('')}</tr>${STORES.map(st=>{let ee=es.filter(e=>e.negozio===st[0]);return ee.length?`<tr><th colspan="13">${st[1]}</th></tr>`+ee.map(e=>`<tr><td>${esc(e.nome)} ${esc(e.cognome)}</td>${sundays.map(x=>{let w=db.shifts.some(s=>String(s.emp)===String(e.id)&&s.date===x&&s.type!=='Riposo');return `<td class="${w?'worked':''}">${w?'●':'—'}</td>`}).join('')}</tr>`).join(''):''}).join('')}</table></div></div>`}
function shifts(){return `<div class="card"><h3>Turni</h3><p class="muted">Sezione pronta per il test. I turni presenti in archivio alimentano anche lo storico domeniche.</p><div class="tablewrap"><table class="table"><tr><th>Data</th><th>Lavoratore</th><th>Negozio</th><th>Entrata</th><th>Uscita</th><th>Tipo</th></tr>${db.shifts.map(s=>{let e=db.employees.find(x=>x.id==s.emp);return `<tr><td>${s.date}</td><td>${e?esc(e.nome+' '+e.cognome):s.emp}</td><td>${s.store}</td><td>${s.in||''}</td><td>${s.out||''}</td><td>${s.type||'Turno'}</td></tr>`}).join('')}</table></div></div>`}
function notifications(){let ns=db.notifications.filter(n=>n.emp==='all'||String(n.emp)===String(user.id));return `<div class="actions"><button class="btn" onclick="db.notifications.forEach(n=>{if(n.emp==='all'||String(n.emp)===String(user.id))n.read=true});save();render()">Segna tutte lette</button></div>${ns.map(n=>`<div class="card section"><b>${n.read?'':'● '}${esc(n.text)}</b><div class="muted">${new Date(n.date).toLocaleString('it-IT')}</div></div>`).join('')||'<div class="card section">Nessuna notifica.</div>'}`}
function profile(){return `<div class="card"><h3>${esc(user.nome||'')} ${esc(user.cognome||'')}</h3><p>${esc(user.email||'')}</p><p class="muted">${roles[user.ruolo]||''}</p></div>`}function courses(){return '<div class="card"><h3>Corsi</h3><p>Gestione corsi disponibile per i test.</p></div>'}function reports(){return `<div class="grid"><div class="card"><b>Presenze</b><div class="stat">${db.shifts.length}</div></div><div class="card"><b>Assenze</b><div class="stat">${db.absences.length}</div></div></div>`}
function render(){let h=page==='dashboard'?dashboard():page==='employees'?employees():page==='shifts'?shifts():page==='history'?history():page==='absences'?absences():page==='stores'?stores():page==='courses'?courses():page==='reports'?reports():page==='notifications'?notifications():profile();view.innerHTML=h}buildNav();render();
</script></body></html>
