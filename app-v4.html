<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c62828"><title>B+ Gestionale HR</title><style>:root{--bg:#101114;--p:#191b20;--line:#30343b;--txt:#f5f6f8;--muted:#9da3ad;--red:#c62828;--green:#2e9b58;--gold:#8a6410}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{min-height:44px;cursor:pointer}.side{position:fixed;left:0;top:0;bottom:0;width:250px;background:#15171a;border-right:1px solid var(--line);padding:16px;z-index:20}.brand{text-align:center;margin-bottom:14px}.simple-logo{display:flex;align-items:center;justify-content:center;width:82px;height:82px;margin:0 auto 10px;background:#e30613;color:#ffe900;border-radius:10px;font-size:38px;font-weight:900;line-height:1;letter-spacing:-4px;font-style:normal}.brand span{display:block;text-align:center}.brand i{color:#e53935;font-style:normal}.who,.card{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:14px}.who{margin-bottom:14px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c8ccd2;text-align:left;border-radius:9px;padding:11px}.nav button.active,.nav button:hover{background:#292d33;color:#fff}.main{margin-left:250px;padding:20px 24px 90px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.top h1{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--red);color:#fff;font-weight:750}.secondary{background:#363a40}.green{background:var(--green)}.danger{background:#6e2020}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.section{margin-top:15px}.muted{color:var(--muted);font-size:13px}.stat{font-size:28px;font-weight:900;margin-top:5px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:12px;color:#a5aab3}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:var(--p);color:#bbb;border-radius:9px;padding:8px 12px}.tabs button.active{background:#30343a;color:#fff}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:50;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.dialog{width:min(950px,100%);max-height:92vh;overflow:auto;background:#1a1c20;border:1px solid #3b3f46;border-radius:16px;padding:16px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form label{display:grid;gap:5px;color:#b5bac2;font-size:12px}.form input,.form select,.form textarea{background:#292d33;color:#fff;border:1px solid #454a52;border-radius:8px;padding:10px}.checks{display:flex;flex-wrap:wrap;gap:8px}.checks label{background:#25282d;padding:8px;border-radius:8px}.matrix{overflow:auto}.matrix table{border-collapse:collapse;min-width:950px}.matrix th,.matrix td{border:1px solid var(--line);padding:7px;text-align:center;white-space:nowrap}.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:#191b20;text-align:left}.worked{background:var(--gold);font-weight:800}.bottom{display:none}.hidden{display:none}@media(max-width:800px){.side{transform:translateX(-105%);transition:.2s;width:285px}.side.open{transform:none}.main{margin:0;padding:14px 12px 90px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bottom{display:grid;position:fixed;bottom:0;left:0;right:0;grid-template-columns:repeat(5,1fr);background:#15171a;border-top:1px solid var(--line);z-index:25;padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0;background:transparent;color:#aaa;font-size:10px}.bottom b{display:block;font-size:18px}.form{grid-template-columns:1fr}.modal{align-items:flex-end;padding:0}.dialog{width:100%;border-radius:18px 18px 0 0}.grid{gap:8px}}@media(max-width:460px){.grid{grid-template-columns:1fr}}</style></head><body><aside id="side" class="side"><div class="brand"><div class="simple-logo" aria-label="B+">B+</div><span>B+ Gestionale HR</span></div><div id="who" class="who"></div><nav id="nav" class="nav"></nav></aside><main class="main"><header class="top"><div><h1 id="title">Dashboard</h1><div class="muted">Versione HR completa</div></div><div class="actions"><button class="btn secondary" onclick="toggleMenu()">☰</button><button class="btn" onclick="logout()">Esci</button></div></header><section id="view"></section></main><nav id="bottom" class="bottom"></nav><div id="modal" class="modal"><div class="dialog"><div class="top"><h2 id="mtitle"></h2><button class="btn secondary" onclick="closeModal()">Chiudi</button></div><div id="mbody"></div></div></div><script src="./auth-v3.js?build=20261002-login-v3"></script><script>
'use strict';
const auth=BPlusAuth.get();
if(!auth||!auth.uid||!auth.user){location.replace('./index.html?login=required');throw new Error('login required')}
const user=auth.user;const roles=['','Lavoratore','Direttore','Titolare'];const DAYS=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];const STORES=[['GAG','Gaggiolo'],['COC','Cocquio'],['DAV','Daverio'],['VAR','Varese']];const KEY='bplus_new_v4';
const defaults={employees:[],absences:[],shifts:[],notifications:[],stores:STORES.map(([id,name])=>({id,name,days:{},exceptions:{}})),courses:[]};let db=JSON.parse(localStorage.getItem(KEY)||'null')||defaults;for(const k of Object.keys(defaults))if(!db[k])db[k]=defaults[k];if(!Array.isArray(db.board))db.board=[];if(!Array.isArray(db.audit))db.audit=[];if(!Array.isArray(db.calendarEvents))db.calendarEvents=[];if(!db.shiftWeeks||typeof db.shiftWeeks!=='object')db.shiftWeeks={};save();let page='dashboard';
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function today(){return new Date().toISOString().slice(0,10)}function toggleMenu(){side.classList.toggle('open')}function logout(){BPlusAuth.clear();location.replace('./index.html?logout=1')}function openModal(t,h){mtitle.textContent=t;mbody.innerHTML=h;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}
const P={dashboard:'Dashboard',employees:'Dipendenti',shifts:'Turni',history:'Storico turni',calendar:'Calendario HR',absences:'Ferie & Permessi',stores:'Punti vendita',courses:'Corsi',board:'Bacheca',reports:'Report',notifications:'Notifiche',audit:'Audit log',backup:'Backup & Sincronizzazione',profile:'Profilo'};function allowed(p){if(user.ruolo===3)return true;if(user.ruolo===2)return ['dashboard','employees','shifts','history','calendar','absences','courses','board','reports','notifications','profile'].includes(p);return ['dashboard','calendar','absences','courses','board','notifications','profile'].includes(p)}function go(p){if(!allowed(p))return;page=p;side.classList.remove('open');title.textContent=P[p];buildNav();render()}
function buildNav(){nav.innerHTML=Object.entries(P).filter(([p])=>allowed(p)).map(([p,n])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${n}</button>`).join('');bottom.innerHTML=[['dashboard','⌂'],['calendar','📅'],['notifications','🔔'],['menu','☰']].map(([p,i])=>`<button onclick="${p==='menu'?'toggleMenu()':`go('${p}')`}"><b>${i}</b>${p==='menu'?'Menu':P[p]}</button>`).join('');who.innerHTML=`<b>${esc(user.nome||'Utente')} ${esc(user.cognome||'')}</b><div class="muted">${roles[user.ruolo]||''}${user.negozio?' · '+esc(user.negozio):''}</div>`}
function dashboard(){const pending=db.absences.filter(a=>a.stato==='in_attesa'&&(user.ruolo>=2||String(a.emp)===String(user.id))).length;const exp=db.courses.filter(c=>courseState(c)==='in_scadenza'&&(user.ruolo!==1||String(c.emp)===String(user.id))).length;return '<div class="grid"><div class="card"><div class="muted">Dipendenti</div><div class="stat">'+db.employees.length+'</div></div><div class="card"><div class="muted">Turni</div><div class="stat">'+db.shifts.length+'</div></div><div class="card"><div class="muted">Richieste in attesa</div><div class="stat">'+pending+'</div></div><div class="card"><div class="muted">Scadenze formazione</div><div class="stat">'+exp+'</div></div></div><div class="section grid">'+STORES.map(s=>'<div class="card"><b>'+s[1]+'</b><div class="muted">Configurazione punto vendita</div><button class="btn section" onclick="go(\\'stores\\')">Apri</button></div>').join('')+'</div>'}
function shiftWeekKey(date){const d=new Date(date+'T12:00:00');const day=d.getDay()||7;d.setDate(d.getDate()-day+1);return d.toISOString().slice(0,10)}
function shiftWeekDates(week){const d=new Date(week+'T12:00:00');return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return x.toISOString().slice(0,10)})}
function weekLabel(week){const ds=shiftWeekDates(week);return ds[0].slice(8,10)+'/'+ds[0].slice(5,7)+' – '+ds[6].slice(8,10)+'/'+ds[6].slice(5,7)}
function shiftStores(){return STORES.map(s=>s[0])}
function weekStoreState(week,store){if(!db.shiftWeeks||typeof db.shiftWeeks!=='object')db.shiftWeeks={};if(!db.shiftWeeks[week]||typeof db.shiftWeeks[week]!=='object')db.shiftWeeks[week]={};if(!db.shiftWeeks[week][store])db.shiftWeeks[week][store]={status:'bozza'};return db.shiftWeeks[week][store]}
function weekStoreStatus(week,store){return weekStoreState(week,store).status||'bozza'}
function allStoresDirectorApproved(week){return shiftStores().every(s=>['approvata_direttore','inviato_titolare','approvata_titolare'].includes(weekStoreStatus(week,s)))}
function allStoresOwnerApproved(week){return shiftStores().every(s=>weekStoreStatus(week,s)==='approvata_titolare')}
function approvedAbsence(emp,date){return db.absences.some(a=>String(a.emp)===String(emp)&&a.stato==='approvato'&&date>=a.da&&date<=a.a)}
function sundayPolicy(emp){return emp.policyDomeniche||'ogni2'}
function isSunday(date){return new Date(date+'T12:00:00').getDay()===0}
function sundayShiftExists(emp,date){return db.shifts.some(s=>String(s.emp)===String(emp)&&s.date===date&&s.type==='Turno')}
function sundayDatesAround(date){const d=new Date(date+'T12:00:00');const out=[];for(let i=-12;i<=12;i++){const x=new Date(d);x.setDate(d.getDate()+i*7);out.push(x.toISOString().slice(0,10))}return out}
function sundayCanWork(emp,date){
  if(!isSunday(date))return true;
  const policy=sundayPolicy(emp);
  if(policy==='tutte')return true;
  if(policy==='nessuna')return false;
  const d=new Date(date+'T12:00:00');
  if(policy==='ogni3'){
    const prev=new Date(d);prev.setDate(d.getDate()-14);
    const p=prev.toISOString().slice(0,10);
    return !sundayShiftExists(emp,p);
  }
  // 1 ogni 2 = alternanza normale. Se per un'eccezione il lavoratore
  // ha già lavorato due domeniche consecutive, le due domeniche successive
  // diventano di riposo: W-W-O-O-W, poi si riprende l'alternanza.
  const sundays=[];
  for(let i=1;i<=12;i++){
    const x=new Date(d);
    x.setDate(d.getDate()-7*i);
    sundays.push(x.toISOString().slice(0,10));
  }
  const worked=i=>sundayShiftExists(emp,sundays[i-1]);

  // Due domeniche consecutive già lavorate => questa è la prima delle
  // due domeniche di recupero obbligatorie.
  if(worked(1)&&worked(2))return false;

  // Se le due domeniche precedenti sono state di riposo e le due ancora
  // precedenti sono state lavorate, questa è la ripresa dopo il recupero.
  if(!worked(1)&&!worked(2)&&worked(3)&&worked(4))return true;

  // Alternanza ordinaria: lavoro/riposo/lavoro/riposo.
  const lastWorkedIndex=sundays.findIndex(x=>sundayShiftExists(emp,x));
  if(lastWorkedIndex<0)return true;
  return lastWorkedIndex%2===1;
}
function courseOnDate(emp,date){return db.courses.find(c=>String(c.emp)===String(emp)&&c.data===date&&(c.stato==='programmato'||c.stato==='in corso'||c.stato==='completato'))||null}
function storeDay(store,date){const s=db.stores.find(x=>x.id===store);if(!s)return null;const d=new Date(date+'T12:00:00').getDay();return (s.exceptions&&s.exceptions[date])||((s.days&&s.days['weekly-'+d])||null)}
function addMinutesToTime(t,min){const q=t.split(':').map(Number);let n=q[0]*60+q[1]+min;return String(Math.floor((n+1440)%1440/60)).padStart(2,'0')+':'+String((n+1440)%60).padStart(2,'0')}
function generateWeekModal(){if(user.ruolo!==3)return;const w=shiftWeekKey(todayDate());openModal('Genera settimana turni','<div class="form"><label>Settimana<input id="genWeek" type="date" value="'+w+'"></label><label>Punto vendita<select id="genStore"><option value="">Tutti i punti vendita</option>'+STORES.map(s=>'<option value="'+s[0]+'">'+s[1]+'</option>').join('')+'</select></label><label style="grid-column:1/-1"><input id="genReplace" type="checkbox"> Sostituisci i turni esistenti</label></div><div class="card section"><b>La generazione considera:</b><ul><li>assenze approvate</li><li>corsi programmati/in corso/completati</li><li>riposi fissi</li><li>ore settimanali</li><li>orari di apertura</li><li>policy domeniche del lavoratore</li></ul></div><div class="actions section"><button class="btn green" onclick="generateWeek()">Genera turni</button></div>')}
function generateWeek(){const week=shiftWeekKey(genWeek.value),onlyStore=genStore.value,dates=shiftWeekDates(week);if(!db.shiftWeeks||typeof db.shiftWeeks!=='object')db.shiftWeeks={};if(genReplace.checked)db.shifts=db.shifts.filter(s=>!dates.includes(s.date)||(onlyStore&&s.store!==onlyStore));db.shiftWeeks[week]={};let created=0;const stores=onlyStore?[onlyStore]:shiftStores();for(const store of stores){db.shiftWeeks[week][store]={status:'bozza'};const workers=db.employees.filter(e=>e.stato==='attivo'&&e.inTurni!==false&&(e.negozio===store||(Array.isArray(e.mobilita)&&e.mobilita.includes(store))));for(const e of workers){let target=Math.max(0,Number(e.ore)||40),assigned=0;for(const date of dates){if(assigned>=target)break;const h=storeDay(store,date);if(!h||h.closed)continue;const day=new Date(date+'T12:00:00').getDay();if((e.riposiFissi||[]).includes(String(day)))continue;if(approvedAbsence(e.id,date))continue;if(day===0&&!sundayCanWork(e,date))continue;const co=courseOnDate(e.id,date);if(co){if(!db.shifts.some(s=>String(s.emp)===String(e.id)&&s.date===date&&s.store===store&&s.type==='Corso')){db.shifts.push({id:Date.now()+created,emp:e.id,date,store,in:'',out:'',type:'Corso',note:co.titolo||'Corso'});created++}continue}const q=a=>{const z=a.split(':').map(Number);return z[0]*60+z[1]},open=h.open||'08:30',close=h.close||'17:30',duration=Math.min(8,target-assigned,Math.max(1,(q(close)-q(open))/60));db.shifts.push({id:Date.now()+created,emp:e.id,date,store,in:open,out:addMinutesToTime(open,Math.round(duration*60)),type:'Turno',note:'Generato automaticamente'});assigned+=duration}}}audit('Turni','Generata settimana '+week+' · '+created+' elementi');save();closeModal();render();alert('Settimana generata. Controlla i turni e poi inviali ai Direttori.')}
function sendWeekToDirectors(week){if(user.ruolo!==3)return;for(const s of shiftStores())weekStoreState(week,s).status='inviato_direttore';db.notifications=db.notifications||[];for(const e of db.employees.filter(x=>x.ruolo===2))db.notifications.push({id:Date.now()+Math.random(),emp:e.id,date:new Date().toISOString(),read:false,text:'Turni '+weekLabel(week)+' inviati per il controllo del tuo negozio.'});audit('Turni','Invio settimana '+week+' ai Direttori');save();render()}
function approveStoreWeek(week,store){if(user.ruolo!==2||String(store)!==String(user.negozio)||weekStoreStatus(week,store)!=='inviato_direttore')return;if(!confirm('Approvare i turni del tuo negozio per '+weekLabel(week)+'?'))return;weekStoreState(week,store).status='approvata_direttore';audit('Turni','Approvazione Direttore '+store+' · '+week);save();render()}
function sendWeeksToOwner(week){if(user.ruolo!==3||!allStoresDirectorApproved(week))return;for(const s of shiftStores())weekStoreState(week,s).status='inviato_titolare';db.notifications=db.notifications||[];db.notifications.push({id:Date.now(),emp:user.id,date:new Date().toISOString(),read:false,text:'Tutte le settimane '+weekLabel(week)+' sono state approvate dai Direttori e sono pronte per la tua approvazione.'});audit('Turni','Invio tutte le settimane '+week+' al Titolare');save();render()}
function approveAllWeeksByOwner(week){if(user.ruolo!==3||!shiftStores().every(s=>weekStoreStatus(week,s)==='inviato_titolare'))return;if(!confirm('Approvare tutte le settimane dei negozi per '+weekLabel(week)+'?'))return;for(const s of shiftStores())weekStoreState(week,s).status='approvata_titolare';db.notifications=db.notifications||[];for(const e of db.employees.filter(x=>x.ruolo===2))db.notifications.push({id:Date.now()+Math.random(),emp:e.id,date:new Date().toISOString(),read:false,text:'Turni '+weekLabel(week)+' approvati dal Titolare. Ora puoi stamparli.'});audit('Turni','Approvazione Titolare '+week);save();render()}
function printShiftWeek(week){if(user.ruolo<2)return;const store=user.ruolo===2?user.negozio:null;if(user.ruolo===2&&weekStoreStatus(week,store)!=='approvata_titolare'){alert('Il Titolare deve prima approvare i turni del tuo negozio.');return}if(user.ruolo===3&&!allStoresOwnerApproved(week)){alert('Prima devono essere approvate tutte le settimane dei negozi.');return}const dates=shiftWeekDates(week),list=db.shifts.filter(s=>dates.includes(s.date)&&(!store||s.store===store));const emps=[...new Map(list.map(s=>[String(s.emp),s.emp])).values()].map(id=>db.employees.find(e=>String(e.id)===String(id))).filter(Boolean);const rows=emps.map(e=>'<tr><td><b>'+esc(e.cognome+' '+e.nome)+'</b></td>'+dates.map(d=>'<td>'+list.filter(s=>String(s.emp)===String(e.id)&&s.date===d).map(s=>esc((s.type==='Turno'?(s.in||'')+'–'+(s.out||''):s.type)+(s.note?' · '+s.note:''))).join('<br>')+'</td>').join('')+'</tr>').join('');const head=dates.map(d=>{const x=new Date(d+'T12:00:00');return '<th>'+['Dom','Lun','Mar','Mer','Gio','Ven','Sab'][x.getDay()]+'<br>'+d.slice(8,10)+'/'+d.slice(5,7)+'</th>'}).join('');const html='<!doctype html><html><head><meta charset="utf-8"><title>Turni '+weekLabel(week)+'</title><style>body{font-family:Arial;margin:24px;color:#111}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #bbb;padding:7px;text-align:center;vertical-align:top}th:first-child,td:first-child{text-align:left;min-width:170px}th{background:#eee}</style></head><body><h1>B+ Gestionale HR — Turni</h1><p>Settimana '+weekLabel(week)+(store?' · Negozio '+esc(store):'')+' · Approvata dal Titolare</p><table><tr><th>Lavoratore</th>'+head+'</tr>'+(rows||'<tr><td colspan="8">Nessun turno</td></tr>')+'</table></body></html>';const w=window.open('','_blank');if(!w){alert('Consenti i popup per la stampa.');return}w.document.write(html);w.document.close();setTimeout(()=>w.print(),250);audit('Turni','Stampa settimana '+week+(store?' · '+store:''));save()}
function shiftModal(id){let x=id?db.shifts.find(s=>String(s.id)===String(id)):{id:Date.now(),emp:'',date:todayDate(),store:user.negozio||'GAG',in:'08:30',out:'17:30',type:'Turno',note:''};if(user.ruolo===2&&(x.store!==user.negozio))return;window._shift=x;openModal(id?'Modifica turno':'Nuovo turno','<div class="form"><label>Lavoratore<select id="shEmp">'+db.employees.filter(e=>user.ruolo===3||e.negozio===user.negozio).map(e=>'<option value="'+e.id+'" '+(String(x.emp)===String(e.id)?'selected':'')+'>'+esc(e.nome+' '+e.cognome)+'</option>').join('')+'</select></label><label>Data<input id="shDate" type="date" value="'+x.date+'"></label><label>Punto vendita<select id="shStore">'+STORES.filter(st=>user.ruolo===3||st[0]===user.negozio).map(st=>'<option value="'+st[0]+'" '+(x.store===st[0]?'selected':'')+'>'+st[1]+'</option>').join('')+'</select></label><label>Entrata<input id="shIn" type="time" value="'+(x.in||'')+'"></label><label>Uscita<input id="shOut" type="time" value="'+(x.out||'')+'"></select></label><label>Tipo<select id="shType">'+['Turno','Riposo','Ferie','Corso'].map(t=>'<option '+(x.type===t?'selected':'')+'>'+t+'</option>').join('')+'</select></label><label style="grid-column:1/-1">Note<textarea id="shNote">'+esc(x.note||'')+'</textarea></label></div><div class="actions section"><button class="btn green" onclick="saveShift()">Salva turno</button></div>')}
function saveShift(){let x=window._shift;if(user.ruolo===2&&x.store!==user.negozio)return;x.emp=shEmp.value;x.date=shDate.value;x.store=shStore.value;x.in=shIn.value;x.out=shOut.value;x.type=shType.value;x.note=shNote.value;let i=db.shifts.findIndex(s=>String(s.id)===String(x.id));if(i<0)db.shifts.push(x);else db.shifts[i]=x;const w=shiftWeekKey(x.date),st=weekStoreState(w,x.store);if(user.ruolo===2)st.status='inviato_direttore';else st.status='bozza';audit('Turno','Modificato '+x.date+' · '+x.store+' · '+empName(x.emp));save();closeModal();render()}
function shifts(){let selected=document.getElementById('shiftWeek')?.value||shiftWeekKey(todayDate()),list=db.shifts.filter(s=>shiftWeekKey(s.date)===selected&&(user.ruolo===3||s.store===user.negozio));let controls='<div class="actions"><label class="muted">Settimana<input id="shiftWeek" type="date" value="'+selected+'" onchange="render()" style="margin-left:6px;background:#292d33;color:#fff;border:1px solid #454a52;border-radius:8px;padding:10px"></label>';if(user.ruolo===3){controls+='<button class="btn" onclick="generateWeekModal()">⚙ Genera settimana</button><button class="btn" onclick="sendWeekToDirectors(&quot;'+selected+'&quot;)">📨 Invia ai Direttori</button>';if(allStoresDirectorApproved(selected))controls+='<button class="btn" onclick="sendWeeksToOwner(&quot;'+selected+'&quot;)">📨 Invia tutte al Titolare</button>';if(shiftStores().every(s=>weekStoreStatus(selected,s)==='inviato_titolare'))controls+='<button class="btn green" onclick="approveAllWeeksByOwner(&quot;'+selected+'&quot;)">✓ Approva tutte le settimane</button>'}else if(user.ruolo===2){const st=weekStoreStatus(selected,user.negozio);if(st==='inviato_direttore')controls+='<button class="btn green" onclick="approveStoreWeek(&quot;'+selected+'&quot;,&quot;'+user.negozio+'&quot;)">✓ Approva settimana del negozio</button>';if(st==='approvata_titolare')controls+='<button class="btn secondary" onclick="printShiftWeek(&quot;'+selected+'&quot;)">🖨 Stampa turni</button>';if(st==='inviato_direttore')controls+='<button class="btn" onclick="shiftModal()">+ Modifica turno</button>'}controls+='</div><div class="card section"><b>Settimana '+weekLabel(selected)+'</b><div class="muted">'+(user.ruolo===3?'Genera → invia ai Direttori → controllo/modifica negozio → approvazione Direttore → invio al Titolare → approvazione Titolare':'Controlla/modifica il tuo negozio → approva → attende approvazione Titolare')+'</div></div>';return controls+'<div class="section tablewrap"><table class="table"><tr><th>Data</th><th>Lavoratore</th><th>Negozio</th><th>Entrata</th><th>Uscita</th><th>Tipo</th><th></th></tr>'+list.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>'<tr><td>'+x.date+'</td><td>'+esc(empName(x.emp))+'</td><td>'+esc(x.store)+'</td><td>'+x.in+'</td><td>'+x.out+'</td><td>'+x.type+'</td><td><button class="btn secondary" onclick="shiftModal(&quot;'+x.id+'&quot;)">Apri</button></td></tr>').join('')+'</table></div>'}
function board(){const now=todayDate();let list=db.board.filter(b=>(!b.exp||b.exp>=now)&&(b.target==='all'||b.target===user.negozio||b.target==='u:'+user.id||user.ruolo>=2));return '<div class="actions">'+(user.ruolo>=2?'<button class="btn" onclick="boardModal()">+ Nuova comunicazione</button>':'')+'</div>'+list.map(b=>'<div class="card section"><h3>'+esc(b.title)+'</h3><div style="white-space:pre-wrap">'+esc(b.body)+'</div><div class="muted section">'+new Date(b.at).toLocaleString('it-IT')+(b.exp?' · fino al '+b.exp:'')+'</div></div>').join('')||'<div class="card section">Nessuna comunicazione.</div>'}
function auditPage(){if(user.ruolo!==3)return '<div class="card">Accesso non disponibile.</div>';return '<div class="card"><h3>Audit log</h3><div class="tablewrap"><table class="table"><tr><th>Data</th><th>Utente</th><th>Azione</th><th>Dettaglio</th></tr>'+db.audit.map(a=>'<tr><td>'+new Date(a.at).toLocaleString('it-IT')+'</td><td>'+esc(a.name)+'</td><td>'+esc(a.action)+'</td><td>'+esc(a.detail)+'</td></tr>').join('')+'</table></div></div>'}
function exportCsv(kind){let rows=[];if(kind==='assenze'){rows=[['Lavoratore','Tipo','Dal','Al','Stato','Note'],...db.absences.map(a=>[empName(a.emp),a.tipo,a.da,a.a,a.stato,a.note||''])]}else{rows=[['Lavoratore','Corso','Categoria','Data','Scadenza','Stato'],...db.courses.map(c=>[empName(c.emp),c.titolo,c.categoria,c.data,c.scadenza,courseState(c)])]}const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='bplus-'+kind+'-'+todayDate()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),500);audit('Export','CSV '+kind);save()}
function reports(){return '<div class="grid"><div class="card"><b>Assenze</b><div class="stat">'+db.absences.length+'</div></div><div class="card"><b>Formazione</b><div class="stat">'+db.courses.length+'</div></div><div class="card"><b>Turni</b><div class="stat">'+db.shifts.length+'</div></div></div><div class="section card"><h3>Esportazioni</h3><div class="actions"><button class="btn secondary" onclick="exportCsv(\'assenze\')">Assenze CSV / Excel</button><button class="btn secondary" onclick="exportCsv(\'corsi\')">Corsi CSV / Excel</button><button class="btn green" onclick="printReport()">Stampa / PDF</button></div></div>'}
function backupPage(){if(user.ruolo!==3)return '<div class="card">Accesso non disponibile.</div>';return '<div class="card"><h3>Backup e sincronizzazione</h3><p>Il gestionale salva i dati sul dispositivo. Puoi creare un backup completo e ripristinarlo su un altro dispositivo.</p><div class="actions"><button class="btn" onclick="downloadBackup()">Scarica backup</button><label class="btn secondary" style="display:inline-flex;align-items:center;cursor:pointer">Ripristina backup<input type="file" accept=".json,application/json" style="display:none" onchange="restoreBackup(this.files[0])"></label></div><p class="muted section">Il backup comprende turni, ferie/permessi, corsi, bacheca, calendario, notifiche e configurazione.</p></div>'}
function downloadBackup(){const payload={version:4,exportedAt:new Date().toISOString(),db};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='bplus-backup-'+todayDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500);audit('Backup','Esportazione completa');save()}
function restoreBackup(file){if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!x.db||!x.version)throw Error();if(!confirm('Il ripristino sostituirà i dati presenti su questo dispositivo. Continuare?'))return;db=x.db;for(const k of Object.keys(defaults))if(!db[k])db[k]=defaults[k];audit('Backup','Ripristino completo');save();render();alert('Backup ripristinato.')}catch(e){alert('Backup non valido.')}};rd.readAsText(file)}
function render(){let h=page==='dashboard'?dashboard():page==='employees'?employees():page==='shifts'?shifts():page==='history'?history():page==='calendar'?calendar():page==='absences'?absences():page==='stores'?stores():page==='courses'?courses():page==='board'?board():page==='reports'?reports():page==='notifications'?notifications():page==='audit'?auditPage():page==='backup'?backupPage():profile();view.innerHTML=h}buildNav();render();
</script></body></html>
