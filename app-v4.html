<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c62828"><title>B+ Gestionale HR</title><style>:root{--bg:#101114;--p:#191b20;--line:#30343b;--txt:#f5f6f8;--muted:#9da3ad;--red:#c62828;--green:#2e9b58;--gold:#8a6410}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{min-height:44px;cursor:pointer}.side{position:fixed;left:0;top:0;bottom:0;width:250px;background:#15171a;border-right:1px solid var(--line);padding:16px;z-index:20}.brand{text-align:center;margin-bottom:14px}.simple-logo{display:flex;align-items:center;justify-content:center;width:82px;height:82px;margin:0 auto 10px;background:#e30613;color:#ffe900;border-radius:10px;font-size:38px;font-weight:900;line-height:1;letter-spacing:-4px;font-style:normal}.brand span{display:block;text-align:center}.brand i{color:#e53935;font-style:normal}.who,.card{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:14px}.who{margin-bottom:14px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c8ccd2;text-align:left;border-radius:9px;padding:11px}.nav button.active,.nav button:hover{background:#292d33;color:#fff}.main{margin-left:250px;padding:20px 24px 90px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.top h1{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--red);color:#fff;font-weight:750}.secondary{background:#363a40}.green{background:var(--green)}.danger{background:#6e2020}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.section{margin-top:15px}.muted{color:var(--muted);font-size:13px}.stat{font-size:28px;font-weight:900;margin-top:5px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:12px;color:#a5aab3}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:var(--p);color:#bbb;border-radius:9px;padding:8px 12px}.tabs button.active{background:#30343a;color:#fff}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:50;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.dialog{width:min(950px,100%);max-height:92vh;overflow:auto;background:#1a1c20;border:1px solid #3b3f46;border-radius:16px;padding:16px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form label{display:grid;gap:5px;color:#b5bac2;font-size:12px}.form input,.form select,.form textarea{background:#292d33;color:#fff;border:1px solid #454a52;border-radius:8px;padding:10px}.checks{display:flex;flex-wrap:wrap;gap:8px}.checks label{background:#25282d;padding:8px;border-radius:8px}.matrix{overflow:auto}.matrix table{border-collapse:collapse;min-width:950px}.matrix th,.matrix td{border:1px solid var(--line);padding:7px;text-align:center;white-space:nowrap}.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:#191b20;text-align:left}.worked{background:var(--gold);font-weight:800}.bottom{display:none}.hidden{display:none}@media(max-width:800px){.side{transform:translateX(-105%);transition:.2s;width:285px}.side.open{transform:none}.main{margin:0;padding:14px 12px 90px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bottom{display:grid;position:fixed;bottom:0;left:0;right:0;grid-template-columns:repeat(5,1fr);background:#15171a;border-top:1px solid var(--line);z-index:25;padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0;background:transparent;color:#aaa;font-size:10px}.bottom b{display:block;font-size:18px}.form{grid-template-columns:1fr}.modal{align-items:flex-end;padding:0}.dialog{width:100%;border-radius:18px 18px 0 0}.grid{gap:8px}}@media(max-width:460px){.grid{grid-template-columns:1fr}}</style><style>
.shift-plan{background:#fff;color:#111;border:1px solid #c4c4c4;padding:0;border-radius:4px;overflow:hidden}
.sp-title{background:#a9c9e8;color:#111;text-align:center;font-weight:800;font-style:italic;padding:7px 10px;border-bottom:2px solid #111;letter-spacing:.3px}
.sp-title span{font-weight:800;margin-left:5px}
.sp-table{width:100%;min-width:1250px;border-collapse:collapse;font-family:Arial,sans-serif;font-size:11px;table-layout:fixed}
.sp-table th,.sp-table td{border:1px solid #777;padding:2px 3px;height:29px;vertical-align:middle;text-align:center}
.sp-table thead th{background:#f4dc92;color:#111;font-weight:800}
.sp-h1{width:105px}.sp-h2{width:135px}.sp-h3{width:88px}.sp-h4{width:72px}.sp-h5{width:55px}
.sp-date{width:92px;padding:0!important}.sp-date b{display:inline-block;width:50%;padding:5px 0;font-style:italic}.sp-date span{display:inline-block;width:50%;padding:5px 0}.sp-date small{display:block;border-top:1px solid #777;padding:2px 0;font-size:9px}
.sp-contract,.sp-prev,.sp-hours,.sp-balance{background:#fff}.sp-prev{background:#a9c9e8!important}.sp-hours{font-weight:800;background:#fff3c4}.sp-balance{font-weight:800;background:#fff3c4}.sp-balance.neg{color:#8b1e1e}.sp-balance.pos{color:#176b38}
.sp-note{text-align:left!important;color:#222;background:#ffeaa8;font-weight:800}.sp-note-sub{font-weight:400;font-size:9px;color:#555}
.sp-day{padding:0!important;background:#fff;cursor:pointer}.sp-day:hover{background:#f4f4f4}.sp-closed{background:#666!important;cursor:default}
.sp-times{display:grid;grid-template-columns:repeat(4,1fr);min-height:28px}.sp-times span{display:flex;align-items:center;justify-content:center;border-right:1px solid #999;font-size:10px;font-style:italic}.sp-times span:last-child{border-right:0}.sp-special{min-height:28px;display:flex;align-items:center;justify-content:center;font-weight:800;font-style:italic}.sp-empty{padding:14px!important;color:#666;background:#f7f7f7}
@media(max-width:900px){.sp-table{min-width:1100px}.sp-date{width:86px}.sp-note{width:125px}}
</style></head><body><aside id="side" class="side"><div class="brand"><div class="simple-logo" aria-label="B+">B+</div><span>B+ Gestionale HR</span></div><div id="who" class="who"></div><nav id="nav" class="nav"></nav></aside><main class="main"><header class="top"><div><h1 id="title">Dashboard</h1><div class="muted">Versione HR completa</div></div><div class="actions"><button class="btn secondary" onclick="toggleMenu()">☰</button><button class="btn" onclick="logout()">Esci</button></div></header><section id="view"></section></main><nav id="bottom" class="bottom"></nav><div id="modal" class="modal"><div class="dialog"><div class="top"><h2 id="mtitle"></h2><button class="btn secondary" onclick="closeModal()">Chiudi</button></div><div id="mbody"></div></div></div><script src="./auth-v3.js?build=20261002-login-v3"></script><script>
'use strict';
const auth=BPlusAuth.get();
if(!auth||!auth.uid||!auth.user){location.replace('./index.html?login=required');throw new Error('login required')}
const user=auth.user;const roles=['','Lavoratore','Direttore','Titolare'];const DAYS=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];const STORES=[['GAG','Gaggiolo'],['COC','Cocquio'],['DAV','Daverio'],['VAR','Varese']];const KEY='bplus_new_v4';
const defaults={employees:[],absences:[],shifts:[],notifications:[],stores:STORES.map(([id,name])=>({id,name,days:{},exceptions:{}})),courses:[]};let db=JSON.parse(localStorage.getItem(KEY)||'null')||defaults;for(const k of Object.keys(defaults))if(!db[k])db[k]=defaults[k];for(const e of db.employees){if(typeof e.oreRecuperoBase!=='number')e.oreRecuperoBase=0}if(!Array.isArray(db.attendance))db.attendance=[];if(!Array.isArray(db.board))db.board=[];if(!Array.isArray(db.audit))db.audit=[];if(!Array.isArray(db.calendarEvents))db.calendarEvents=[];if(!db.shiftWeeks||typeof db.shiftWeeks!=='object')db.shiftWeeks={};save();let page='dashboard';
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function today(){return new Date().toISOString().slice(0,10)}function toggleMenu(){side.classList.toggle('open')}function logout(){BPlusAuth.clear();location.replace('./index.html?logout=1')}function openModal(t,h){mtitle.textContent=t;mbody.innerHTML=h;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}
const P={dashboard:'Dashboard',employees:'Dipendenti',shifts:'Turni',history:'Storico turni',calendar:'Calendario HR',absences:'Ferie & Permessi',stores:'Punti vendita',courses:'Corsi',board:'Bacheca',reports:'Report',notifications:'Notifiche',audit:'Audit log',backup:'Backup & Sincronizzazione',profile:'Profilo'};function allowed(p){if(user.ruolo===3)return true;if(user.ruolo===2)return ['dashboard','employees','shifts','history','calendar','absences','courses','board','reports','notifications','profile'].includes(p);return ['dashboard','calendar','absences','courses','board','notifications','profile'].includes(p)}function go(p){if(!allowed(p))return;page=p;side.classList.remove('open');title.textContent=P[p];buildNav();render()}
function buildNav(){nav.innerHTML=Object.entries(P).filter(([p])=>allowed(p)).map(([p,n])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${n}</button>`).join('');bottom.innerHTML=[['dashboard','⌂'],['calendar','📅'],['notifications','🔔'],['menu','☰']].map(([p,i])=>`<button onclick="${p==='menu'?'toggleMenu()':`go('${p}')`}"><b>${i}</b>${p==='menu'?'Menu':P[p]}</button>`).join('');who.innerHTML=`<b>${esc(user.nome||'Utente')} ${esc(user.cognome||'')}</b><div class="muted">${roles[user.ruolo]||''}${user.negozio?' · '+esc(user.negozio):''}</div>`}
function dashboard(){return `<div class="grid"><div class="card"><div class="muted">Dipendenti</div><div class="stat">${db.employees.length}</div></div><div class="card"><div class="muted">Turni</div><div class="stat">${db.shifts.length}</div></div><div class="card"><div class="muted">Assenze</div><div class="stat">${db.absences.length}</div></div><div class="card"><div class="muted">Notifiche</div><div class="stat">${db.notifications.filter(n=>!n.read&&(n.emp==="all"||String(n.emp)===String(user.id))).length}</div></div></div><div class="section grid">${STORES.map(s=>`<div class="card"><b>${s[1]}</b><div class="muted">Configurazione punto vendita</div><button class="btn section" onclick="go('stores')">Apri</button></div>`).join('')}</div>`}
function employees(){if(user.ruolo!==3)return '<div class="card">Accesso non disponibile.</div>';return `<div class="actions"><button class="btn" onclick="employeeModal()">+ Nuovo lavoratore</button></div><div class="section tablewrap"><table class="table"><tr><th>Nome</th><th>Email</th><th>Ruolo</th><th>Negozio</th><th>Stato</th><th></th></tr>${db.employees.map(e=>`<tr><td>${esc(e.nome)} ${esc(e.cognome)}</td><td>${esc(e.email)}</td><td>${roles[e.ruolo]}</td><td>${esc(e.negozio)}</td><td>${esc(e.stato)}</td><td><button class="btn secondary" onclick="employeeModal(${e.id})">Apri</button></td></tr>`).join('')}</table></div>`}
function employeeModal(id){let e=id?db.employees.find(x=>x.id==id):{id:Date.now(),nome:'',cognome:'',email:'',telefono:'',ruolo:1,negozio:'GAG',stato:'attivo',inTurni:true,contratto:'indeterminato',ore:40,capacitaGenerale:3,policyDomeniche:'ogni2',pausaTipo:'flessibile',pausaInizio:'12:00',pausaFine:'13:30',pausaMin:60,riposiFissi:[],compensativi:[],mobilita:[]};window._emp=e;openModal('Scheda lavoratore',`<div class="tabs"><button class="active" onclick="empTab('an')">Anagrafica</button><button onclick="empTab('ct')">Contratto & Turni</button><button onclick="empTab('as')">Assenze</button></div><div id="etab"></div>`);empTab('an')}
function shiftHoursValue(s){if(!s||s.type!=='Turno'||!s.in||!s.out)return 0;const m=t=>{const q=String(t).split(':').map(Number);return q[0]*60+q[1]};let n=Math.max(0,m(s.out)-m(s.in));if(s.breakStart&&s.breakEnd)n=Math.max(0,n-(m(s.breakEnd)-m(s.breakStart)));return n/60}
function recoveryAuto(emp){const e=typeof emp==='object'?emp:db.employees.find(x=>String(x.id)===String(emp));if(!e)return 0;const now=shiftWeekKey(todayDate());const weeks=new Set(db.shifts.filter(s=>String(s.emp)===String(e.id)&&s.date<=todayDate()).map(s=>shiftWeekKey(s.date)));weeks.add(now);let total=0;for(const w of weeks){const worked=db.shifts.filter(s=>String(s.emp)===String(e.id)&&shiftWeekKey(s.date)===w).reduce((n,s)=>n+shiftHoursValue(s),0);const hasActivity=worked>0||db.absences.some(a=>String(a.emp)===String(e.id)&&a.stato==='approvato'&&a.da<=shiftWeekDates(w)[6]&&a.a>=shiftWeekDates(w)[0]);if(!hasActivity)continue;total+=(Number(e.ore)||40)-worked}return Math.round(total*100)/100}
function recoveryBalance(emp){const e=typeof emp==='object'?emp:db.employees.find(x=>String(x.id)===String(emp));return e?Math.round(((Number(e.oreRecuperoBase)||0)+recoveryAuto(e))*100)/100:0}
function recoveryLabel(emp){const n=recoveryBalance(emp);return (n>0?'+':'')+String(n).replace('.',',')+' h'}function empTab(t){let e=window._emp;if(t==='an')etab.innerHTML=`<div class="form"><label>Nome<input id="en" value="${esc(e.nome)}"></label><label>Cognome<input id="ec" value="${esc(e.cognome)}"></label><label>Email<input id="ee" value="${esc(e.email)}"></label><label>Telefono<input id="ephone" value="${esc(e.telefono)}"></label><label>Ruolo<select id="er">${[1,2,3].map(r=>`<option value="${r}" ${e.ruolo==r?'selected':''}>${roles[r]}</option>`).join('')}</select></label><label>Negozio<select id="estore">${STORES.map(s=>`<option value="${s[0]}" ${e.negozio===s[0]?'selected':''}>${s[1]}</option>`).join('')}</select></label><label>Stato<select id="estate">${['attivo','assente','ferie','malattia'].map(x=>`<option ${e.stato===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Includi nei turni<input id="eit" type="checkbox" ${e.inTurni?'checked':''}></label></div><button class="btn green section" onclick="saveEmployee()">Salva anagrafica</button>`;else if(t==='ct')etab.innerHTML=`<div class="form"><label>Contratto<select id="contract"><option>indeterminato</option><option>determinato</option><option>part-time</option></select></label><label>Ore settimanali<input id="hours" type="number" value="${e.ore||40}"></label>${user.ruolo===3?'<label>Capacità generale<select id="generalCapacity">${[1,2,3,4,5].map(x=>`<option value="${x}" ${Number(e.capacitaGenerale||3)===x?'selected':''}>${x}</option>`).join('')}</select><span class="muted">Da 1 a 5. Usata per bilanciare la composizione delle squadre nella generazione automatica dei turni.</span></label>':''}<label>Ore da recuperare<input id="recoveryHours" type="number" step="0.25" value="${recoveryBalance(e)}" ${user.ruolo===3?"":"readonly" }><span class="muted">Si aggiorna automaticamente in base ai turni. Il Titolare può correggerlo.</span></label><label>Policy domeniche<select id="sunPolicy"><option value="ogni2" ${e.policyDomeniche==='ogni2'?'selected':''}>1 ogni 2</option><option value="ogni3" ${e.policyDomeniche==='ogni3'?'selected':''}>1 ogni 3</option><option value="tutte" ${e.policyDomeniche==='tutte'?'selected':''}>Tutte</option><option value="nessuna" ${e.policyDomeniche==='nessuna'?'selected':''}>Nessuna</option></select></label><label>Tipo di pausa<select id="pauseType" onchange="pauseFields()"><option value="fissa" ${e.pausaTipo==='fissa'?'selected':''}>Fissa</option><option value="flessibile" ${e.pausaTipo!=='fissa'?'selected':''}>Flessibile</option></select></label><label id="fixedPause">Orario pausa (es. 12:00 / 13:30)<input id="pauseTime" value="${esc((e.pausaInizio||'12:00')+' / '+(e.pausaFine||'13:30'))}"></label><label id="flexPause">Durata pausa (minuti)<input id="pauseMin" type="number" value="${e.pausaMin||60}"></label></div><h3>Riposo fisso settimanale</h3><div class="checks">${DAYS.map((d,i)=>`<label><input class="rf" type="checkbox" value="${i}" ${(e.riposiFissi||[]).includes(String(i))?'checked':''}>${d}</label>`).join('')}</div><h3>Riposo compensativo se lavora la domenica</h3><div class="muted">Giorni possibili della stessa settimana; vengono esclusi i giorni di riposo fisso.</div><div class="checks">${DAYS.slice(0,6).map((d,i)=>`<label><input class="rc" type="checkbox" value="${i}" ${(e.compensativi||[]).includes(String(i))?'checked':''}>${d}</label>`).join('')}</div><h3>Mobilità</h3><div class="checks">${STORES.map(s=>`<label><input class="mob" type="checkbox" value="${s[0]}" ${(e.mobilita||[]).includes(s[0])?'checked':''}>${s[1]}</label>`).join('')}</div><button class="btn green section" onclick="saveContract()">Salva Contratto & Turni</button>`;else etab.innerHTML=`<button class="btn" onclick="absenceModal(${e.id})">+ Inserisci assenza</button><div class="section tablewrap"><table class="table"><tr><th>Tipo</th><th>Dal</th><th>Al</th><th>Stato</th></tr>${db.absences.filter(a=>String(a.emp)===String(e.id)).map(a=>`<tr><td>${a.tipo}</td><td>${a.da}</td><td>${a.a}</td><td>${a.stato}</td></tr>`).join('')}</table></div>`;if(t==='ct')pauseFields()}
function pauseFields(){let fixed=document.getElementById('pauseType').value==='fissa';document.getElementById('fixedPause').style.display=fixed?'grid':'none';document.getElementById('flexPause').style.display=fixed?'none':'grid'}
function saveEmployee(){let e=_emp;e.nome=en.value.trim();e.cognome=ec.value.trim();e.email=ee.value.trim();e.telefono=ephone.value.trim();e.ruolo=+er.value;e.negozio=estore.value;e.stato=estate.value;e.inTurni=eit.checked;upsertEmployee(e)}function saveContract(){let e=_emp;const autoBefore=recoveryAuto(e);if(user.ruolo===3&&document.getElementById('recoveryHours'))e.oreRecuperoBase=(+recoveryHours.value||0)-autoBefore;e.contratto=contract.value;e.ore=+hours.value;if(user.ruolo===3&&document.getElementById('generalCapacity'))e.capacitaGenerale=+generalCapacity.value||3;e.policyDomeniche=sunPolicy.value;e.pausaTipo=pauseType.value;if(e.pausaTipo==='fissa'){let x=pauseTime.value.split('/').map(s=>s.trim());e.pausaInizio=x[0]||'12:00';e.pausaFine=x[1]||'13:30'}else e.pausaMin=+pauseMin.value;e.riposiFissi=[...document.querySelectorAll('.rf:checked')].map(x=>x.value);e.compensativi=[...document.querySelectorAll('.rc:checked')].map(x=>x.value).filter(x=>!e.riposiFissi.includes(x));e.mobilita=[...document.querySelectorAll('.mob:checked')].map(x=>x.value);upsertEmployee(e)}function upsertEmployee(e){let i=db.employees.findIndex(x=>x.id==e.id);if(i<0)db.employees.push(e);else db.employees[i]=e;save();closeModal();render()}
function absenceModal(emp){openModal('Nuova assenza',`<div class="form"><label>Tipo<select id="atype"><option>Ferie</option><option>Permesso</option><option>Malattia</option><option>Corso</option></select></label><label>Dal<input id="afrom" type="date" value="${today()}"></label><label>Al<input id="ato" type="date" value="${today()}"></label><label>Note<input id="anote"></label></div><button class="btn green section" onclick="saveAbs(${emp})">Salva</button>`)}function saveAbs(emp){db.absences.push({id:Date.now(),emp,tipo:atype.value,da:afrom.value,a:ato.value,note:anote.value,stato:user.ruolo>=2?'approvato':'in_attesa'});db.notifications.unshift({id:Date.now(),emp,text:'È stata inserita una nuova assenza',read:false,date:new Date().toISOString()});save();closeModal();render()}
function absences(){let selected=document.getElementById('filterEmp')?.value||'',type=document.getElementById('filterType')?.value||'',status=document.getElementById('filterStatus')?.value||'';let list=db.absences.filter(a=>(user.ruolo!==1||String(a.emp)===String(user.id))&&(!selected||String(a.emp)===selected)&&(!type||a.tipo===type)&&(!status||a.stato===status));return `<div class="actions"><select id="filterEmp" onchange="render()"><option value="">Tutti i lavoratori</option>${db.employees.map(e=>`<option value="${e.id}" ${String(selected)===String(e.id)?'selected':''}>${esc(e.nome)} ${esc(e.cognome)}</option>`).join('')}</select><select id="filterType" onchange="render()"><option value="">Tutti i tipi</option>${['Ferie','Permesso','Malattia','Corso'].map(x=>`<option ${type===x?'selected':''}>${x}</option>`).join('')}</select><select id="filterStatus" onchange="render()"><option value="">Tutti gli stati</option>${['in_attesa','approvato','rifiutato'].map(x=>`<option ${status===x?'selected':''}>${x}</option>`).join('')}</select>${user.ruolo===1?`<button class="btn" onclick="absenceModal(${user.id})">+ Richiedi</button>`:''}</div><div class="section tablewrap"><table class="table"><tr><th>Lavoratore</th><th>Tipo</th><th>Dal</th><th>Al</th><th>Stato</th><th></th></tr>${list.map(a=>{let e=db.employees.find(x=>x.id==a.emp);return `<tr><td>${e?esc(e.nome+' '+e.cognome):a.emp}</td><td>${a.tipo}</td><td>${a.da}</td><td>${a.a}</td><td>${a.stato}</td><td>${user.ruolo>=2&&a.stato==='in_attesa'?`<button class="btn green" onclick="answerAbs(${a.id},'approvato')">Approva</button> <button class="btn danger" onclick="answerAbs(${a.id},'rifiutato')">Rifiuta</button>`:''}</td></tr>`}).join('')}</table></div>`}function answerAbs(id,status){let a=db.absences.find(x=>x.id==id);if(a){a.stato=status;db.notifications.unshift({id:Date.now(),emp:a.emp,text:'La tua richiesta di assenza è stata '+(status==='approvato'?'approvata':'rifiutata'),read:false,date:new Date().toISOString()});save();render()}}
function storeModal(id,key){let s=db.stores.find(x=>x.id===id);if(!s)return;const isWeekly=/^weekly-\d$/.test(String(key||''));const dayKey=isWeekly?key:'';const actual=isWeekly?'':(key||'');const dLabel=isWeekly?DAYS[Number(key.split('-')[1])]:actual;let v=(isWeekly?s.days[dayKey]:actual?s.exceptions[actual]:null)||{closed:false,mode:'continuato',open:'08:30',close:'20:00',mtotal:1,mopen:1,mclose:1,mpause:0,lunch1:'12:30',lunch2:'14:30'};openModal(s.name+' — '+(dLabel||'Orario standard'),`<div class="form"><label>Giorno standard<input value="${dLabel||'—'}" readonly></label><label>Data specifica (opzionale)<input id="sdate" type="date" value="${actual}"></label><label>Festivo / chiuso<input id="sclosed" type="checkbox" ${v.closed?'checked':''}></label><label>Dalle<input id="sopen" type="time" value="${v.open||'08:30'}"></label><label>Alle<input id="sclose" type="time" value="${v.close||'20:00'}"></label><label style="display:flex;align-items:center;gap:8px;background:#25282d;padding:10px;border-radius:8px"><input id="ssplit" type="checkbox" ${v.mode==='spezzato'?'checked':''} onchange="splitFields()"> Orario spezzato</label><div id="splitFields" style="display:${v.mode==='spezzato'?'contents':'none'}"><label>Pausa pranzo dalle<input id="sl1" type="time" value="${v.lunch1||'12:30'}"></label><label>Pausa pranzo alle<input id="sl2" type="time" value="${v.lunch2||'14:30'}"></label></div><label>Min. personale giornaliero<input id="smt" type="number" min="0" value="${v.mtotal??1}"></label><label>Min. persone in apertura<input id="smo" type="number" min="0" value="${v.mopen??1}"></label><label>Min. persone in chiusura<input id="smc" type="number" min="0" value="${v.mclose??1}"></label><label>Min. persone in pausa<input id="smp" type="number" min="0" value="${v.mpause??0}"></label></div><button class="btn green section" onclick="saveStore('${id}','${key||''}')">Salva</button>`)}function splitFields(){let f=document.getElementById('splitFields');if(f)f.style.display=document.getElementById('ssplit').checked?'contents':'none'}function saveStore(id,key){let s=db.stores.find(x=>x.id===id);if(!s)return;let split=document.getElementById('ssplit').checked;let v={closed:sclosed.checked,mode:split?'spezzato':'continuato',open:sopen.value,close:sclose.value,lunch1:document.getElementById('sl1')?.value||'12:30',lunch2:document.getElementById('sl2')?.value||'14:30',mtotal:+smt.value,mopen:+smo.value,mclose:+smc.value,mpause:+smp.value};let actual=sdate.value;if(actual){s.exceptions[actual]=v}else{let dayKey=/^weekly-\d$/.test(String(key||''))?key:null;if(dayKey)s.days[dayKey]=v;else{alert('Seleziona il giorno standard da modificare.');return}}save();closeModal();render()}
function stores(){if(user.ruolo!==3)return '<div class="card">Accesso non disponibile.</div>';return db.stores.map(s=>`<div class="section card"><div class="top"><h3>${esc(s.name)}</h3></div><div class="tablewrap"><table class="table"><tr><th>Giorno</th><th>Orario</th><th>Festivo</th><th>Min giornaliero</th><th>Min apertura</th><th>Min chiusura</th><th>Min pausa</th><th></th></tr>${DAYS.map((d,i)=>{let v=s.days['weekly-'+i]||{};return `<tr><td>${d}</td><td>${v.closed?'CHIUSO':(v.mode==='spezzato'?'Spezzato '+(v.lunch1||'')+'–'+(v.lunch2||''):(v.open||'—')+'–'+(v.close||'—'))}</td><td>${v.closed?'Sì':'No'}</td><td>${v.mtotal??'—'}</td><td>${v.mopen??'—'}</td><td>${v.mclose??'—'}</td><td>${v.mpause??'—'}</td><td><button class="btn secondary" onclick="storeModal('${s.id}','weekly-${i}')">Modifica</button></td></tr>`}).join('')}</table></div><div class="actions section"><input id="ex_${s.id}" type="date"><button class="btn secondary" onclick="storeModal('${s.id}',document.getElementById('ex_${s.id}').value)">Modifica data specifica</button></div></div>`).join('')}
function history(){let sundays=[];let d=new Date();d.setDate(d.getDate()-((d.getDay()||7)));for(let i=0;i<12;i++){let x=new Date(d);x.setDate(d.getDate()-i*7);sundays.push(x.toISOString().slice(0,10))}let es=db.employees.filter(e=>user.ruolo===3||e.negozio===user.negozio);return `<div class="card"><h3>Domeniche lavorate</h3><div class="matrix"><table><tr><th>Negozio / lavoratore</th>${sundays.map(x=>`<th>${x.slice(8,10)}/${x.slice(5,7)}</th>`).join('')}</tr>${STORES.map(st=>{let ee=es.filter(e=>e.negozio===st[0]);return ee.length?`<tr><th colspan="13">${st[1]}</th></tr>`+ee.map(e=>`<tr><td>${esc(e.nome)} ${esc(e.cognome)}</td>${sundays.map(x=>{let w=db.shifts.some(s=>String(s.emp)===String(e.id)&&s.date===x&&s.type!=='Riposo');return `<td class="${w?'worked':''}">${w?'●':'—'}</td>`}).join('')}</tr>`).join(''):''}).join('')}</table></div></div>`}
function isoWeekNumber(date){
  const d=new Date(date+'T12:00:00');
  const day=d.getDay()||7;
  d.setDate(d.getDate()+4-day);
  const y=d.getFullYear();
  const start=new Date(y,0,1);
  return Math.ceil((((d-start)/86400000)+1)/7);
}
function weekWorkedHours(emp,week,store){
  const ds=shiftWeekDates(week);
  return Math.round(db.shifts.filter(s=>String(s.emp)===String(emp.id)&&s.store===store&&ds.includes(s.date)&&s.type==='Turno').reduce((n,s)=>n+shiftHoursValue(s),0)*100)/100;
}
function recoveryBalanceBeforeWeek(emp,week){
  const e=typeof emp==='object'?emp:db.employees.find(x=>String(x.id)===String(emp));
  if(!e)return 0;
  const first=shiftWeekDates(week)[0];
  const weeks=new Set(db.shifts.filter(s=>String(s.emp)===String(e.id)&&s.date<first).map(s=>shiftWeekKey(s.date)));
  let total=Number(e.oreRecuperoBase)||0;
  for(const w of weeks){
    const ds=shiftWeekDates(w);
    const worked=db.shifts.filter(s=>String(s.emp)===String(e.id)&&ds.includes(s.date)&&s.type==='Turno').reduce((n,s)=>n+shiftHoursValue(s),0);
    const hasActivity=worked>0||db.absences.some(a=>String(a.emp)===String(e.id)&&a.stato==='approvato'&&a.da<=ds[6]&&a.a>=ds[0]);
    if(hasActivity)total+=(Number(e.ore)||40)-worked;
  }
  return Math.round(total*100)/100;
}
function shiftVisualCell(shift){
  if(!shift)return '';
  if(shift.type&&shift.type!=='Turno'){
    const label=shift.type==='Ferie'?'FER':shift.type==='Corso'?'CORSO':shift.type==='Riposo'?'RIP':shift.type;
    return '<div class="sp-special">'+esc(label)+'</div>';
  }
  const a=shift.in||'',b=shift.breakStart||'',c=shift.breakEnd||'',d=shift.out||'';
  return '<div class="sp-times"><span>'+esc(a)+'</span><span>'+esc(b)+'</span><span>'+esc(c)+'</span><span>'+esc(d)+'</span></div>';
}
function shifts(){
  const selected=document.getElementById('shiftWeek')?.value||shiftWeekKey(todayDate());
  const stores=user.ruolo===2?[user.negozio]:shiftStores();
  const dates=shiftWeekDates(selected);
  const weekNo=isoWeekNumber(selected);
  let controls='<div class="actions"><label class="muted">Settimana<input id="shiftWeek" type="date" value="'+selected+'" onchange="render()" style="margin-left:6px;background:#292d33;color:#fff;border:1px solid #454a52;border-radius:8px;padding:10px"></label>';
  if(user.ruolo===3){
    controls+='<button class="btn" onclick="generateWeekModal()">⚙ Genera settimana</button><button class="btn" onclick="sendWeekToDirectors(&quot;'+selected+'&quot;)">📨 Invia ai Direttori</button>';
    if(allStoresDirectorApproved(selected))controls+='<button class="btn" onclick="sendWeeksToOwner(&quot;'+selected+'&quot;)">📨 Invia tutte al Titolare</button>';
    if(shiftStores().every(s=>weekStoreStatus(selected,s)==='inviato_titolare'))controls+='<button class="btn green" onclick="approveAllWeeksByOwner(&quot;'+selected+'&quot;)">✓ Approva tutte le settimane</button>';
  }else if(user.ruolo===2){
    const st=weekStoreStatus(selected,user.negozio);
    if(st==='inviato_direttore')controls+='<button class="btn green" onclick="approveStoreWeek(&quot;'+selected+'&quot;,&quot;'+user.negozio+'&quot;)">✓ Approva settimana del negozio</button>';
    if(st==='approvata_titolare')controls+='<button class="btn secondary" onclick="printShiftWeek(&quot;'+selected+'&quot;)">🖨 Stampa turni</button>';
    if(st==='inviato_direttore')controls+='<button class="btn" onclick="shiftModal()">+ Modifica turno</button>';
  }
  controls+='</div><div class="card section"><b>Settimana '+weekLabel(selected)+'</b><div class="muted">'+(user.ruolo===3?'Genera → invia ai Direttori → controllo/modifica negozio → approvazione Direttore → invio al Titolare → approvazione Titolare':'Controlla/modifica il tuo negozio → approva → attende approvazione Titolare')+'</div></div>';

  const blocks=stores.map(store=>{
    const storeObj=db.stores.find(s=>s.id===store);
    const storeName=storeObj?.name||store;
    const workers=db.employees.filter(e=>e.stato==='attivo'&&e.inTurni!==false&&(e.negozio===store||(Array.isArray(e.mobilita)&&e.mobilita.includes(store))||db.shifts.some(s=>s.store===store&&String(s.emp)===String(e.id)&&dates.includes(s.date)))).sort((a,b)=>(a.cognome+' '+a.nome).localeCompare(b.cognome+' '+b.nome,'it'));
    const rows=workers.map(e=>{
      const prev=recoveryBalanceBeforeWeek(e,selected);
      const hours=weekWorkedHours(e,selected,store);
      const contract=Number(e.ore)||40;
      const saldo=Math.round((prev+hours-contract)*100)/100;
      const dayCells=dates.map(date=>{
        const h=storeDay(store,date);
        const shiftsForDay=db.shifts.filter(s=>String(s.emp)===String(e.id)&&s.store===store&&s.date===date);
        const sh=shiftsForDay.find(s=>s.type==='Turno')||shiftsForDay[0];
        const closed=!h||h.closed;
        const cellClass=closed?'sp-day sp-closed':'sp-day';
        const inner=sh?shiftVisualCell(sh):'';
        const clickable=sh&&sh.id!=null?' onclick="shiftModal(&quot;'+sh.id+'&quot;)" title="Apri turno"':'';
        return '<td class="'+cellClass+'"'+clickable+'>'+inner+'</td>';
      }).join('');
      return '<tr><td class="sp-contract">'+contract.toFixed(0)+'</td><td class="sp-note"><b>'+esc(e.nome+' '+e.cognome)+'</b>'+(e.note?'<div class="sp-note-sub">'+esc(e.note)+'</div>':'')+'</td><td class="sp-prev">'+(prev>0?'+':'')+String(prev).replace('.',',')+'</td><td class="sp-hours">'+hours.toFixed(2).replace('.',',')+'</td><td class="sp-balance '+(saldo<0?'neg':saldo>0?'pos':'')+'">'+(saldo>0?'+':'')+String(saldo).replace('.',',')+'</td>'+dayCells+'</tr>';
    }).join('');
    const head=dates.map(date=>{
      const x=new Date(date+'T12:00:00');
      const wd=DAYS[x.getDay()===0?6:x.getDay()-1];
      return '<th class="sp-date"><b>'+wd.toLowerCase()+'</b><span>'+date.slice(8,10)+'/'+date.slice(5,7)+'</span><small>PV</small></th>';
    }).join('');
    return '<div class="shift-plan section"><div class="sp-title">'+esc(storeName.toUpperCase())+' <span>SETTIMANA N.'+weekNo+'</span></div><div class="tablewrap"><table class="sp-table"><thead><tr><th class="sp-h1">ORE SETTIMANALI A CONTRATTO</th><th class="sp-h2">NOTE</th><th class="sp-h3">SALDO SETT.PREC</th><th class="sp-h4">ORE SETT.</th><th class="sp-h5">SALDO</th>'+head+'</tr></thead><tbody>'+(rows||'<tr><td colspan="'+(6+dates.length)+'" class="sp-empty">Nessun lavoratore/turno per questo punto vendita.</td></tr>')+'</tbody></table></div></div>';
  }).join('');
  return controls+blocks;
}
function board(){const now=todayDate();let list=db.board.filter(b=>(!b.exp||b.exp>=now)&&(b.target==='all'||b.target===user.negozio||b.target==='u:'+user.id||user.ruolo>=2));return '<div class="actions">'+(user.ruolo>=2?'<button class="btn" onclick="boardModal()">+ Nuova comunicazione</button>':'')+'</div>'+list.map(b=>'<div class="card section"><h3>'+esc(b.title)+'</h3><div style="white-space:pre-wrap">'+esc(b.body)+'</div><div class="muted section">'+new Date(b.at).toLocaleString('it-IT')+(b.exp?' · fino al '+b.exp:'')+'</div></div>').join('')||'<div class="card section">Nessuna comunicazione.</div>'}
function auditPage(){if(user.ruolo!==3)return '<div class="card">Accesso non disponibile.</div>';return '<div class="card"><h3>Audit log</h3><div class="tablewrap"><table class="table"><tr><th>Data</th><th>Utente</th><th>Azione</th><th>Dettaglio</th></tr>'+db.audit.map(a=>'<tr><td>'+new Date(a.at).toLocaleString('it-IT')+'</td><td>'+esc(a.name)+'</td><td>'+esc(a.action)+'</td><td>'+esc(a.detail)+'</td></tr>').join('')+'</table></div></div>'}
function exportCsv(kind){let rows=[];if(kind==='presenze'){rows=[['Data','Lavoratore','Negozio','Entrata','Uscita','Pausa','Ore'],...db.attendance.map(a=>[a.date,empName(a.emp),a.store,a.in,a.out,a.breakMin,workedHours(a)])]}else if(kind==='assenze'){rows=[['Lavoratore','Tipo','Dal','Al','Stato','Note'],...db.absences.map(a=>[empName(a.emp),a.tipo,a.da,a.a,a.stato,a.note||''])]}else{rows=[['Lavoratore','Corso','Categoria','Data','Scadenza','Stato'],...db.courses.map(c=>[empName(c.emp),c.titolo,c.categoria,c.data,c.scadenza,courseState(c)])]}const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='bplus-'+kind+'-'+todayDate()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),500);audit('Export','CSV '+kind);save()}
function printReport(){const old=document.body.innerHTML;const rows=db.attendance.map(a=>'<tr><td>'+a.date+'</td><td>'+empName(a.emp)+'</td><td>'+a.in+'</td><td>'+a.out+'</td><td>'+workedHours(a)+'</td></tr>').join('');document.body.innerHTML='<div style="font-family:Arial;padding:30px;color:#111"><h1>B+ Gestionale HR</h1><h2>Report presenze</h2><table border="1" cellpadding="6" cellspacing="0"><tr><th>Data</th><th>Lavoratore</th><th>Entrata</th><th>Uscita</th><th>Ore</th></tr>'+rows+'</table></div>';window.print();location.reload()}
function reports(){return '<div class="grid"><div class="card"><b>Presenze</b><div class="stat">'+db.attendance.length+'</div></div><div class="card"><b>Assenze</b><div class="stat">'+db.absences.length+'</div></div><div class="card"><b>Formazione</b><div class="stat">'+db.courses.length+'</div></div><div class="card"><b>Turni</b><div class="stat">'+db.shifts.length+'</div></div></div><div class="section card"><h3>Esportazioni</h3><div class="actions"><button class="btn" onclick="exportCsv(\'presenze\')">Presenze CSV / Excel</button><button class="btn secondary" onclick="exportCsv(\'assenze\')">Assenze CSV / Excel</button><button class="btn secondary" onclick="exportCsv(\'corsi\')">Corsi CSV / Excel</button><button class="btn green" onclick="printReport()">Stampa / PDF</button></div></div>'}
function backupPage(){if(user.ruolo!==3)return '<div class="card">Accesso non disponibile.</div>';return '<div class="card"><h3>Backup e sincronizzazione</h3><p>Il gestionale salva i dati sul dispositivo. Puoi creare un backup completo e ripristinarlo su un altro dispositivo.</p><div class="actions"><button class="btn" onclick="downloadBackup()">Scarica backup</button><label class="btn secondary" style="display:inline-flex;align-items:center;cursor:pointer">Ripristina backup<input type="file" accept=".json,application/json" style="display:none" onchange="restoreBackup(this.files[0])"></label></div><p class="muted section">Il backup comprende turni, ferie/permessi, corsi, bacheca, calendario, notifiche e configurazione.</p></div>'}
function downloadBackup(){const payload={version:4,exportedAt:new Date().toISOString(),db};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='bplus-backup-'+todayDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500);audit('Backup','Esportazione completa');save()}
function restoreBackup(file){if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!x.db||!x.version)throw Error();if(!confirm('Il ripristino sostituirà i dati presenti su questo dispositivo. Continuare?'))return;db=x.db;for(const k of Object.keys(defaults))if(!db[k])db[k]=defaults[k];audit('Backup','Ripristino completo');save();render();alert('Backup ripristinato.')}catch(e){alert('Backup non valido.')}};rd.readAsText(file)}
function render(){let h=page==='dashboard'?dashboard():page==='employees'?employees():page==='shifts'?shifts():page==='history'?history():page==='calendar'?calendar():page==='absences'?absences():page==='stores'?stores():page==='courses'?courses():page==='board'?board():page==='reports'?reports():page==='notifications'?notifications():page==='audit'?auditPage():page==='backup'?backupPage():profile();view.innerHTML=h}buildNav();render();
</script></body></html>
