<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c62828"><title>B+ Gestionale HR</title><style>:root{--bg:#101114;--p:#191b20;--line:#30343b;--txt:#f5f6f8;--muted:#9da3ad;--red:#c62828;--green:#2e9b58;--gold:#8a6410}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{min-height:44px;cursor:pointer}.side{position:fixed;left:0;top:0;bottom:0;width:250px;background:#15171a;border-right:1px solid var(--line);padding:16px;z-index:20}.brand{text-align:center;margin-bottom:14px}.simple-logo{display:flex;align-items:center;justify-content:center;width:82px;height:82px;margin:0 auto 10px;background:#e30613;color:#ffe900;border-radius:10px;font-size:38px;font-weight:900;line-height:1;letter-spacing:-4px;font-style:normal}.brand span{display:block;text-align:center}.brand i{color:#e53935;font-style:normal}.who,.card{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:14px}.who{margin-bottom:14px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c8ccd2;text-align:left;border-radius:9px;padding:11px}.nav button.active,.nav button:hover{background:#292d33;color:#fff}.main{margin-left:250px;padding:20px 24px 90px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.top h1{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--red);color:#fff;font-weight:750}.secondary{background:#363a40}.green{background:var(--green)}.danger{background:#6e2020}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.section{margin-top:15px}.muted{color:var(--muted);font-size:13px}.stat{font-size:28px;font-weight:900;margin-top:5px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:12px;color:#a5aab3}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:var(--p);color:#bbb;border-radius:9px;padding:8px 12px}.tabs button.active{background:#30343a;color:#fff}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:50;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.dialog{width:min(950px,100%);max-height:92vh;overflow:auto;background:#1a1c20;border:1px solid #3b3f46;border-radius:16px;padding:16px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form label{display:grid;gap:5px;color:#b5bac2;font-size:12px}.form input,.form select,.form textarea{background:#292d33;color:#fff;border:1px solid #454a52;border-radius:8px;padding:10px}.checks{display:flex;flex-wrap:wrap;gap:8px}.checks label{background:#25282d;padding:8px;border-radius:8px}.matrix{overflow:auto}.matrix table{border-collapse:collapse;min-width:950px}.matrix th,.matrix td{border:1px solid var(--line);padding:7px;text-align:center;white-space:nowrap}.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:#191b20;text-align:left}.worked{background:var(--gold);font-weight:800}.bottom{display:none}.hidden{display:none}@media(max-width:800px){.side{transform:translateX(-105%);transition:.2s;width:285px}.side.open{transform:none}.main{margin:0;padding:14px 12px 90px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bottom{display:grid;position:fixed;bottom:0;left:0;right:0;grid-template-columns:repeat(5,1fr);background:#15171a;border-top:1px solid var(--line);z-index:25;padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0;background:transparent;color:#aaa;font-size:10px}.bottom b{display:block;font-size:18px}.form{grid-template-columns:1fr}.modal{align-items:flex-end;padding:0}.dialog{width:100%;border-radius:18px 18px 0 0}.grid{gap:8px}}@media(max-width:460px){.grid{grid-template-columns:1fr}}</style><style>
.shift-plan{background:#fff;color:#111;border:1px solid #c4c4c4;padding:0;border-radius:4px;overflow:hidden}
.sp-title{background:#a9c9e8;color:#111;text-align:center;font-weight:800;font-style:italic;padding:7px 10px;border-bottom:2px solid #111;letter-spacing:.3px}
.sp-title span{font-weight:800;margin-left:5px}
.sp-table{width:100%;min-width:1250px;border-collapse:collapse;font-family:Arial,sans-serif;font-size:11px;table-layout:fixed}
.sp-table th,.sp-table td{border:1px solid #777;padding:2px 3px;height:29px;vertical-align:middle;text-align:center}
.sp-table thead th{background:#f4dc92;color:#111;font-weight:800}
.sp-h1{width:105px}.sp-h2{width:135px}.sp-h3{width:88px}.sp-h4{width:72px}.sp-h5{width:55px}
.sp-date{width:92px;padding:0!important}.sp-date b{display:inline-block;width:50%;padding:5px 0;font-style:italic}.sp-date span{display:inline-block;width:50%;padding:5px 0}.sp-date small{display:block;border-top:1px solid #777;padding:2px 0;font-size:9px}
.sp-contract,.sp-prev,.sp-hours,.sp-balance{background:#fff}.sp-prev{background:#a9c9e8!important}.sp-hours{font-weight:800;background:#fff3c4}.sp-balance{font-weight:800;background:#fff3c4}.sp-balance.neg{color:#8b1e1e}.sp-balance.pos{color:#176b38}
.sp-note{text-align:left!important;color:#222;background:#ffeaa8;font-weight:800}.sp-note-sub{font-weight:400;font-size:9px;color:#555}
.sp-day{padding:0!important;background:#fff;cursor:pointer}.sp-day:hover{background:#f4f4f4}.sp-closed{background:#666!important;cursor:default}
.sp-times{display:grid;grid-template-columns:repeat(4,1fr);min-height:28px}.sp-times span{display:flex;align-items:center;justify-content:center;border-right:1px solid #999;font-size:10px;font-style:italic}.sp-times span:last-child{border-right:0}.sp-special{min-height:28px;display:flex;align-items:center;justify-content:center;font-weight:800;font-style:italic}.sp-empty{padding:14px!important;color:#666;background:#f7f7f7}
@media(max-width:900px){.sp-table{min-width:1100px}.sp-date{width:86px}.sp-note{width:125px}}
</style></head><body><aside id="side" class="side"><div class="brand"><div class="simple-logo" aria-label="B+">B+</div><span>B+ Gestionale HR</span></div><div id="who" class="who"></div><nav id="nav" class="nav"></nav></aside><main class="main"><header class="top"><div><h1 id="title">Dashboard</h1><div class="muted">Versione HR completa</div></div><div class="actions"><button class="btn secondary" onclick="toggleMenu()">☰</button><button class="btn" onclick="logout()">Esci</button></div></header><section id="view"></section></main><nav id="bottom" class="bottom"></nav><div id="modal" class="modal"><div class="dialog"><div class="top"><h2 id="mtitle"></h2><button class="btn secondary" onclick="closeModal()">Chiudi</button></div><div id="mbody"></div></div></div><script src="./auth-v3.js?build=20261002-login-v3"></script><script>
'use strict';
const auth=BPlusAuth.get();
if(!auth||!auth.uid||!auth.user){location.replace('./index.html?login=required');throw new Error('login required')}
const user=auth.user;const roles=['','Lavoratore','Direttore','Titolare'];const DAYS=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];const STORES=[['GAG','Gaggiolo'],['COC','Cocquio'],['DAV','Daverio'],['VAR','Varese']];const KEY='bplus_new_v4';
const defaults={employees:[],absences:[],shifts:[],notifications:[],stores:STORES.map(([id,name])=>({id,name,days:{},exceptions:{}})),courses:[]};let db=JSON.parse(localStorage.getItem(KEY)||'null')||defaults;for(const k of Object.keys(defaults))if(!db[k])db[k]=defaults[k];for(const e of db.employees){if(typeof e.oreRecuperoBase!=='number')e.oreRecuperoBase=0}if(!Array.isArray(db.attendance))db.attendance=[];if(!Array.isArray(db.board))db.board=[];if(!Array.isArray(db.audit))db.audit=[];if(!Array.isArray(db.calendarEvents))db.calendarEvents=[];if(!db.shiftWeeks||typeof db.shiftWeeks!=='object')db.shiftWeeks={};save();let page='dashboard';
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function today(){return new Date().toISOString().slice(0,10)}function toggleMenu(){side.classList.toggle('open')}function logout(){BPlusAuth.clear();location.replace('./index.html?logout=1')}function openModal(t,h){mtitle.textContent=t;mbody.innerHTML=h;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}
const P={dashboard:'Dashboard',employees:'Dipendenti',shifts:'Turni',history:'Storico turni',calendar:'Calendario HR',absences:'Ferie & Permessi',stores:'Punti vendita',courses:'Corsi',board:'Bacheca',reports:'Report',notifications:'Notifiche',audit:'Audit log',backup:'Backup & Sincronizzazione',profile:'Profilo'};function allowed(p){if(user.ruolo===3)return true;if(user.ruolo===2)return ['dashboard','employees','shifts','history','calendar','absences','courses','board','reports','notifications','profile'].includes(p);return ['dashboard','calendar','absences','courses','board','notifications','profile'].includes(p)}function go(p){if(!allowed(p))return;page=p;side.classList.remove('open');title.textContent=P[p];buildNav();render()}
function buildNav(){nav.innerHTML=Object.entries(P).filter(([p])=>allowed(p)).map(([p,n])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${n}</button>`).join('');bottom.innerHTML=[['dashboard','⌂'],['calendar','📅'],['notifications','🔔'],['menu','☰']].map(([p,i])=>`<button onclick="${p==='menu'?'toggleMenu()':`go('${p}')`}"><b>${i}</b>${p==='menu'?'Menu':P[p]}</button>`).join('');who.innerHTML=`<b>${esc(user.nome||'Utente')} ${esc(user.cognome||'')}</b><div class="muted">${roles[user.ruolo]||''}${user.negozio?' · '+esc(user.negozio):''}</div>`}
function dashboard(){return `<div class="grid"><div class="card"><div class="muted">Dipendenti</div><div class="stat">${db.employees.length}</div></div><div class="card"><div class="muted">Turni</div><div class="stat">${db.shifts.length}</div></div><div class="card"><div class="muted">Assenze</div><div class="stat">${db.absences.length}</div></div><div class="card"><div class="muted">Notifiche</div><div class="stat">${db.notifications.filter(n=>!n.read&&(n.emp==="all"||String(n.emp)===String(user.id))).length}</div></div></div><div class="section grid">${STORES.map(s=>`<div class="card"><b>${s[1]}</b><div class="muted">Configurazione punto vendita</div><button class="btn section" onclick="go('stores')">Apri</button></div>`).join('')}</div>`}
function employees(){if(user.ruolo!==3)return '<div class="card">Accesso non disponibile.</div>';return `<div class="actions"><button class="btn" onclick="employeeModal()">+ Nuovo lavoratore</button></div><div class="section tablewrap"><table class="table"><tr><th>Nome</th><th>Email</th><th>Ruolo</th><th>Negozio</th><th>Stato</th><th></th></tr>${db.employees.map(e=>`<tr><td>${esc(e.nome)} ${esc(e.cognome)}</td><td>${esc(e.email)}</td><td>${roles[e.ruolo]}</td><td>${esc(e.negozio)}</td><td>${esc(e.stato)}</td><td><button class="btn secondary" onclick="employeeModal(${e.id})">Apri</button></td></tr>`).join('')}</table></div>`}
function employeeModal(id){let e=id?db.employees.find(x=>x.id==id):{id:Date.now(),nome:'',cognome:'',email:'',telefono:'',ruolo:1,negozio:'GAG',stato:'attivo',inTurni:true,contratto:'indeterminato',ore:40,capacitaGenerale:3,policyDomeniche:'ogni2',pausaTipo:'flessibile',pausaInizio:'12:00',pausaFine:'13:30',pausaMin:60,riposiFissi:[],compensativi:[],mobilita:[]};window._emp=e;openModal('Scheda lavoratore',`<div class="tabs"><button class="active" onclick="empTab('an')">Anagrafica</button><button onclick="empTab('ct')">Contratto & Turni</button><button onclick="empTab('as')">Assenze</button></div><div id="etab"></div>`);empTab('an')}
function shiftHoursValue(s){if(!s||s.type!=='Turno'||!s.in||!s.out)return 0;const m=t=>{const q=String(t).split(':').map(Number);return q[0]*60+q[1]};let total=Math.max(0,m(s.out)-m(s.in));if(s.breakStart&&s.breakEnd)total-=Math.max(0,m(s.breakEnd)-m(s.breakStart));return Math.max(0,total)/60}
function recoveryAuto(emp){const e=typeof emp==='object'?emp:db.employees.find(x=>String(x.id)===String(emp));if(!e)return 0;const now=shiftWeekKey(todayDate());const weeks=new Set(db.shifts.filter(s=>String(s.emp)===String(e.id)&&s.date<=todayDate()).map(s=>shiftWeekKey(s.date)));weeks.add(now);let total=0;for(const w of weeks){const worked=db.shifts.filter(s=>String(s.emp)===String(e.id)&&shiftWeekKey(s.date)===w).reduce((n,s)=>n+shiftHoursValue(s),0);const hasActivity=worked>0||db.absences.some(a=>String(a.emp)===String(e.id)&&a.stato==='approvato'&&a.da<=shiftWeekDates(w)[6]&&a.a>=shiftWeekDates(w)[0]);if(!hasActivity)continue;total+=(Number(e.ore)||40)-worked}return Math.round(total*100)/100}
function recoveryBalance(emp){const e=typeof emp==='object'?emp:db.employees.find(x=>String(x.id)===String(emp));return e?Math.round(((Number(e.oreRecuperoBase)||0)+recoveryAuto(e))*100)/100:0}
function recoveryLabel(emp){const n=recoveryBalance(emp);return (n>0?'+':'')+String(n).replace('.',',')+' h'}function empTab(t){
  let e=window._emp;
  if(t==='an'){
    etab.innerHTML='<div class="form"><label>Nome<input id="en" value="'+esc(e.nome)+'"></label><label>Cognome<input id="ec" value="'+esc(e.cognome)+'"></label><label>Email<input id="ee" value="'+esc(e.email)+'"></label><label>Telefono<input id="ephone" value="'+esc(e.telefono)+'"></label><label>Ruolo<select id="er">'+[1,2,3].map(r=>'<option value="'+r+'" '+(e.ruolo==r?'selected':'')+'>'+roles[r]+'</option>').join('')+'</select></label><label>Negozio<select id="estore">'+STORES.map(s=>'<option value="'+s[0]+'" '+(e.negozio===s[0]?'selected':'')+'>'+s[1]+'</option>').join('')+'</select></label><label>Stato<select id="estate">'+['attivo','assente','ferie','malattia'].map(x=>'<option '+(e.stato===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Includi nei turni<input id="eit" type="checkbox" '+(e.inTurni?'checked':'')+'></label></div><button class="btn green section" onclick="saveEmployee()">Salva anagrafica</button>';
  }else if(t==='ct'){
    const cap=user.ruolo===3?'<label>Capacità generale<select id="generalCapacity">'+[1,2,3,4,5].map(x=>'<option value="'+x+'" '+(Number(e.capacitaGenerale||3)===x?'selected':'')+'>'+x+'</option>').join('')+'</select><span class="muted">Da 1 a 5. Usata per bilanciare la composizione delle squadre nella generazione automatica dei turni.</span></label>':'';
    etab.innerHTML='<div class="form"><label>Contratto<select id="contract"><option '+(e.contratto==='indeterminato'?'selected':'')+'>indeterminato</option><option '+(e.contratto==='determinato'?'selected':'')+'>determinato</option><option '+(e.contratto==='part-time'?'selected':'')+'>part-time</option></select></label><label>Ore settimanali<input id="hours" type="number" value="'+(e.ore||40)+'"></label>'+cap+'<label>Ore da recuperare<input id="recoveryHours" type="number" step="0.25" value="'+recoveryBalance(e)+'" '+(user.ruolo===3?'':'readonly')+'><span class="muted">Si aggiorna automaticamente in base ai turni. Il Titolare può correggerlo.</span></label><label>Policy domeniche<select id="sunPolicy"><option value="ogni2" '+(e.policyDomeniche==='ogni2'?'selected':'')+'>1 ogni 2</option><option value="ogni3" '+(e.policyDomeniche==='ogni3'?'selected':'')+'>1 ogni 3</option><option value="tutte" '+(e.policyDomeniche==='tutte'?'selected':'')+'>Tutte</option><option value="nessuna" '+(e.policyDomeniche==='nessuna'?'selected':'')+'>Nessuna</option></select></label><label>Tipo di pausa<select id="pauseType" onchange="pauseFields()"><option value="fissa" '+(e.pausaTipo==='fissa'?'selected':'')+'>Fissa</option><option value="flessibile" '+(e.pausaTipo!=='fissa'?'selected':'')+'>Flessibile</option></select></label><label id="fixedPause">Orario pausa (es. 12:00 / 13:30)<input id="pauseTime" value="'+esc((e.pausaInizio||'12:00')+' / '+(e.pausaFine||'13:30'))+'"></label><label id="flexPause">Durata pausa (minuti)<input id="pauseMin" type="number" value="'+(e.pausaMin||60)+'"></label></div><h3>Riposo fisso settimanale</h3><div class="checks">'+DAYS.map((d,i)=>'<label><input class="rf" type="checkbox" value="'+i+'" '+((e.riposiFissi||[]).includes(String(i))?'checked':'')+'>'+d+'</label>').join('')+'</div><h3>Riposo compensativo se lavora la domenica</h3><div class="muted">Giorni possibili della stessa settimana; vengono esclusi i giorni di riposo fisso.</div><div class="checks">'+DAYS.slice(0,6).map((d,i)=>'<label><input class="rc" type="checkbox" value="'+i+'" '+((e.compensativi||[]).includes(String(i))?'checked':'')+'>'+d+'</label>').join('')+'</div><h3>Mobilità</h3><div class="checks">'+STORES.map(s=>'<label><input class="mob" type="checkbox" value="'+s[0]+'" '+((e.mobilita||[]).includes(s[0])?'checked':'')+'>'+s[1]+'</label>').join('')+'</div><button class="btn green section" onclick="saveContract()">Salva Contratto & Turni</button>';
  }else{
    etab.innerHTML='<button class="btn" onclick="absenceModal('+e.id+')">+ Inserisci assenza</button><div class="section tablewrap"><table class="table"><tr><th>Tipo</th><th>Dal</th><th>Al</th><th>Stato</th></tr>'+db.absences.filter(a=>String(a.emp)===String(e.id)).map(a=>'<tr><td>'+a.tipo+'</td><td>'+a.da+'</td><td>'+a.a+'</td><td>'+a.stato+'</td></tr>').join('')+'</table></div>';
  }
  if(t==='ct')pauseFields();
}
function pauseFields(){let fixed=document.getElementById('pauseType').value==='fissa';document.getElementById('fixedPause').style.display=fixed?'grid':'none';document.getElementById('flexPause').style.display=fixed?'none':'grid'}
function saveEmployee(){let e=_emp;e.nome=en.value.trim();e.cognome=ec.value.trim();e.email=ee.value.trim();e.telefono=ephone.value.trim();e.ruolo=+er.value;e.negozio=estore.value;e.stato=estate.value;e.inTurni=eit.checked;upsertEmployee(e)}function saveContract(){let e=_emp;const autoBefore=recoveryAuto(e);if(user.ruolo===3&&document.getElementById('recoveryHours'))e.oreRecuperoBase=(+recoveryHours.value||0)-autoBefore;e.contratto=contract.value;e.ore=+hours.value;if(user.ruolo===3&&document.getElementById('generalCapacity'))e.capacitaGenerale=+generalCapacity.value||3;e.policyDomeniche=sunPolicy.value;e.pausaTipo=pauseType.value;if(e.pausaTipo==='fissa'){let x=pauseTime.value.split('/').map(s=>s.trim());e.pausaInizio=x[0]||'12:00';e.pausaFine=x[1]||'13:30'}else e.pausaMin=+pauseMin.value;e.riposiFissi=[...document.querySelectorAll('.rf:checked')].map(x=>x.value);e.compensativi=[...document.querySelectorAll('.rc:checked')].map(x=>x.value).filter(x=>!e.riposiFissi.includes(x));e.mobilita=[...document.querySelectorAll('.mob:checked')].map(x=>x.value);upsertEmployee(e)}function upsertEmployee(e){let i=db.employees.findIndex(x=>x.id==e.id);if(i<0)db.employees.push(e);else db.employees[i]=e;save();closeModal();render()}
function absenceModal(emp){openModal('Nuova assenza',`<div class="form"><label>Tipo<select id="atype"><option>Ferie</option><option>Permesso</option><option>Malattia</option><option>Corso</option></select></label><label>Dal<input id="afrom" type="date" value="${today()}"></label><label>Al<input id="ato" type="date" value="${today()}"></label><label>Note<input id="anote"></label></div><button class="btn green section" onclick="saveAbs(${emp})">Salva</button>`)}function saveAbs(emp){db.absences.push({id:Date.now(),emp,tipo:atype.value,da:afrom.value,a:ato.value,note:anote.value,stato:user.ruolo>=2?'approvato':'in_attesa'});db.notifications.unshift({id:Date.now(),emp,text:'È stata inserita una nuova assenza',read:false,date:new Date().toISOString()});save();closeModal();render()}
function absences(){let selected=document.getElementById('filterEmp')?.value||'',type=document.getElementById('filterType')?.value||'',status=document.getElementById('filterStatus')?.value||'';let list=db.absences.filter(a=>(user.ruolo!==1||String(a.emp)===String(user.id))&&(!selected||String(a.emp)===selected)&&(!type||a.tipo===type)&&(!status||a.stato===status));return `<div class="actions"><select id="filterEmp" onchange="render()"><option value="">Tutti i lavoratori</option>${db.employees.map(e=>`<option value="${e.id}" ${String(selected)===String(e.id)?'selected':''}>${esc(e.nome)} ${esc(e.cognome)}</option>`).join('')}</select><select id="filterType" onchange="render()"><option value="">Tutti i tipi</option>${['Ferie','Permesso','Malattia','Corso'].map(x=>`<option ${type===x?'selected':''}>${x}</option>`).join('')}</select><select id="filterStatus" onchange="render()"><option value="">Tutti gli stati</option>${['in_attesa','approvato','rifiutato'].map(x=>`<option ${status===x?'selected':''}>${x}</option>`).join('')}</select>${user.ruolo===1?`<button class="btn" onclick="absenceModal(${user.id})">+ Richiedi</button>`:''}</div><div class="section tablewrap"><table class="table"><tr><th>Lavoratore</th><th>Tipo</th><th>Dal</th><th>Al</th><th>Stato</th><th></th></tr>${list.map(a=>{let e=db.employees.find(x=>x.id==a.emp);return `<tr><td>${e?esc(e.nome+' '+e.cognome):a.emp}</td><td>${a.tipo}</td><td>${a.da}</td><td>${a.a}</td><td>${a.stato}</td><td>${user.ruolo>=2&&a.stato==='in_attesa'?`<button class="btn green" onclick="answerAbs(${a.id},'approvato')">Approva</button> <button class="btn danger" onclick="answerAbs(${a.id},'rifiutato')">Rifiuta</button>`:''}</td></tr>`}).join('')}</table></div>`}function answerAbs(id,status){let a=db.absences.find(x=>x.id==id);if(a){a.stato=status;db.notifications.unshift({id:Date.now(),emp:a.emp,text:'La tua richiesta di assenza è stata '+(status==='approvato'?'approvata':'rifiutata'),read:false,date:new Date().toISOString()});save();render()}}
function storeModal(id,key){let s=db.stores.find(x=>x.id===id);if(!s)return;const isWeekly=/^weekly-\d$/.test(String(key||''));const dayKey=isWeekly?key:'';const actual=isWeekly?'':(key||'');const dLabel=isWeekly?DAYS[Number(key.split('-')[1])]:actual;let v=(isWeekly?s.days[dayKey]:actual?s.exceptions[actual]:null)||{closed:false,mode:'continuato',open:'08:30',close:'20:00',mtotal:1,mopen:1,mclose:1,mpause:0,lunch1:'12:30',lunch2:'14:30'};openModal(s.name+' — '+(dLabel||'Orario standard'),`<div class="form"><label>Giorno standard<input value="${dLabel||'—'}" readonly></label><label>Data specifica (opzionale)<input id="sdate" type="date" value="${actual}"></label><label>Festivo / chiuso<input id="sclosed" type="checkbox" ${v.closed?'checked':''}></label><label>Dalle<input id="sopen" type="time" value="${v.open||'08:30'}"></label><label>Alle<input id="sclose" type="time" value="${v.close||'20:00'}"></label><label style="display:flex;align-items:center;gap:8px;background:#25282d;padding:10px;border-radius:8px"><input id="ssplit" type="checkbox" ${v.mode==='spezzato'?'checked':''} onchange="splitFields()"> Orario spezzato</label><div id="splitFields" style="display:${v.mode==='spezzato'?'contents':'none'}"><label>Pausa pranzo dalle<input id="sl1" type="time" value="${v.lunch1||'12:30'}"></label><label>Pausa pranzo alle<input id="sl2" type="time" value="${v.lunch2||'14:30'}"></label></div><label>Min. personale giornaliero<input id="smt" type="number" min="0" value="${v.mtotal??1}"></label><label>Min. persone in apertura<input id="smo" type="number" min="0" value="${v.mopen??1}"></label><label>Min. persone in chiusura<input id="smc" type="number" min="0" value="${v.mclose??1}"></label><label>Min. persone in pausa<input id="smp" type="number" min="0" value="${v.mpause??0}"></label></div><button class="btn green section" onclick="saveStore('${id}','${key||''}')">Salva</button>`)}function splitFields(){let f=document.getElementById('splitFields');if(f)f.style.display=document.getElementById('ssplit').checked?'contents':'none'}function saveStore(id,key){let s=db.stores.find(x=>x.id===id);if(!s)return;let split=document.getElementById('ssplit').checked;let v={closed:sclosed.checked,mode:split?'spezzato':'continuato',open:sopen.value,close:sclose.value,lunch1:document.getElementById('sl1')?.value||'12:30',lunch2:document.getElementById('sl2')?.value||'14:30',mtotal:+smt.value,mopen:+smo.value,mclose:+smc.value,mpause:+smp.value};let actual=sdate.value;if(actual){s.exceptions[actual]=v}else{let dayKey=/^weekly-\d$/.test(String(key||''))?key:null;if(dayKey)s.days[dayKey]=v;else{alert('Seleziona il giorno standard da modificare.');return}}save();closeModal();render()}
function stores(){if(user.ruolo!==3)return '<div class="card">Accesso non disponibile.</div>';return db.stores.map(s=>`<div class="section card"><div class="top"><h3>${esc(s.name)}</h3></div><div class="tablewrap"><table class="table"><tr><th>Giorno</th><th>Orario</th><th>Festivo</th><th>Min giornaliero</th><th>Min apertura</th><th>Min chiusura</th><th>Min pausa</th><th></th></tr>${DAYS.map((d,i)=>{let v=s.days['weekly-'+i]||{};return `<tr><td>${d}</td><td>${v.closed?'CHIUSO':(v.mode==='spezzato'?'Spezzato '+(v.lunch1||'')+'–'+(v.lunch2||''):(v.open||'—')+'–'+(v.close||'—'))}</td><td>${v.closed?'Sì':'No'}</td><td>${v.mtotal??'—'}</td><td>${v.mopen??'—'}</td><td>${v.mclose??'—'}</td><td>${v.mpause??'—'}</td><td><button class="btn secondary" onclick="storeModal('${s.id}','weekly-${i}')">Modifica</button></td></tr>`}).join('')}</table></div><div class="actions section"><input id="ex_${s.id}" type="date"><button class="btn secondary" onclick="storeModal('${s.id}',document.getElementById('ex_${s.id}').value)">Modifica data specifica</button></div></div>`).join('')}
function history(){let sundays=[];let d=new Date();d.setDate(d.getDate()-((d.getDay()||7)));for(let i=0;i<12;i++){let x=new Date(d);x.setDate(d.getDate()-i*7);sundays.push(x.toISOString().slice(0,10))}let es=db.employees.filter(e=>user.ruolo===3||e.negozio===user.negozio);return `<div class="card"><h3>Domeniche lavorate</h3><div class="matrix"><table><tr><th>Negozio / lavoratore</th>${sundays.map(x=>`<th>${x.slice(8,10)}/${x.slice(5,7)}</th>`).join('')}</tr>${STORES.map(st=>{let ee=es.filter(e=>e.negozio===st[0]);return ee.length?`<tr><th colspan="13">${st[1]}</th></tr>`+ee.map(e=>`<tr><td>${esc(e.nome)} ${esc(e.cognome)}</td>${sundays.map(x=>{let w=db.shifts.some(s=>String(s.emp)===String(e.id)&&s.date===x&&s.type!=='Riposo');return `<td class="${w?'worked':''}">${w?'●':'—'}</td>`}).join('')}</tr>`).join(''):''}).join('')}</table></div></div>`}
function shifts(){let list=db.shifts.slice();if(user.ruolo===2)list=list.filter(s=>s.store===user.negozio);const emps=[...new Set(list.map(s=>String(s.emp)))].map(id=>db.employees.find(e=>String(e.id)===id)).filter(Boolean);return '<div class="card"><h3>Turni</h3><div class="muted section">Le ore da recuperare si aggiornano automaticamente in base alle ore contrattuali e ai turni inseriti. Il Titolare può correggere il saldo dalla scheda Contratto & Turni.</div><div class="tablewrap"><table class="table"><tr><th>Data</th><th>Lavoratore</th><th>Negozio</th><th>Entrata</th><th>Uscita</th><th>Tipo</th><th>Ore da recuperare</th></tr>'+list.map(s=>{let e=db.employees.find(x=>x.id==s.emp);return '<tr><td>'+s.date+'</td><td>'+esc(e?e.nome+' '+e.cognome:s.emp)+'</td><td>'+esc(s.store||'')+'</td><td>'+esc(s.in||'')+'</td><td>'+esc(s.out||'')+'</td><td>'+esc(s.type||'Turno')+'</td><td><b>'+recoveryLabel(e)+'</b></td></tr>'}).join('')+'</table></div><div class="section"><h3>Saldo per lavoratore</h3>'+emps.map(e=>'<div class="card section"><b>'+esc(e.nome+' '+e.cognome)+'</b><span style="float:right"><b>'+recoveryLabel(e)+'</b></span></div>').join('')+'</div></div>'}
function notifications(){let ns=db.notifications.filter(n=>n.emp==='all'||String(n.emp)===String(user.id));return `<div class="actions"><button class="btn" onclick="db.notifications.forEach(n=>{if(n.emp==='all'||String(n.emp)===String(user.id))n.read=true});save();render()">Segna tutte lette</button></div>${ns.map(n=>`<div class="card section"><b>${n.read?'':'● '}${esc(n.text)}</b><div class="muted">${new Date(n.date).toLocaleString('it-IT')}</div></div>`).join('')||'<div class="card section">Nessuna notifica.</div>'}`}
function profile(){return `<div class="card"><h3>${esc(user.nome||'')} ${esc(user.cognome||'')}</h3><p>${esc(user.email||'')}</p><p class="muted">${roles[user.ruolo]||''}</p></div>`}
function courseModal(id){let c=id?db.courses.find(x=>String(x.id)===String(id)):null;let today=todayDate();c=c||{id:Date.now(),emp:'',titolo:'',categoria:'Sicurezza',ente:'',data:today,scadenza:'',durata:4,stato:'programmato',attestato:'',note:''};window._course=c;openModal(id?'Scheda corso':'Nuovo corso',`<div class="form"><label>Lavoratore<select id="coEmp"><option value="">Seleziona lavoratore</option>${db.employees.map(e=>`<option value="${e.id}" ${String(c.emp)===String(e.id)?'selected':''}>${esc(e.nome)} ${esc(e.cognome)}</option>`).join('')}</select></label><label>Titolo corso<input id="coTitle" value="${esc(c.titolo)}" placeholder="Es. Sicurezza generale"></label><label>Categoria<select id="coCat">${['Sicurezza','Antincendio','Primo soccorso','Privacy','HACCP','Formazione professionale','Altro'].map(x=>`<option ${c.categoria===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Ente / formatore<input id="coProvider" value="${esc(c.ente)}"></label><label>Data corso<input id="coDate" type="date" value="${c.data||''}"></label><label>Scadenza<input id="coExpiry" type="date" value="${c.scadenza||''}"></label><label>Durata (ore)<input id="coHours" type="number" min="0" step="0.5" value="${c.durata||0}"></label><label>Stato<select id="coStatus">${['programmato','in corso','completato','scaduto'].map(x=>`<option ${c.stato===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Attestato / documento<input id="coCert" value="${esc(c.attestato)}" placeholder="URL o riferimento documento"></label><label style="grid-column:1/-1">Note<textarea id="coNotes" rows="3">${esc(c.note)}</textarea></label></div><div class="actions section"><button class="btn green" onclick="saveCourse()">Salva corso</button>${id?'<button class="btn danger" onclick="deleteCourse()">Elimina</button>':''}</div>`)}
function todayDate(){return new Date().toISOString().slice(0,10)}
function saveCourse(){let c=window._course;c.emp=coEmp.value;c.titolo=coTitle.value.trim();c.categoria=coCat.value;c.ente=coProvider.value.trim();c.data=coDate.value;c.scadenza=coExpiry.value;c.durata=+coHours.value||0;c.stato=coStatus.value;c.attestato=coCert.value.trim();c.note=coNotes.value.trim();if(!c.emp||!c.titolo){alert('Seleziona il lavoratore e inserisci il titolo del corso.');return}let i=db.courses.findIndex(x=>String(x.id)===String(c.id));if(i<0)db.courses.push(c);else db.courses[i]=c;save();closeModal();render()}
function deleteCourse(){if(!confirm('Eliminare definitivamente questo corso?'))return;db.courses=db.courses.filter(x=>String(x.id)!==String(window._course.id));save();closeModal();render()}
function courseState(c){if(c.scadenza&&c.scadenza<todayDate()&&c.stato!=='completato')return 'scaduto';if(c.scadenza&&c.scadenza>=todayDate()){let d=Math.ceil((new Date(c.scadenza)-new Date(todayDate()))/86400000);if(d<=30)return 'in_scadenza'}return c.stato||'programmato'}
function courses(){let q=document.getElementById('courseQ')?.value||'',cat=document.getElementById('courseCat')?.value||'',st=document.getElementById('courseStatus')?.value||'';let list=db.courses.filter(c=>{let e=db.employees.find(x=>String(x.id)===String(c.emp));let mine=user.ruolo===1?String(c.emp)===String(user.id):true;return mine&&(!q||String(c.titolo+' '+(e?.nome||'')+' '+(e?.cognome||'')).toLowerCase().includes(q.toLowerCase()))&&(!cat||c.categoria===cat)&&(!st||courseState(c)===st)});let exp=db.courses.filter(c=>courseState(c)==='in_scadenza').length,scad=db.courses.filter(c=>courseState(c)==='scaduto').length,done=db.courses.filter(c=>c.stato==='completato').length;return `<div class="grid"><div class="card"><div class="muted">Corsi totali</div><div class="stat">${db.courses.length}</div></div><div class="card"><div class="muted">Completati</div><div class="stat">${done}</div></div><div class="card"><div class="muted">In scadenza</div><div class="stat">${exp}</div></div><div class="card"><div class="muted">Scaduti</div><div class="stat">${scad}</div></div></div><div class="actions section"><input id="courseQ" placeholder="Cerca corso o lavoratore" value="${esc(q)}" oninput="render()"><select id="courseCat" onchange="render()"><option value="">Tutte le categorie</option>${['Sicurezza','Antincendio','Primo soccorso','Privacy','HACCP','Formazione professionale','Altro'].map(x=>`<option ${cat===x?'selected':''}>${x}</option>`).join('')}</select><select id="courseStatus" onchange="render()"><option value="">Tutti gli stati</option>${['programmato','in corso','completato','in_scadenza','scaduto'].map(x=>`<option value="${x}" ${st===x?'selected':''}>${x.replace('_',' ')}</option>`).join('')}</select>${user.ruolo===3?'<button class="btn" onclick="courseModal()">+ Nuovo corso</button>':''}</div><div class="section tablewrap"><table class="table"><tr><th>Lavoratore</th><th>Corso</th><th>Categoria</th><th>Data</th><th>Scadenza</th><th>Stato</th><th>Attestato</th><th></th></tr>${list.map(c=>{let e=db.employees.find(x=>String(x.id)===String(c.emp)),s=courseState(c);return `<tr><td>${e?esc(e.nome+' '+e.cognome):'—'}</td><td><b>${esc(c.titolo)}</b><div class="muted">${esc(c.ente||'')}</div></td><td>${esc(c.categoria||'')}</td><td>${c.data||'—'}</td><td>${c.scadenza||'—'}</td><td>${esc(s.replace('_',' '))}</td><td>${c.attestato?`<a href="${esc(c.attestato)}" target="_blank" rel="noopener">Apri</a>`:'—'}</td><td>${user.ruolo===3?`<button class="btn secondary" onclick="courseModal('${c.id}')">Apri</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="8">Nessun corso presente.</td></tr>'}</table></div>`}
function reports(){return `<div class="grid"><div class="card"><b>Presenze</b><div class="stat">${db.shifts.length}</div></div><div class="card"><b>Assenze</b><div class="stat">${db.absences.length}</div></div><div class="card"><b>Formazione</b><div class="stat">${db.courses.length}</div></div></div>`}

function audit(action,detail){db.audit.unshift({id:Date.now()+Math.random(),at:new Date().toISOString(),user:String(user.id),name:(user.nome||'')+' '+(user.cognome||''),action,detail});if(db.audit.length>500)db.audit.length=500}
function empName(id){const e=db.employees.find(x=>String(x.id)===String(id));return e?e.nome+' '+e.cognome:'Utente '+id}
function refreshNotifications(){const now=todayDate();db.courses.forEach(c=>{if(!c.scadenza)return;const days=Math.ceil((new Date(c.scadenza)-new Date(now))/86400000);if(days>=0&&days<=30){const key='course:'+c.id+':'+c.scadenza;if(!db.notifications.some(n=>n.key===key&&String(n.emp)===String(c.emp))){db.notifications.unshift({id:Date.now()+Math.random(),key,emp:String(c.emp),text:'Il corso "'+c.titolo+'" scade tra '+days+' giorni',read:false,date:new Date().toISOString()})}}});db.absences.filter(a=>a.stato==='in_attesa').forEach(a=>{const key='absence:'+a.id;if(!db.notifications.some(n=>n.key===key&&String(n.emp)===String(a.emp))){db.notifications.unshift({id:Date.now()+Math.random(),key,emp:String(a.emp),text:'La richiesta di '+a.tipo.toLowerCase()+' è in attesa di approvazione',read:false,date:new Date().toISOString()})}});save()}
function dashboard(){refreshNotifications();const pending=db.absences.filter(a=>a.stato==='in_attesa'&&(user.ruolo>=2||String(a.emp)===String(user.id))).length;const exp=db.courses.filter(c=>courseState(c)==='in_scadenza'&&(user.ruolo!==1||String(c.emp)===String(user.id))).length;return '<div class="grid"><div class="card"><div class="muted">Dipendenti</div><div class="stat">'+db.employees.length+'</div></div><div class="card"><div class="muted">Turni</div><div class="stat">'+db.shifts.length+'</div></div><div class="card"><div class="muted">Richieste in attesa</div><div class="stat">'+pending+'</div></div><div class="card"><div class="muted">Scadenze formazione</div><div class="stat">'+exp+'</div></div></div><div class="section grid">'+STORES.map(s=>'<div class="card"><b>'+s[1]+'</b><div class="muted">Configurazione punto vendita</div><button class="btn section" onclick="go(\'stores\')">Apri</button></div>').join('')+'</div>'}
function attendance(){const mine=user.ruolo===1;let list=db.attendance.filter(a=>!mine||String(a.emp)===String(user.id));const todayRec=list.find(a=>a.date===todayDate()&&String(a.emp)===String(user.id));return '<div class="grid"><div class="card"><div class="muted">Oggi</div><div class="stat">'+todayDate()+'</div><p>'+(!todayRec?'Nessuna entrata registrata':('Entrata <b>'+todayRec.in+'</b><br>Uscita <b>'+(todayRec.out||'—')+'</b><br>Pausa <b>'+(todayRec.breakMin||0)+' min</b>'))+'</p><div class="actions">'+(!todayRec?'<button class="btn green" onclick="clockIn()">▶ Entrata</button>':(!todayRec.out?'<button class="btn" onclick="clockOut()">■ Uscita</button><button class="btn secondary" onclick="addBreak()">☕ Pausa</button>':''))+'</div></div><div class="card"><div class="muted">Ore lavorate oggi</div><div class="stat">'+workedHours(todayRec)+'</div><p class="muted">Calcolo basato sulle timbrature.</p></div></div><div class="section tablewrap"><table class="table"><tr><th>Data</th><th>Lavoratore</th><th>Negozio</th><th>Entrata</th><th>Uscita</th><th>Pausa</th><th>Ore</th><th>Stato</th></tr>'+list.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,100).map(a=>'<tr><td>'+a.date+'</td><td>'+esc(empName(a.emp))+'</td><td>'+esc(a.store||'')+'</td><td>'+a.in+'</td><td>'+(a.out||'—')+'</td><td>'+(a.breakMin||0)+'</td><td>'+workedHours(a)+'</td><td>'+(a.out?'completa':'aperta')+'</td></tr>').join('')+'</table></div>'}
function workedHours(a){if(!a||!a.in)return '0:00';const end=a.out||new Date().toTimeString().slice(0,5);const m=(x)=>{const q=x.split(':');return +q[0]*60 + +q[1]};let n=Math.max(0,m(end)-m(a.in)-(a.breakMin||0));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function clockIn(){let ex=db.attendance.find(a=>a.date===todayDate()&&String(a.emp)===String(user.id));if(ex){alert('Entrata già registrata.');return}db.attendance.push({id:Date.now(),emp:user.id,date:todayDate(),in:new Date().toTimeString().slice(0,5),out:'',breakMin:0,store:user.negozio||'',status:'aperta'});audit('Presenza','Entrata '+todayDate());save();render()}
function clockOut(){let a=db.attendance.find(x=>x.date===todayDate()&&String(x.emp)===String(user.id));if(!a){alert('Registra prima l’entrata.');return}a.out=new Date().toTimeString().slice(0,5);a.status='completa';audit('Presenza','Uscita '+todayDate());save();render()}
function addBreak(){let a=db.attendance.find(x=>x.date===todayDate()&&String(x.emp)===String(user.id));if(!a||a.out){alert('Nessuna presenza aperta.');return}const n=prompt('Minuti di pausa da aggiungere','30');if(n&&+n>0){a.breakMin=(a.breakMin||0)+(+n);audit('Presenza','Pausa '+n+' minuti');save();render()}}
function shiftWeekKey(date){const d=new Date(date+'T12:00:00');const day=d.getDay()||7;d.setDate(d.getDate()-day+1);return d.toISOString().slice(0,10)}
function shiftWeekDates(week){const d=new Date(week+'T12:00:00');return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return x.toISOString().slice(0,10)})}
function weekLabel(week){const ds=shiftWeekDates(week);return ds[0].slice(8,10)+'/'+ds[0].slice(5,7)+' – '+ds[6].slice(8,10)+'/'+ds[6].slice(5,7)}
function shiftStores(){return STORES.map(s=>s[0])}
function weekStoreState(week,store){if(!db.shiftWeeks||typeof db.shiftWeeks!=='object')db.shiftWeeks={};if(!db.shiftWeeks[week]||typeof db.shiftWeeks[week]!=='object')db.shiftWeeks[week]={};if(!db.shiftWeeks[week][store])db.shiftWeeks[week][store]={status:'bozza'};return db.shiftWeeks[week][store]}
function weekStoreStatus(week,store){return weekStoreState(week,store).status||'bozza'}
function allStoresDirectorApproved(week){return shiftStores().every(s=>['approvata_direttore','inviato_titolare','approvata_titolare'].includes(weekStoreStatus(week,s)))}
function allStoresOwnerApproved(week){return shiftStores().every(s=>weekStoreStatus(week,s)==='approvata_titolare')}function approvedWeekHistory(week,store,limit=4){const out=[];const d=new Date(week+'T12:00:00');for(let i=1;i<=26&&out.length<limit;i++){d.setDate(d.getDate()-7);const w=d.toISOString().slice(0,10);if(weekStoreStatus(w,store)==='approvata_titolare')out.push(w)}return out}
function continuityProfile(emp,store,week){const history=approvedWeekHistory(week,store,4);const profile={weekdays:new Set(),starts:new Map(),partners:new Map(),partnerDays:new Map()};for(const w of history){const ds=shiftWeekDates(w);for(const s of db.shifts.filter(x=>x.store===store&&ds.includes(x.date)&&String(x.emp)===String(emp.id)&&x.type==='Turno')){const wd=new Date(s.date+'T12:00:00').getDay();profile.weekdays.add(wd);if(s.in)profile.starts.set(wd,s.in)}for(const d of ds){const mine=db.shifts.filter(x=>x.store===store&&x.date===d&&x.type==='Turno'&&String(x.emp)===String(emp.id));if(!mine.length)continue;for(const s of db.shifts.filter(x=>x.store===store&&x.date===d&&x.type==='Turno'&&String(x.emp)!==String(emp.id))){profile.partners.set(String(s.emp),(profile.partners.get(String(s.emp))||0)+1);const wd=new Date(d+'T12:00:00').getDay();profile.partnerDays.set(wd,(profile.partnerDays.get(wd)||0)+1)}}}return{history,profile}}

function approvedAbsence(emp,date){return db.absences.some(a=>String(a.emp)===String(emp)&&a.stato==='approvato'&&date>=a.da&&date<=a.a)}
function sundayPolicy(emp){return emp.policyDomeniche||'ogni2'}
function isSunday(date){return new Date(date+'T12:00:00').getDay()===0}
function sundayShiftExists(emp,date){return db.shifts.some(s=>String(s.emp)===String(emp)&&s.date===date&&s.type==='Turno')}
function sundayDatesAround(date){const d=new Date(date+'T12:00:00');const out=[];for(let i=-12;i<=12;i++){const x=new Date(d);x.setDate(d.getDate()+i*7);out.push(x.toISOString().slice(0,10))}return out}
function sundayCanWork(emp,date){
  if(!isSunday(date))return true;
  const policy=sundayPolicy(emp);
  if(policy==='tutte')return true;
  if(policy==='nessuna')return false;
  const d=new Date(date+'T12:00:00');
  if(policy==='ogni3'){
    const prev=new Date(d);prev.setDate(d.getDate()-14);
    const p=prev.toISOString().slice(0,10);
    return !sundayShiftExists(emp,p);
  }
  // 1 ogni 2 = alternanza normale. Se per un'eccezione il lavoratore
  // ha già lavorato due domeniche consecutive, le due domeniche successive
  // diventano di riposo: W-W-O-O-W, poi si riprende l'alternanza.
  const sundays=[];
  for(let i=1;i<=12;i++){
    const x=new Date(d);
    x.setDate(d.getDate()-7*i);
    sundays.push(x.toISOString().slice(0,10));
  }
  const worked=i=>sundayShiftExists(emp,sundays[i-1]);

  // Due domeniche consecutive già lavorate => questa è la prima delle
  // due domeniche di recupero obbligatorie.
  if(worked(1)&&worked(2))return false;

  // Se le due domeniche precedenti sono state di riposo e le due ancora
  // precedenti sono state lavorate, questa è la ripresa dopo il recupero.
  if(!worked(1)&&!worked(2)&&worked(3)&&worked(4))return true;

  // Alternanza ordinaria: lavoro/riposo/lavoro/riposo.
  const lastWorkedIndex=sundays.findIndex(x=>sundayShiftExists(emp,x));
  if(lastWorkedIndex<0)return true;
  return lastWorkedIndex%2===1;
}
function courseOnDate(emp,date){return db.courses.find(c=>String(c.emp)===String(emp)&&c.data===date&&(c.stato==='programmato'||c.stato==='in corso'||c.stato==='completato'))||null}
function storeDay(store,date){const s=db.stores.find(x=>x.id===store);if(!s)return null;const d=new Date(date+'T12:00:00').getDay();return (s.exceptions&&s.exceptions[date])||((s.days&&s.days['weekly-'+d])||null)}
function addMinutesToTime(t,min){const q=t.split(':').map(Number);let n=q[0]*60+q[1]+min;return String(Math.floor((n+1440)%1440/60)).padStart(2,'0')+':'+String((n+1440)%60).padStart(2,'0')}
function timeMin(t){const q=String(t||'00:00').split(':').map(Number);return (q[0]||0)*60+(q[1]||0)}
function timeStr(n){n=Math.max(0,Math.round(n));return String(Math.floor(n/60)%24).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function contractPause(e,h){
  if(e&&e.pausaTipo==='fissa'){
    const a=timeMin(e.pausaInizio||'12:00'),b=timeMin(e.pausaFine||'13:30');
    if(b>a)return {minutes:b-a,start:a,end:b};
  }
  const mins=Math.max(0,Number(e?.pausaMin)||0);
  if(mins>0)return {minutes:mins,start:timeMin(h?.lunch1||'12:30'),end:timeMin(h?.lunch1||'12:30')+mins};
  return {minutes:0,start:0,end:0};
}
function generatedTimes(e,h,kind,worked){
  const open=timeMin(h.open||'08:30'),close=timeMin(h.close||'17:30');
  let work=Math.max(0,Math.min(8,Number(worked)||0));
  let p=contractPause(e,h);
  if(work<=6)p={minutes:0,start:0,end:0};
  if(p.minutes>0 && close-open<work*60+p.minutes)work=Math.max(0,(close-open-p.minutes)/60);
  if(work<=0)return null;
  if(p.minutes>0 && e.pausaTipo==='fissa'){
    const ps=p.start,pe=p.end;
    if(kind==='close'){
      let start=close-work*60-p.minutes;
      if(start<open)start=open;
      if(start>ps)start=Math.max(open,ps-Math.min(60,work*30));
      const post=Math.max(0,work-(ps-start));
      const end=Math.max(pe,ps)+post;
      if(end>close+1)return null;
      return {in:timeStr(start),breakStart:timeStr(ps),breakEnd:timeStr(pe),out:timeStr(end),worked:Math.max(0,(end-start-p.minutes)/60)};
    }
    if(ps<open || pe>close)return generatedTimes({...e,pausaTipo:'flessibile'},h,kind,work);
    const before=Math.min(work,Math.max(0,ps-open));
    const after=Math.max(0,work-before);
    const end=pe+after;
    if(end>close)return null;
    return {in:timeStr(open),breakStart:timeStr(ps),breakEnd:timeStr(pe),out:timeStr(end),worked:work};
  }
  if(kind==='close'){
    const end=close;
    const start=end-work*60-p.minutes;
    if(start<open)return null;
    const bs=p.minutes?Math.round(start+Math.min(work*60/2,Math.max(0,(work*60-p.minutes)/2))):0;
    const be=p.minutes?bs+p.minutes:0;
    return {in:timeStr(start),breakStart:p.minutes?timeStr(bs):'',breakEnd:p.minutes?timeStr(be):'',out:timeStr(end),worked:work};
  }
  const start=open,end=start+work*60+p.minutes;
  if(end>close)return null;
  const bs=p.minutes?Math.round(start+(work*60-p.minutes)/2):0;
  const be=p.minutes?bs+p.minutes:0;
  return {in:timeStr(start),breakStart:p.minutes?timeStr(bs):'',breakEnd:p.minutes?timeStr(be):'',out:timeStr(end),worked:work};
}
function eligibleForStore(e,store){
  return e.negozio===store||(Array.isArray(e.mobilita)&&e.mobilita.includes(store));
}
function employeeHasDay(e,date){
  return db.shifts.some(s=>String(s.emp)===String(e.id)&&s.date===date&&(s.type==='Turno'||s.type==='Corso'||s.type==='Ferie'||s.type==='Malattia'));
}
function resetWeek(week){
  if(user.ruolo!==3)return;
  week=week||shiftWeekKey(todayDate());
  if(!confirm('RESET settimana '+weekLabel(week)+'? Verranno cancellati tutti i turni, corsi inseriti automaticamente e stati di approvazione della settimana.'))return;
  const dates=shiftWeekDates(week);
  db.shifts=db.shifts.filter(s=>!dates.includes(s.date));
  if(db.shiftWeeks&&db.shiftWeeks[week])delete db.shiftWeeks[week];
  audit('Turni','Reset settimana '+week);
  save();render();
}

    '<div class="card section"><b>La generazione rispetta:</b><ul><li>ore contrattuali settimanali complessive, anche se il lavoratore opera in più negozi</li><li>pause configurate nel contratto</li><li>riposi fissi e policy domeniche</li><li>assenze approvate e corsi</li><li>apertura e chiusura del punto vendita</li><li>minimo personale, apertura e chiusura del negozio</li></ul></div>'+
    '<div class="actions section"><button class="btn green" onclick="generateWeek()">Genera turni</button></div>');

function generateWeek(){
  const week=shiftWeekKey(genWeek.value),onlyStore=genStore.value,dates=shiftWeekDates(week);
  if(!db.shiftWeeks||typeof db.shiftWeeks!=='object')db.shiftWeeks={};
  const replace=!!genReplace.checked;
  const stores=onlyStore?[onlyStore]:shiftStores();
  const existingWeekShifts=db.shifts.filter(s=>dates.includes(s.date)&&(s.type==='Turno'||s.type==='Corso'));
  if(existingWeekShifts.length&&!replace){
    if(!confirm('La settimana '+weekLabel(week)+' contiene già turni. Vuoi sovrascriverli?'))return;
  }
  const doReplace=replace||existingWeekShifts.length>0;
  if(doReplace){
    db.shifts=db.shifts.filter(s=>!dates.includes(s.date)||(onlyStore&&s.store!==onlyStore));
    if(!onlyStore){
      for(const k of Object.keys(db.shiftWeeks[week]||{}))delete db.shiftWeeks[week][k];
    }else if(db.shiftWeeks[week])delete db.shiftWeeks[week][onlyStore];
  }
  if(!db.shiftWeeks[week])db.shiftWeeks[week]={};
  for(const store of stores)db.shiftWeeks[week][store]={status:'bozza'};

  const allWorkers=db.employees.filter(e=>e.stato==='attivo'&&e.inTurni!==false);
  const eligible=Object.fromEntries(stores.map(store=>[store,allWorkers.filter(e=>eligibleForStore(e,store))]));
  const state=Object.fromEntries(allWorkers.map(e=>[String(e.id),{
    assigned:doReplace?0:db.shifts.filter(s=>String(s.emp)===String(e.id)&&dates.includes(s.date)&&s.type==='Turno').reduce((n,s)=>n+shiftHoursValue(s),0),
    days:new Set(doReplace?[]:db.shifts.filter(s=>String(s.emp)===String(e.id)&&dates.includes(s.date)).map(s=>s.date)),
    close:0,open:0
  }]));
  let created=0,uncovered=[];

  const canWork=(e,date)=>{
    const day=new Date(date+'T12:00:00').getDay();
    if((e.riposiFissi||[]).includes(String(day)))return false;
    if(approvedAbsence(e.id,date))return false;
    if(day===0&&!sundayCanWork(e,date))return false;
    if(state[String(e.id)].days.has(date))return false;
    if(state[String(e.id)].assigned>=Math.max(0,Number(e.ore)||40)-0.01)return false;
    return true;
  };
  const addShift=(e,store,date,h,kind)=>{
    const st=state[String(e.id)];
    const remaining=Math.max(0,(Number(e.ore)||40)-st.assigned);
    const wanted=Math.min(8,remaining);
    const tm=generatedTimes(e,h,kind,wanted);
    if(!tm||tm.worked<=0)return false;
    const x={id:Date.now()+created+Math.floor(Math.random()*1000),emp:e.id,date,store,in:tm.in,out:tm.out,breakStart:tm.breakStart||'',breakEnd:tm.breakEnd||'',type:'Turno',note:'Generato automaticamente · copertura apertura/chiusura · pausa da contratto'};
    db.shifts.push(x);created++;st.assigned+=tm.worked;st.days.add(date);
    if(kind==='close')st.close++;if(kind==='open')st.open++;
    return true;
  };

  // First pass: guarantee opening/closing and minimum daily staffing for every store.
  for(const date of dates){
    for(const store of stores){
      const h=storeDay(store,date);
      if(!h||h.closed)continue;
      const minTotal=Math.max(1,Number(h.mtotal)||1);
      const minOpen=Math.max(0,Number(h.mopen)||0);
      const minClose=Math.max(0,Number(h.mclose)||0);
      const dayShifts=()=>db.shifts.filter(s=>s.store===store&&s.date===date&&s.type==='Turno');
      const assignKind=(kind)=>{
        const list=eligible[store].filter(e=>canWork(e,date)).sort((a,b)=>{
          const sa=state[String(a.id)],sb=state[String(b.id)];
          const av=(Number(a.capacitaGenerale)||3),bv=(Number(b.capacitaGenerale)||3);
          return (kind==='close'?sa.close*3:sa.open*0.5)- (kind==='close'?sb.close*3:sb.open*0.5) || sa.assigned-av*0.05-(sb.assigned-bv*0.05);
        });
        for(const e of list)if(addShift(e,store,date,h,kind))return true;
        return false;
      };
      for(let n=0;n<minClose;n++){
        if(!dayShifts().some(s=>s.out===h.close)&&!assignKind('close'))uncovered.push(store+' '+date+' chiusura');
      }
      for(let n=0;n<minOpen;n++){
        if(!dayShifts().some(s=>s.in===h.open)&&!assignKind('open'))uncovered.push(store+' '+date+' apertura');
      }
      while(dayShifts().length<minTotal){
        if(!assignKind('middle'))break;
      }
    }
  }

  // Second pass: complete each employee's contractual weekly hours, globally across stores.
  for(const e of allWorkers){
    const target=Math.max(0,Number(e.ore)||40);
    const st=state[String(e.id)];
    let guard=0;
    while(st.assigned<target-0.01&&guard++<50){
      const candidates=[];
      for(const date of dates){
        if(!canWork(e,date))continue;
        for(const store of stores){
          if(!eligibleForStore(e,store))continue;
          const h=storeDay(store,date);if(!h||h.closed)continue;
          const cp=continuityProfile(e,store,week);
          const wd=new Date(date+'T12:00:00').getDay();
          const existing= db.shifts.some(s=>String(s.emp)===String(e.id)&&s.store===store&&s.date===date&&s.type==='Turno');
          if(existing)continue;
          const shortage=Math.max(0,(Number(h.mtotal)||1)-db.shifts.filter(s=>s.store===store&&s.date===date&&s.type==='Turno').length);
          const closeShort=db.shifts.filter(s=>s.store===store&&s.date===date&&s.type==='Turno').some(s=>s.out===h.close)?0:4;
          const openShort=db.shifts.filter(s=>s.store===store&&s.date===date&&s.type==='Turno').some(s=>s.in===h.open)?0:1;
          const sameDay=cp.profile.weekdays.has(wd)?0:1.5;
          const capPenalty=db.shifts.filter(s=>s.store===store&&s.date===date&&s.type==='Turno').length/(Number(e.capacitaGenerale)||3);
          const hoursPenalty=st.assigned/Math.max(1,target);
          candidates.push({date,store,h,score:-shortage*5-closeShort-openShort+sameDay+capPenalty+hoursPenalty});
        }
      }
      candidates.sort((a,b)=>a.score-b.score||a.date.localeCompare(b.date));
      if(!candidates.length)break;
      const p=candidates[0];
      const kind=db.shifts.some(s=>s.store===p.store&&s.date===p.date&&s.type==='Turno'&&s.out===p.h.close)?'open':'close';
      if(!addShift(e,p.store,p.date,p.h,kind))break;
    }
  }

  // Third pass: any store still missing the minimum daily staffing/closing gets a clear warning.
  for(const date of dates)for(const store of stores){
    const h=storeDay(store,date);if(!h||h.closed)continue;
    const ds=db.shifts.filter(s=>s.store===store&&s.date===date&&s.type==='Turno');
    if(ds.length<Math.max(1,Number(h.mtotal)||1))uncovered.push(store+' '+date+' personale minimo');
    if(Number(h.mclose)||0){
      if(!ds.some(s=>s.out===h.close))uncovered.push(store+' '+date+' chiusura');
    }
    if(Number(h.mopen)||0){
      if(!ds.some(s=>s.in===h.open))uncovered.push(store+' '+date+' apertura');
    }
  }

  // Courses are added only when the worker has no shift/absence that day.
  for(const e of allWorkers)for(const date of dates){
    const co=courseOnDate(e.id,date);
    if(!co||employeeHasDay(e,date))continue;
    const store=(e.negozio&&stores.includes(e.negozio))?e.negozio:(stores.find(s=>eligibleForStore(e,s))||stores[0]);
    if(store)db.shifts.push({id:Date.now()+created,emp:e.id,date,store,in:'',out:'',breakStart:'',breakEnd:'',type:'Corso',note:co.titolo||'Corso'}),created++;
  }

  audit('Turni','Generata settimana '+week+' · '+created+' elementi · ore contrattuali globali, pause contratto, riposi, apertura/chiusura e multi-negozio');
  save();closeModal();render();
  alert(uncovered.length?'Settimana generata. Attenzione: non è stato possibile coprire completamente: '+uncovered.slice(0,8).join(', ')+(uncovered.length>8?' …':''):'Settimana generata correttamente: ore contrattuali, pause, riposi e copertura apertura/chiusura rispettati.');
}

function approveAllWeeksByOwner(week){if(user.ruolo!==3||!shiftStores().every(s=>weekStoreStatus(week,s)==='inviato_titolare'))return;if(!confirm('Approvare tutte le settimane dei negozi per '+weekLabel(week)+'?'))return;for(const s of shiftStores())weekStoreState(week,s).status='approvata_titolare';db.notifications=db.notifications||[];for(const e of db.employees.filter(x=>x.ruolo===2))db.notifications.push({id:Date.now()+Math.random(),emp:e.id,date:new Date().toISOString(),read:false,text:'Turni '+weekLabel(week)+' approvati dal Titolare. Ora puoi stamparli.'});audit('Turni','Approvazione Titolare '+week);save();render()}
function printShiftWeek(week){if(user.ruolo<2)return;const store=user.ruolo===2?user.negozio:null;if(user.ruolo===2&&weekStoreStatus(week,store)!=='approvata_titolare'){alert('Il Titolare deve prima approvare i turni del tuo negozio.');return}if(user.ruolo===3&&!allStoresOwnerApproved(week)){alert('Prima devono essere approvate tutte le settimane dei negozi.');return}const dates=shiftWeekDates(week),list=db.shifts.filter(s=>dates.includes(s.date)&&(!store||s.store===store));const emps=[...new Map(list.map(s=>[String(s.emp),s.emp])).values()].map(id=>db.employees.find(e=>String(e.id)===String(id))).filter(Boolean);const rows=emps.map(e=>'<tr><td><b>'+esc(e.cognome+' '+e.nome)+'</b></td>'+dates.map(d=>'<td>'+list.filter(s=>String(s.emp)===String(e.id)&&s.date===d).map(s=>esc((s.type==='Turno'?(s.in||'')+'–'+(s.out||''):s.type)+(s.note?' · '+s.note:''))).join('<br>')+'</td>').join('')+'</tr>').join('');const head=dates.map(d=>{const x=new Date(d+'T12:00:00');return '<th>'+['Dom','Lun','Mar','Mer','Gio','Ven','Sab'][x.getDay()]+'<br>'+d.slice(8,10)+'/'+d.slice(5,7)+'</th>'}).join('');const html='<!doctype html><html><head><meta charset="utf-8"><title>Turni '+weekLabel(week)+'</title><style>body{font-family:Arial;margin:24px;color:#111}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #bbb;padding:7px;text-align:center;vertical-align:top}th:first-child,td:first-child{text-align:left;min-width:170px}th{background:#eee}</style></head><body><h1>B+ Gestionale HR — Turni</h1><p>Settimana '+weekLabel(week)+(store?' · Negozio '+esc(store):'')+' · Approvata dal Titolare</p><table><tr><th>Lavoratore</th>'+head+'</tr>'+(rows||'<tr><td colspan="8">Nessun turno</td></tr>')+'</table></body></html>';const w=window.open('','_blank');if(!w){alert('Consenti i popup per la stampa.');return}w.document.write(html);w.document.close();setTimeout(()=>w.print(),250);audit('Turni','Stampa settimana '+week+(store?' · '+store:''));save()}
function shiftModal(id){let x=id?db.shifts.find(s=>String(s.id)===String(id)):{id:Date.now(),emp:'',date:todayDate(),store:user.negozio||'GAG',in:'08:30',out:'17:30',type:'Turno',note:''};if(user.ruolo===2&&(x.store!==user.negozio))return;window._shift=x;openModal(id?'Modifica turno':'Nuovo turno','<div class="form"><label>Lavoratore<select id="shEmp">'+db.employees.filter(e=>user.ruolo===3||e.negozio===user.negozio).map(e=>'<option value="'+e.id+'" '+(String(x.emp)===String(e.id)?'selected':'')+'>'+esc(e.nome+' '+e.cognome)+'</option>').join('')+'</select></label><label>Data<input id="shDate" type="date" value="'+x.date+'"></label><label>Punto vendita<select id="shStore">'+STORES.filter(st=>user.ruolo===3||st[0]===user.negozio).map(st=>'<option value="'+st[0]+'" '+(x.store===st[0]?'selected':'')+'>'+st[1]+'</option>').join('')+'</select></label><label>Entrata<input id="shIn" type="time" value="'+(x.in||'')+'"></label><label>Pausa dalle<input id="shBreakStart" type="time" value="'+(x.breakStart||'')+'"></label><label>Pausa alle<input id="shBreakEnd" type="time" value="'+(x.breakEnd||'')+'"></label><label>Uscita<input id="shOut" type="time" value="'+(x.out||'')+'"></label><label>Tipo<select id="shType">'+['Turno','Riposo','Ferie','Corso'].map(t=>'<option '+(x.type===t?'selected':'')+'>'+t+'</option>').join('')+'</select></label><label style="grid-column:1/-1">Note<textarea id="shNote">'+esc(x.note||'')+'</textarea></label></div><div class="actions section"><button class="btn green" onclick="saveShift()">Salva turno</button></div>')}
function saveShift(){let x=window._shift;if(user.ruolo===2&&x.store!==user.negozio)return;x.emp=shEmp.value;x.date=shDate.value;x.store=shStore.value;x.in=shIn.value;x.breakStart=shBreakStart.value;x.breakEnd=shBreakEnd.value;x.out=shOut.value;x.type=shType.value;x.note=shNote.value;let i=db.shifts.findIndex(s=>String(s.id)===String(x.id));if(i<0)db.shifts.push(x);else db.shifts[i]=x;const w=shiftWeekKey(x.date),st=weekStoreState(w,x.store);if(user.ruolo===2)st.status='inviato_direttore';else st.status='bozza';audit('Turno','Modificato '+x.date+' · '+x.store+' · '+empName(x.emp));save();closeModal();render()}
function isoWeekNumber(date){
  const d=new Date(date+'T12:00:00');
  const day=d.getDay()||7;
  d.setDate(d.getDate()+4-day);
  const y=d.getFullYear();
  const start=new Date(y,0,1);
  return Math.ceil((((d-start)/86400000)+1)/7);
}
function weekWorkedHours(emp,week,store){
  const ds=shiftWeekDates(week);
  return Math.round(db.shifts.filter(s=>String(s.emp)===String(emp.id)&&s.store===store&&ds.includes(s.date)&&s.type==='Turno').reduce((n,s)=>n+shiftHoursValue(s),0)*100)/100;
}
function recoveryBalanceBeforeWeek(emp,week){
  const e=typeof emp==='object'?emp:db.employees.find(x=>String(x.id)===String(emp));
  if(!e)return 0;
  const first=shiftWeekDates(week)[0];
  const weeks=new Set(db.shifts.filter(s=>String(s.emp)===String(e.id)&&s.date<first).map(s=>shiftWeekKey(s.date)));
  let total=Number(e.oreRecuperoBase)||0;
  for(const w of weeks){
    const ds=shiftWeekDates(w);
    const worked=db.shifts.filter(s=>String(s.emp)===String(e.id)&&ds.includes(s.date)&&s.type==='Turno').reduce((n,s)=>n+shiftHoursValue(s),0);
    const hasActivity=worked>0||db.absences.some(a=>String(a.emp)===String(e.id)&&a.stato==='approvato'&&a.da<=ds[6]&&a.a>=ds[0]);
    if(hasActivity)total+=(Number(e.ore)||40)-worked;
  }
  return Math.round(total*100)/100;
}
function shiftVisualCell(shift){
  if(!shift)return '';
  if(shift.type&&shift.type!=='Turno'){
    const label=shift.type==='Ferie'?'FER':shift.type==='Corso'?'CORSO':shift.type==='Riposo'?'RIP':shift.type;
    return '<div class="sp-special">'+esc(label)+'</div>';
  }
  const a=shift.in||'',b=shift.breakStart||'',c=shift.breakEnd||'',d=shift.out||'';
  return '<div class="sp-times"><span>'+esc(a)+'</span><span>'+esc(b)+'</span><span>'+esc(c)+'</span><span>'+esc(d)+'</span></div>';
}
function shifts(){
  const selected=document.getElementById('shiftWeek')?.value||shiftWeekKey(todayDate());
  const stores=user.ruolo===2?[user.negozio]:shiftStores();
  const dates=shiftWeekDates(selected);
  const weekNo=isoWeekNumber(selected);
  let controls='<div class="actions"><label class="muted">Settimana<input id="shiftWeek" type="date" value="'+selected+'" onchange="render()" style="margin-left:6px;background:#292d33;color:#fff;border:1px solid #454a52;border-radius:8px;padding:10px"></label>';
  if(user.ruolo===3){
    controls+='<button class="btn" onclick="generateWeekModal()">⚙ Genera settimana</button><button class="btn danger" onclick="resetWeek(&quot;'+selected+'&quot;)">↺ Reset settimana</button><button class="btn" onclick="sendWeekToDirectors(&quot;'+selected+'&quot;)">📨 Invia ai Direttori</button>';
    if(allStoresDirectorApproved(selected))controls+='<button class="btn" onclick="sendWeeksToOwner(&quot;'+selected+'&quot;)">📨 Invia tutte al Titolare</button>';
    if(shiftStores().every(s=>weekStoreStatus(selected,s)==='inviato_titolare'))controls+='<button class="btn green" onclick="approveAllWeeksByOwner(&quot;'+selected+'&quot;)">✓ Approva tutte le settimane</button>';
  }else if(user.ruolo===2){
    const st=weekStoreStatus(selected,user.negozio);
    if(st==='inviato_direttore')controls+='<button class="btn green" onclick="approveStoreWeek(&quot;'+selected+'&quot;,&quot;'+user.negozio+'&quot;)">✓ Approva settimana del negozio</button>';
    if(st==='approvata_titolare')controls+='<button class="btn secondary" onclick="printShiftWeek(&quot;'+selected+'&quot;)">🖨 Stampa turni</button>';
    if(st==='inviato_direttore')controls+='<button class="btn" onclick="shiftModal()">+ Modifica turno</button>';
  }
  controls+='</div><div class="card section"><b>Settimana '+weekLabel(selected)+'</b><div class="muted">'+(user.ruolo===3?'Genera → invia ai Direttori → controllo/modifica negozio → approvazione Direttore → invio al Titolare → approvazione Titolare':'Controlla/modifica il tuo negozio → approva → attende approvazione Titolare')+'</div></div>';

  const blocks=stores.map(store=>{
    const storeObj=db.stores.find(s=>s.id===store);
    const storeName=storeObj?.name||store;
    const workers=db.employees.filter(e=>e.stato==='attivo'&&e.inTurni!==false&&(e.negozio===store||(Array.isArray(e.mobilita)&&e.mobilita.includes(store))||db.shifts.some(s=>s.store===store&&String(s.emp)===String(e.id)&&dates.includes(s.date)))).sort((a,b)=>(a.cognome+' '+a.nome).localeCompare(b.cognome+' '+b.nome,'it'));
    const rows=workers.map(e=>{
      const prev=recoveryBalanceBeforeWeek(e,selected);
      const hours=weekWorkedHours(e,selected,store);
      const contract=Number(e.ore)||40;
      const saldo=Math.round((prev+hours-contract)*100)/100;
      const dayCells=dates.map(date=>{
        const h=storeDay(store,date);
        const shiftsForDay=db.shifts.filter(s=>String(s.emp)===String(e.id)&&s.store===store&&s.date===date);
        const sh=shiftsForDay.find(s=>s.type==='Turno')||shiftsForDay[0];
        const closed=!h||h.closed;
        const cellClass=closed?'sp-day sp-closed':'sp-day';
        const inner=sh?shiftVisualCell(sh):'';
        const clickable=sh&&sh.id!=null?' onclick="shiftModal(&quot;'+sh.id+'&quot;)" title="Apri turno"':'';
        return '<td class="'+cellClass+'"'+clickable+'>'+inner+'</td>';
      }).join('');
      return '<tr><td class="sp-contract">'+contract.toFixed(0)+'</td><td class="sp-note"><b>'+esc(e.nome+' '+e.cognome)+'</b>'+(e.note?'<div class="sp-note-sub">'+esc(e.note)+'</div>':'')+'</td><td class="sp-prev">'+(prev>0?'+':'')+String(prev).replace('.',',')+'</td><td class="sp-hours">'+hours.toFixed(2).replace('.',',')+'</td><td class="sp-balance '+(saldo<0?'neg':saldo>0?'pos':'')+'">'+(saldo>0?'+':'')+String(saldo).replace('.',',')+'</td>'+dayCells+'</tr>';
    }).join('');
    const head=dates.map(date=>{
      const x=new Date(date+'T12:00:00');
      const wd=DAYS[x.getDay()===0?6:x.getDay()-1];
      return '<th class="sp-date"><b>'+wd.toLowerCase()+'</b><span>'+date.slice(8,10)+'/'+date.slice(5,7)+'</span><small>PV</small></th>';
    }).join('');
    return '<div class="shift-plan section"><div class="sp-title">'+esc(storeName.toUpperCase())+' <span>SETTIMANA N.'+weekNo+'</span></div><div class="tablewrap"><table class="sp-table"><thead><tr><th class="sp-h1">ORE SETTIMANALI A CONTRATTO</th><th class="sp-h2">NOTE</th><th class="sp-h3">SALDO SETT.PREC</th><th class="sp-h4">ORE SETT.</th><th class="sp-h5">SALDO</th>'+head+'</tr></thead><tbody>'+(rows||'<tr><td colspan="'+(6+dates.length)+'" class="sp-empty">Nessun lavoratore/turno per questo punto vendita.</td></tr>')+'</tbody></table></div></div>';
  }).join('');
  return controls+blocks;
}
function board(){const now=todayDate();let list=db.board.filter(b=>(!b.exp||b.exp>=now)&&(b.target==='all'||b.target===user.negozio||b.target==='u:'+user.id||user.ruolo>=2));return '<div class="actions">'+(user.ruolo>=2?'<button class="btn" onclick="boardModal()">+ Nuova comunicazione</button>':'')+'</div>'+list.map(b=>'<div class="card section"><h3>'+esc(b.title)+'</h3><div style="white-space:pre-wrap">'+esc(b.body)+'</div><div class="muted section">'+new Date(b.at).toLocaleString('it-IT')+(b.exp?' · fino al '+b.exp:'')+'</div></div>').join('')||'<div class="card section">Nessuna comunicazione.</div>'}
function auditPage(){if(user.ruolo!==3)return '<div class="card">Accesso non disponibile.</div>';return '<div class="card"><h3>Audit log</h3><div class="tablewrap"><table class="table"><tr><th>Data</th><th>Utente</th><th>Azione</th><th>Dettaglio</th></tr>'+db.audit.map(a=>'<tr><td>'+new Date(a.at).toLocaleString('it-IT')+'</td><td>'+esc(a.name)+'</td><td>'+esc(a.action)+'</td><td>'+esc(a.detail)+'</td></tr>').join('')+'</table></div></div>'}
function exportCsv(kind){let rows=[];if(kind==='presenze'){rows=[['Data','Lavoratore','Negozio','Entrata','Uscita','Pausa','Ore'],...db.attendance.map(a=>[a.date,empName(a.emp),a.store,a.in,a.out,a.breakMin,workedHours(a)])]}else if(kind==='assenze'){rows=[['Lavoratore','Tipo','Dal','Al','Stato','Note'],...db.absences.map(a=>[empName(a.emp),a.tipo,a.da,a.a,a.stato,a.note||''])]}else{rows=[['Lavoratore','Corso','Categoria','Data','Scadenza','Stato'],...db.courses.map(c=>[empName(c.emp),c.titolo,c.categoria,c.data,c.scadenza,courseState(c)])]}const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='bplus-'+kind+'-'+todayDate()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),500);audit('Export','CSV '+kind);save()}
function printReport(){const old=document.body.innerHTML;const rows=db.attendance.map(a=>'<tr><td>'+a.date+'</td><td>'+empName(a.emp)+'</td><td>'+a.in+'</td><td>'+a.out+'</td><td>'+workedHours(a)+'</td></tr>').join('');document.body.innerHTML='<div style="font-family:Arial;padding:30px;color:#111"><h1>B+ Gestionale HR</h1><h2>Report presenze</h2><table border="1" cellpadding="6" cellspacing="0"><tr><th>Data</th><th>Lavoratore</th><th>Entrata</th><th>Uscita</th><th>Ore</th></tr>'+rows+'</table></div>';window.print();location.reload()}
function reports(){return '<div class="grid"><div class="card"><b>Presenze</b><div class="stat">'+db.attendance.length+'</div></div><div class="card"><b>Assenze</b><div class="stat">'+db.absences.length+'</div></div><div class="card"><b>Formazione</b><div class="stat">'+db.courses.length+'</div></div><div class="card"><b>Turni</b><div class="stat">'+db.shifts.length+'</div></div></div><div class="section card"><h3>Esportazioni</h3><div class="actions"><button class="btn" onclick="exportCsv(\'presenze\')">Presenze CSV / Excel</button><button class="btn secondary" onclick="exportCsv(\'assenze\')">Assenze CSV / Excel</button><button class="btn secondary" onclick="exportCsv(\'corsi\')">Corsi CSV / Excel</button><button class="btn green" onclick="printReport()">Stampa / PDF</button></div></div>'}
function backupPage(){if(user.ruolo!==3)return '<div class="card">Accesso non disponibile.</div>';return '<div class="card"><h3>Backup e sincronizzazione</h3><p>Il gestionale salva i dati sul dispositivo. Puoi creare un backup completo e ripristinarlo su un altro dispositivo.</p><div class="actions"><button class="btn" onclick="downloadBackup()">Scarica backup</button><label class="btn secondary" style="display:inline-flex;align-items:center;cursor:pointer">Ripristina backup<input type="file" accept=".json,application/json" style="display:none" onchange="restoreBackup(this.files[0])"></label></div><p class="muted section">Il backup comprende turni, ferie/permessi, corsi, bacheca, calendario, notifiche e configurazione.</p></div>'}
function downloadBackup(){const payload={version:4,exportedAt:new Date().toISOString(),db};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='bplus-backup-'+todayDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500);audit('Backup','Esportazione completa');save()}
function restoreBackup(file){if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!x.db||!x.version)throw Error();if(!confirm('Il ripristino sostituirà i dati presenti su questo dispositivo. Continuare?'))return;db=x.db;for(const k of Object.keys(defaults))if(!db[k])db[k]=defaults[k];audit('Backup','Ripristino completo');save();render();alert('Backup ripristinato.')}catch(e){alert('Backup non valido.')}};rd.readAsText(file)}
function render(){let h=page==='dashboard'?dashboard():page==='employees'?employees():page==='shifts'?shifts():page==='history'?history():page==='calendar'?calendar():page==='absences'?absences():page==='stores'?stores():page==='courses'?courses():page==='board'?board():page==='reports'?reports():page==='notifications'?notifications():page==='audit'?auditPage():page==='backup'?backupPage():profile();view.innerHTML=h}buildNav();render();
</script></body></html>
