<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c62828"><title>B+ – Cambia password</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;align-items:center;justify-content:center;padding:22px}.card{width:min(390px,100%);background:#1e1e1e;border:1px solid #2a2a2a;border-radius:16px;padding:24px}h1{font-size:21px;margin:0 0 8px}p{color:#999;font-size:13px;line-height:1.5;margin:0 0 20px}label{display:block;color:#999;font-size:11px;font-weight:700;text-transform:uppercase;margin:14px 0 6px}input{width:100%;padding:13px;background:#292929;border:1px solid #3a3a3a;border-radius:10px;color:#fff;font-size:16px}button{width:100%;margin-top:20px;min-height:48px;border:0;border-radius:10px;background:#c62828;color:#fff;font-weight:700;font-size:16px}.bar{height:6px;background:#333;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;width:0;background:#c62828}.msg{display:none;margin-top:12px;padding:10px;border-radius:8px;background:#2a0000;color:#ef9a9a;font-size:13px}.ok{background:#17351b;color:#8ce99a}</style></head><body><main class="card"><h1>Imposta la tua password</h1><p>Per motivi di sicurezza, la password provvisoria <b>1234</b> deve essere sostituita al primo accesso.</p><label>Nuova password</label><input id="p1" type="password" autocomplete="new-password" oninput="strength()"><div class="bar"><div class="fill" id="fill"></div></div><label>Conferma password</label><input id="p2" type="password" autocomplete="new-password"><button onclick="save()">Salva e accedi</button><div class="msg" id="msg"></div></main><script>const P='bplus_passwords_v1',force=sessionStorage.getItem('bplus_force_password')==='1';if(!sessionStorage.getItem('bplus_uid')||!force)location.replace('./index.html');function strength(){const v=p1.value,n=(v.length>=8)+(v.length>=12)+(/[A-Z]/.test(v))+(/[0-9]/.test(v))+( /[^A-Za-z0-9]/.test(v));fill.style.width=Math.min(100,n*20)+'%'}function save(){msg.className='msg';msg.style.display='block';const a=p1.value,b=p2.value;if(a.length<8){msg.textContent='La password deve contenere almeno 8 caratteri.';return}if(!/[A-Z]/.test(a)||!/[0-9]/.test(a)){msg.textContent='Usa almeno una maiuscola e un numero.';return}if(a==='1234'){msg.textContent='Scegli una password diversa da quella provvisoria.';return}if(a!==b){msg.textContent='Le password non coincidono.';return}let all={};try{all=JSON.parse(localStorage.getItem(P)||'{}')}catch(e){}all[String(sessionStorage.getItem('bplus_uid'))]=a;localStorage.setItem(P,JSON.stringify(all));sessionStorage.removeItem('bplus_force_password');msg.className='msg ok';msg.textContent='Password aggiornata. Accesso in corso…';setTimeout(()=>location.replace('./app.html'),500)}</script></body></html>
