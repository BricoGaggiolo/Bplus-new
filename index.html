<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c62828"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>B+ Gestionale HR – Accesso</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:20px;min-height:100vh}.card{width:min(390px,100%)}
.logo{text-align:center;margin-bottom:24px}.logo h1{color:#fff;font-size:22px;margin:0;font-weight:800}.logo p{color:#777;font-size:13px;margin:5px 0 0}
.form{background:#1e1e1e;border:1px solid #2b2b2b;border-radius:16px;padding:22px}
label{display:block;color:#999;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:0 0 6px}
input{width:100%;padding:14px;background:#292929;border:1px solid #3b3b3b;border-radius:10px;color:#fff;font-size:16px;outline:0;margin:0 0 16px}
input:focus{border-color:#c62828}.btn{width:100%;min-height:50px;border:0;border-radius:10px;background:#c62828;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6}.err{display:none;color:#ef9a9a;background:#300909;border-radius:8px;padding:10px;margin-top:12px;font-size:13px;text-align:center}
.hint{color:#777;font-size:12px;text-align:center;line-height:1.45;margin-top:12px}.footer{text-align:center;color:#444;font-size:11px;margin-top:18px}
</style></head><body>
<div class="card"><div class="logo"><h1>B+ Gestionale HR</h1><p>La Quattro S.r.l.</p></div>
<div class="form"><label for="em">Email</label><input id="em" type="email" autocomplete="username" inputmode="email" placeholder="Email">
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="Password">
<button id="loginBtn" class="btn" onclick="login()">Accedi</button><div id="err" class="err"></div>
<div class="hint">Primo accesso: password provvisoria <b>1234</b>, da sostituire.</div></div>
<div class="footer">B+ Gestionale · La Quattro S.r.l.</div></div>
<script>
const DEMO={id:2,email:'d.piaia@laquattrosrl.it',password:'1234',nome:'Davide',cognome:'Piaia',ruolo:3,negozio:'GAG'};
const DB_KEYS=['bplus_new_v2','bplus_new_v4'];const PWDKEY='bplus_passwords_v1';
function read(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function employees(){const all=[];for(const k of DB_KEYS){const x=read(k);if(Array.isArray(x?.employees))all.push(...x.employees)}return all}
function passwords(){return read(PWDKEY)||{}}
function findUser(email){return employees().find(x=>(x.email||'').trim().toLowerCase()===email)||((email===DEMO.email)?DEMO:null)}
function setSession(u){sessionStorage.setItem('bplus_uid',String(u.id));sessionStorage.setItem('bplus_user',JSON.stringify(u));sessionStorage.setItem('bplus_login_at',String(Date.now()))}
function go(u){setSession(u);location.replace('./app.html')}
function show(t){err.textContent=t;err.style.display='block'}
async function login(){
 const e=em.value.trim().toLowerCase(),p=pw.value;err.style.display='none';
 if(!e||!p){show('Inserisci email e password');return}
 loginBtn.disabled=true;
 const u=findUser(e),ps=passwords(),localPass=u?(ps[String(u.id)]??u.password??'1234'):null;
 if(u&&p===localPass){if(localPass==='1234'){setSession(u);sessionStorage.setItem('bplus_force_password','1');location.replace('./change-password-v2.html');return}go(u);return}
 loginBtn.disabled=false;
 show(u?'Password non corretta':'Email o password non valide');
}
pw.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script></body></html>
