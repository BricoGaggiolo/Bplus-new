<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>B+ Gestionale – Accesso</title><meta name="theme-color" content="#c62828"><style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:#111;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}body{display:flex;align-items:center;justify-content:center;padding:24px;min-height:100vh}.card{width:100%;max-width:360px}.logo{text-align:center;margin-bottom:28px}.logo h1{color:#fff;font-size:20px;font-weight:800}.logo p{color:#777;font-size:13px;margin-top:4px}.form{background:#1e1e1e;border-radius:16px;padding:24px;border:1px solid #2a2a2a}label{display:block;font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}input{width:100%;padding:13px 14px;background:#2a2a2a;border:1.5px solid #333;border-radius:10px;color:#fff;font-size:16px;outline:none;margin-bottom:16px}input:focus{border-color:#c62828}.btn{width:100%;padding:14px;background:#c62828;color:#fff;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;touch-action:manipulation}.err{color:#ef9a9a;font-size:13px;text-align:center;margin-top:12px;display:none;background:#2a0000;padding:10px;border-radius:8px}.footer{text-align:center;color:#444;font-size:11px;margin-top:20px}</style></head><body><div class="card"><div class="logo"><h1>B+ Gestionale HR</h1><p>La Quattro S.r.l.</p></div><div class="form"><label>Email</label><input id="em" type="email" autocomplete="username" placeholder="d.piaia@laquattrosrl.it"><label>Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"><button class="btn" onclick="login()">Accedi</button><div class="err" id="err"></div></div><div class="footer">B+ Gestionale · La Quattro S.r.l.</div></div><script>const U={id:2,email:'d.piaia@laquattrosrl.it',password:'LaQuattro2',nome:'Davide',cognome:'Piaia',ruolo:3};function login(){const e=em.value.trim().toLowerCase(),p=pw.value.trim();err.style.display='none';if(e!==U.email||p!==U.password){err.textContent=e!==U.email?'Email non autorizzata':'Password non corretta';err.style.display='block';return}sessionStorage.setItem('bplus_uid',U.id);sessionStorage.setItem('bplus_user',JSON.stringify(U));location.href='./app.html'}pw.addEventListener('keydown',e=>{if(e.key==='Enter')login()});</script></body></html>
