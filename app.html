<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>B+ Gestionale</title><style>:root{--bg:#111;--panel:#1b1b1b;--panel2:#232323;--line:#303030;--txt:#f5f5f5;--muted:#999;--red:#c62828;--green:#43a047;--blue:#1e88e5;--orange:#fb8c00}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}.app{min-height:100vh;display:flex}.side{width:250px;background:#171717;border-right:1px solid var(--line);padding:18px;position:fixed;inset:0 auto 0 0;z-index:20;overflow:auto}.brand{font-size:24px;font-weight:900;margin:4px 8px 22px}.brand span{color:var(--red)}.user{padding:12px;background:var(--panel2);border-radius:12px;margin-bottom:16px}.user b{display:block}.user small{color:var(--muted)}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#ccc;text-align:left;padding:12px;border-radius:9px}.nav button.active,.nav button:hover{background:#2a2a2a;color:#fff}.main{margin-left:250px;width:calc(100% - 250px);padding:24px 24px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.top h1{font-size:24px;margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--red);color:white;font-weight:700}.btn.secondary{background:#333}.btn.green{background:var(--green)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.stat{font-size:28px;font-weight:900;margin-top:6px}.muted{color:var(--muted);font-size:13px}.section{margin-top:18px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{color:#aaa;font-size:12px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#333;font-size:12px}.pill.ok{background:#17351b;color:#8ce99a}.pill.warn{background:#3a2a12;color:#ffc46b}.pill.bad{background:#3a1717;color:#ff9a9a}.week{display:grid;grid-template-columns:180px repeat(7,minmax(120px,1fr));overflow:auto}.week>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;min-height:70px}.shift{background:#292929;border-radius:8px;padding:7px;font-size:12px}.bottom{display:none}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}.modal.open{display:flex}.dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:#1d1d1d;border:1px solid #333;border-radius:16px;padding:18px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.formgrid label{font-size:12px;color:#aaa;display:grid;gap:5px}.formgrid input,.formgrid select,.formgrid textarea{background:#292929;color:#fff;border:1px solid #444;border-radius:8px;padding:10px}.formgrid textarea{min-height:90px}.toast{position:fixed;right:18px;bottom:18px;background:#222;border:1px solid #444;padding:12px 16px;border-radius:10px;display:none;z-index:80}.empty{padding:30px;text-align:center;color:#888}@media(max-width:800px){.side{transform:translateX(-100%);transition:.2s;width:280px}.side.open{transform:none}.main{margin:0;width:100%;padding:16px 14px 92px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top h1{font-size:20px}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#171717;border-top:1px solid #333;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}.bottom button{border:0;background:transparent;color:#aaa;padding:7px 2px;font-size:11px}.bottom button.active{color:#fff}.bottom span{display:block;font-size:19px;margin-bottom:2px}.formgrid{grid-template-columns:1fr}.week{grid-template-columns:130px repeat(7,120px)}}@media(max-width:460px){.grid{grid-template-columns:1fr}.actions .btn{flex:1}.top{align-items:flex-start}.card{padding:13px}}</style></head><body><div class="app"><aside class="side" id="side"><div class="brand">B<span>+</span> Gestionale</div><div class="user" id="userbox"></div><nav class="nav" id="nav"></nav></aside><main class="main"><header class="top"><div><h1 id="title">Dashboard</h1><div class="muted" id="subtitle">Panoramica operativa</div></div><div class="actions"><button class="btn secondary" onclick="toggleSide()">☰</button><button class="btn" onclick="logout()">Esci</button></div></header><section id="content"></section></main><nav class="bottom" id="bottom"></nav></div><div class="modal" id="modal"><div class="dialog"><div class="top"><h2 id="mtitle"></h2><button class="btn secondary" onclick="closeModal()">Chiudi</button></div><div id="mbody"></div></div></div><div class="toast" id="toast"></div><script>
if(!sessionStorage.getItem('bplus_uid'))location.replace('./index.html');
const KEY='bplus_new_v1',NOT='bplus_notifiche_v1',HIST='bplus_storico_settimane_v1';
const user=JSON.parse(sessionStorage.getItem('bplus_user')||'{"nome":"Davide","cognome":"Piaia","ruolo":3}');
const stores=[{id:'GAG',nome:'Brico+ Gaggiolo',addr:'Gaggiolo',minGiorno:[3,3,3,3,3,4,2],minPausa:[2,2,2,2,2,2,1]},{id:'COC',nome:'Brico+ Cocquio',addr:'Cocquio',minGiorno:[2,2,2,2,2,3,2],minPausa:[1,1,1,1,1,2,1]},{id:'DAV',nome:'Brico+ Daverio',addr:'Daverio',minGiorno:[2,2,2,2,2,3,2],minPausa:[1,1,1,1,1,2,1]},{id:'VAR',nome:'Brico+ Varese',addr:'Varese',minGiorno:[2,2,2,2,2,3,2],minPausa:[1,1,1,1,1,2,1]}];
const seed={employees:[{id:2,nome:'Davide',cognome:'Piaia',email:'d.piaia@laquattrosrl.it',ruolo:3,negozio:'GAG',contratto:'indeterminato',oreSett:40,stato:'attivo',capGenerali:5,cap:{tintometro:true,chiavi:true,muletto:true,cassa:true,taglioLegno:true,kasanova:true},mobilita:['GAG','COC','DAV','VAR']},{id:3,nome:'Marco',cognome:'Ferrari',email:'',ruolo:2,negozio:'GAG',contratto:'indeterminato',oreSett:40,stato:'attivo',capGenerali:4,cap:{},mobilita:['GAG']},{id:4,nome:'Laura',cognome:'Bianchi',email:'',ruolo:1,negozio:'VAR',contratto:'indeterminato',oreSett:30,stato:'attivo',capGenerali:3,cap:{cassa:true},mobilita:['VAR']}],shifts:[],absences:[],courses:[],notifications:[],assignments:{},history:[]};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;function save(){localStorage.setItem(KEY,JSON.stringify(db))}function uid(){return Date.now()+Math.random()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(x){const t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
const pages={dashboard:'Dashboard',employees:'Dipendenti',shifts:'Turni',history:'Storico turni',absences:'Assenze & Ferie',courses:'Corsi',stores:'Punti vendita',reports:'Report',notifications:'Notifiche'};let page='dashboard';
function allowed(p){return user.ruolo===3||(['dashboard','shifts','history','absences','notifications'].includes(p)&&user.ruolo===2)}
function renderNav(){const items=Object.entries(pages).filter(([p])=>allowed(p));document.getElementById('nav').innerHTML=items.map(([p,n])=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${icon(p)} ${n}</button>`).join('');document.getElementById('bottom').innerHTML=[['dashboard','⌂'],['shifts','▦'],['absences','▤'],['notifications','●'],['menu','☰']].map(([p,i])=>`<button class="${p===page?'active':''}" onclick="${p==='menu'?'toggleSide()':`go('${p}')`}"><span>${i}</span>${p==='menu'?'Altro':pages[p]}</button>`).join('');}
function icon(p){return ({dashboard:'⌂',employees:'👥',shifts:'▦',history:'◷',absences:'▤',courses:'🎓',stores:'⌂',reports:'▤',notifications:'🔔'})[p]||'•'}function go(p){if(!allowed(p))return;page=p;document.getElementById('side').classList.remove('open');document.getElementById('title').textContent=pages[p];renderNav();render() }function toggleSide(){document.getElementById('side').classList.toggle('open')}function logout(){sessionStorage.clear();location.href='./index.html'}
function render(){const c=document.getElementById('content');if(page==='dashboard')c.innerHTML=dashboard();if(page==='employees')c.innerHTML=employees();if(page==='shifts')c.innerHTML=shifts();if(page==='history')c.innerHTML=history();if(page==='absences')c.innerHTML=absences();if(page==='courses')c.innerHTML=courses();if(page==='stores')c.innerHTML=storesView();if(page==='reports')c.innerHTML=reports();if(page==='notifications')c.innerHTML=notifications()}
function dashboard(){const today=new Date().toISOString().slice(0,10),active=db.employees.filter(e=>e.stato==='attivo').length,abs=db.absences.filter(a=>a.da<=today&&a.a>=today&&a.stato==='approvato').length,sh=db.shifts.filter(s=>s.date===today).length;return `<div class="grid"><div class="card"><div class="muted">Dipendenti attivi</div><div class="stat">${active}</div></div><div class="card"><div class="muted">Turni oggi</div><div class="stat">${sh}</div></div><div class="card"><div class="muted">Assenti oggi</div><div class="stat">${abs}</div></div><div class="card"><div class="muted">Negozi</div><div class="stat">${stores.length}</div></div></div><div class="section grid">${stores.map(s=>`<div class="card"><b>${s.nome}</b><div class="muted">${s.addr}</div><div style="margin-top:10px">Copertura: <b>${db.shifts.filter(x=>x.date===today&&x.store===s.id).length}</b></div></div>`).join('')}</div><div class="section card"><h3>Alert operativi</h3><p class="muted" style="margin-top:8px">${db.notifications.length?'Hai notifiche da verificare.':'Nessun alert.'}</p></div>`}
function employees(){return `<div class="actions"><button class="btn" onclick="employeeModal()">+ Nuovo dipendente</button></div><div class="section tablewrap"><table class="table"><thead><tr><th>Nome</th><th>Email</th><th>Ruolo</th><th>Negozio</th><th>Contratto</th><th>Stato</th><th></th></tr></thead><tbody>${db.employees.map(e=>`<tr><td><b>${esc(e.nome+' '+e.cognome)}</b></td><td>${esc(e.email)}</td><td>${['','Lavoratore','Direttore','Titolare'][e.ruolo]}</td><td>${e.negozio}</td><td>${e.contratto}</td><td><span class="pill ok">${e.stato}</span></td><td><button class="btn secondary" onclick="employeeModal(${e.id})">Modifica</button></td></tr>`).join('')}</tbody></table></div>`}
function employeeModal(id){const e=db.employees.find(x=>x.id==id)||{nome:'',cognome:'',email:'',ruolo:1,negozio:'GAG',contratto:'indeterminato',oreSett:40,stato:'attivo'};openModal(id?'Modifica dipendente':'Nuovo dipendente',`<div class="formgrid"><label>Nome<input id="f_nome" value="${esc(e.nome)}"></label><label>Cognome<input id="f_cognome" value="${esc(e.cognome)}"></label><label>Email<input id="f_email" value="${esc(e.email)}"></label><label>Ruolo<select id="f_ruolo"><option value="1">Lavoratore</option><option value="2">Direttore</option><option value="3">Titolare</option></select></label><label>Negozio<select id="f_negozio">${stores.map(s=>`<option ${e.negozio===s.id?'selected':''}>${s.id}</option>`).join('')}</select></label><label>Contratto<select id="f_contratto"><option>indeterminato</option><option>a termine</option><option>a chiamata</option></select></label><label>Ore settimanali<input id="f_ore" type="number" value="${e.oreSett||40}"></label><label>Stato<select id="f_stato"><option>attivo</option><option>assente</option><option>ferie</option><option>malattia</option></select></label></div><div class="actions" style="margin-top:14px"><button class="btn" onclick="saveEmployee(${id||0})">Salva</button></div>`);f_ruolo.value=e.ruolo;f_contratto.value=e.contratto;f_stato.value=e.stato}
function saveEmployee(id){const obj={id:id||uid(),nome:f_nome.value.trim(),cognome:f_cognome.value.trim(),email:f_email.value.trim(),ruolo:+f_ruolo.value,negozio:f_negozio.value,contratto:f_contratto.value,oreSett:+f_ore.value,stato:f_stato.value,capGenerali:3,cap:{},mobilita:[f_negozio.value]};if(!obj.nome||!obj.cognome)return toast('Nome e cognome obbligatori');const i=db.employees.findIndex(e=>e.id==id);if(i>=0)db.employees[i]=obj;else db.employees.push(obj);save();closeModal();render();toast('Dipendente salvato')}
function shifts(){const monday=new Date();monday.setDate(monday.getDate()-((monday.getDay()+6)%7));const ds=[...Array(7)].map((_,i)=>{const d=new Date(monday);d.setDate(d.getDate()+i);return d.toISOString().slice(0,10)});return `<div class="actions"><button class="btn" onclick="generateWeek()">⚙ Auto-genera settimana</button><button class="btn green" onclick="publishWeek()">Pubblica settimana</button></div><div class="section card"><div class="week"><div><b>Dipendente</b></div>${ds.map(d=>`<div><b>${new Date(d).toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit'})}</b></div>`).join('')}${db.employees.filter(e=>e.stato==='attivo').map(e=>`<div><b>${esc(e.nome+' '+e.cognome)}</b><small class="muted"> ${e.negozio}</small></div>${ds.map(d=>{const s=db.shifts.find(x=>x.employee==e.id&&x.date===d);return `<div onclick="shiftModal(${e.id},'${d}')">${s?`<div class="shift">${s.status==='riposo'?'Riposo':esc(s.in+'–'+s.out)}</div>`:'<span class="muted">+ turno</span>'}</div>`}).join('')}`).join('')}</div></div>`}
function shiftModal(eid,date){const s=db.shifts.find(x=>x.employee==eid&&x.date===date)||{in:'08:00',out:'17:00',inP:'12:00',outP:'13:00',status:'planned'};openModal('Modifica turno',`<div class="formgrid"><label>Entrata<input id="si" type="time" value="${s.in||''}"></label><label>Uscita<input id="so" type="time" value="${s.out||''}"></label><label>In pausa<input id="sip" type="time" value="${s.inP||''}"></label><label>Fine pausa<input id="sop" type="time" value="${s.outP||''}"></label><label>Stato<select id="ss"><option>planned</option><option>confirmed</option><option>riposo</option><option>ferie</option><option>malattia</option></select></label></div><button class="btn" style="margin-top:14px" onclick="saveShift(${eid},'${date}')">Salva</button>`);ss.value=s.status}
function saveShift(eid,date){const s={id:uid(),employee:eid,date,store:(db.employees.find(e=>e.id==eid)||{}).negozio,in:si.value,out:so.value,inP:sip.value,outP:sop.value,status:ss.value};db.shifts=db.shifts.filter(x=>!(x.employee==eid&&x.date===date));db.shifts.push(s);save();closeModal();render();toast('Turno salvato')}
function generateWeek(){const monday=new Date();monday.setDate(monday.getDate()-((monday.getDay()+6)%7));db.employees.filter(e=>e.stato==='attivo').forEach((e,i)=>{for(let k=0;k<7;k++){const d=new Date(monday);d.setDate(d.getDate()+k);const date=d.toISOString().slice(0,10);if(e.riposoSett&&e.riposoSett===d.toLocaleDateString('it-IT',{weekday:'long'})){db.shifts=db.shifts.filter(s=>!(s.employee==e.id&&s.date===date));continue}const weekend=k===6;if(weekend&&e.policyDom==='nessuna')continue;db.shifts=db.shifts.filter(s=>!(s.employee==e.id&&s.date===date));db.shifts.push({id:uid(),employee:e.id,date,store:e.negozio,in:i%2?'10:00':'08:00',out:i%2?'19:00':'17:00',inP:'12:00',outP:'13:00',status:'planned'})}});save();render();toast('Settimana generata')}
function publishWeek(){const week=new Date().toISOString().slice(0,10);db.history.push({weekStart:week,publishedAt:new Date().toISOString(),publishedBy:user.nome,shifts:db.shifts.slice()});db.notifications.push({id:uid(),type:'success',title:'Settimana pubblicata',body:'La nuova settimana turni è stata pubblicata.',date:new Date().toISOString(),read:false});save();toast('Settimana pubblicata')}
function history(){return `<div class="section tablewrap"><table class="table"><thead><tr><th>Settimana</th><th>Pubblicata il</th><th>Da</th><th>Turni</th></tr></thead><tbody>${db.history.slice().reverse().map(h=>`<tr><td>${h.weekStart}</td><td>${new Date(h.publishedAt).toLocaleString('it-IT')}</td><td>${esc(h.publishedBy)}</td><td>${h.shifts.length}</td></tr>`).join('')||'<tr><td colspan="4">Nessuna settimana pubblicata</td></tr>'}</tbody></table></div>`}
function absences(){return `<div class="actions"><button class="btn" onclick="absenceModal()">+ Nuova assenza</button></div><div class="section grid">${db.absences.map(a=>`<div class="card"><b>${esc(a.dip||'Dipendente')}</b><div>${a.tipo} · ${a.da} → ${a.a}</div><span class="pill ${a.stato==='approvato'?'ok':a.stato==='rifiutato'?'bad':'warn'}">${a.stato}</span><div class="muted">${esc(a.note||'')}</div></div>`).join('')||'<div class="card empty">Nessuna assenza registrata</div>'}</div>`}
function absenceModal(){openModal('Nuova assenza',`<div class="formgrid"><label>Dipendente<select id="ad">${db.employees.map(e=>`<option value="${e.id}">${esc(e.nome+' '+e.cognome)}</option>`).join('')}</select></label><label>Tipo<select id="at"><option>Ferie</option><option>Permesso</option><option>Malattia</option><option>Corso</option><option>Infortunio</option><option>Congedo</option></select></label><label>Da<input id="af" type="date"></label><label>A<input id="aa" type="date"></label><label>Stato<select id="as"><option>in attesa</option><option>approvato</option><option>rifiutato</option></select></label><label>Note<textarea id="an"></textarea></label></div><button class="btn" style="margin-top:14px" onclick="saveAbsence()">Salva</button>`)}function saveAbsence(){const e=db.employees.find(x=>x.id==ad.value);db.absences.push({id:uid(),dipId:e.id,dip:e.nome+' '+e.cognome,tipo:at.value,da:af.value,a:aa.value,stato:as.value,negozio:e.negozio,note:an.value});db.notifications.push({id:uid(),type:'assenza',title:'Nuova assenza',body:e.nome+' '+e.cognome+' · '+at.value,date:new Date().toISOString(),read:false});save();closeModal();render();toast('Assenza salvata')}
function courses(){return `<div class="actions"><button class="btn" onclick="courseModal()">+ Nuovo corso</button></div><div class="section grid">${db.courses.map(c=>`<div class="card"><h3>${esc(c.titolo)}</h3><p class="muted">${esc(c.ente||'')} · ${c.stato}</p><p style="margin-top:8px">${esc(c.descrizione||'')}</p><div class="muted">Sessioni: ${(c.sessioni||[]).length} · Partecipanti: ${(c.partecipanti||[]).length}</div></div>`).join('')||'<div class="card empty">Nessun corso</div>'}</div>`}function courseModal(){openModal('Nuovo corso',`<div class="formgrid"><label>Titolo<input id="ct"></label><label>Ente<input id="ce"></label><label>Stato<select id="cs"><option>programmato</option><option>in corso</option><option>completato</option><option>annullato</option></select></label><label>Obbligatorio<select id="co"><option value="1">Sì</option><option value="0">No</option></select></label><label>Descrizione<textarea id="cd"></textarea></label></div><button class="btn" style="margin-top:14px" onclick="saveCourse()">Salva</button>`)}function saveCourse(){db.courses.push({id:uid(),titolo:ct.value,ente:ce.value,stato:cs.value,obbligatorio:co.value==='1',descrizione:cd.value,sessioni:[],partecipanti:[],note:''});save();closeModal();render();toast('Corso creato')}
function storesView(){return `<div class="grid">${stores.map(s=>`<div class="card"><h3>${s.nome}</h3><div class="muted">${s.addr}</div><p style="margin-top:10px">Min personale Lun–Dom: ${s.minGiorno.join(' · ')}</p><p class="muted">Min pausa: ${s.minPausa.join(' · ')}</p></div>`).join('')}</div>`}
function reports(){const csv=[['Dipendente','Negozio','Data','Entrata','Uscita','Stato'],...db.shifts.map(s=>{const e=db.employees.find(x=>x.id==s.employee)||{};return [e.nome+' '+e.cognome,e.negozio,s.date,s.in,s.out,s.status]})].map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n');return `<div class="card"><h3>Report turni</h3><p class="muted" style="margin:8px 0 14px">Esporta i dati presenti nel gestionale in CSV.</p><button class="btn" onclick="downloadCSV(${JSON.stringify(csv)})">Scarica CSV</button></div>`}function downloadCSV(csv){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='bplus-report.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function notifications(){return `<div class="actions"><button class="btn secondary" onclick="markAll()">Segna tutte lette</button></div><div class="section grid">${db.notifications.slice().reverse().map(n=>`<div class="card"><b>${esc(n.title)}</b><p>${esc(n.body)}</p><small class="muted">${new Date(n.date).toLocaleString('it-IT')}</small>${!n.read?'<div style="margin-top:8px"><span class="pill warn">Nuova</span></div>':''}</div>`).join('')||'<div class="card empty">Nessuna notifica</div>'}</div>`}function markAll(){db.notifications.forEach(n=>n.read=true);save();render();toast('Notifiche aggiornate')}
function openModal(t,b){mtitle.textContent=t;mbody.innerHTML=b;modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}userbox.innerHTML=`<b>${esc(user.nome+' '+user.cognome)}</b><small>Titolare · ${user.negozio||'GAG'}</small>`;renderNav();render();
</script></body></html>
