<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c62828"><title>B+ Gestionale HR</title><link rel="manifest" href="./manifest.json"><style>:root{--bg:#0f1012;--p:#181a1e;--p2:#22252b;--line:#30343b;--txt:#f6f7f9;--muted:#9ba1aa;--red:#c62828;--green:#2e9b58;--orange:#d88919;--blue:#2878d7}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation;min-height:44px}.side{position:fixed;z-index:40;inset:0 auto 0 0;width:255px;background:#15171a;border-right:1px solid var(--line);padding:16px;overflow:auto}.brand{font-size:24px;font-weight:900;margin:5px 8px 18px}.brand i{color:#e53935;font-style:normal}.who,.card{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:14px}.who{margin-bottom:14px}.who b{display:block}.muted{color:var(--muted);font-size:13px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c6c9ce;text-align:left;border-radius:10px;padding:11px}.nav button.active,.nav button:hover{background:#292d33;color:#fff}.main{margin-left:255px;padding:22px 24px 90px;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top h1{margin:0;font-size:24px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--red);color:#fff;font-weight:750}.btn.secondary{background:#34383e}.btn.green{background:var(--green)}.btn.blue{background:var(--blue)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{font-size:28px;font-weight:900;margin-top:6px}.section{margin-top:16px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:12px;color:#9ca1aa}.pill{display:inline-block;border-radius:999px;padding:4px 8px;background:#333;font-size:12px}.ok{background:#173820;color:#8ee3a7}.warn{background:#3b2d16;color:#ffd07c}.bad{background:#401b1b;color:#ff9d9d}.tabs{display:flex;gap:6px;overflow:auto;margin:0 0 12px}.tabs button{border:1px solid var(--line);background:var(--p);color:#bbb;border-radius:9px;padding:8px 12px;white-space:nowrap}.tabs button.active{background:#30343a;color:#fff}.week{display:grid;grid-template-columns:175px repeat(7,140px);overflow:auto}.week>div{border:1px solid var(--line);border-width:0 1px 1px 0;padding:8px;min-height:72px}.shift{background:#292d33;border-radius:8px;padding:7px;font-size:12px;min-height:50px}.shift.click{cursor:pointer}.modal{display:none;position:fixed;inset:0;z-index:80;background:#000b;padding:16px;align-items:center;justify-content:center}.modal.open{display:flex}.dialog{width:min(850px,100%);max-height:92vh;overflow:auto;background:#1a1c20;border:1px solid #3a3e45;border-radius:16px;padding:18px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form label{font-size:12px;color:#aeb3ba;display:grid;gap:5px}.form input,.form select,.form textarea{width:100%;background:#292d33;color:#fff;border:1px solid #454a52;border-radius:8px;padding:10px}.form textarea{min-height:90px}.checkrow{display:flex;flex-wrap:wrap;gap:10px}.checkrow label{display:flex;align-items:center;gap:5px;background:#25282d;border-radius:8px;padding:8px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}.day{min-height:80px;padding:7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.day b{font-size:12px}.heat0{background:#18241b}.heat1{background:#3b3318}.heat2{background:#451c1c}.bottom{display:none}.toast{position:fixed;z-index:100;right:18px;bottom:18px;background:#25282d;border:1px solid #444;padding:12px 15px;border-radius:10px}.hidden{display:none}@media(max-width:800px){.side{transform:translateX(-105%);transition:.2s;width:285px;box-shadow:10px 0 30px #0008}.side.open{transform:none}.main{margin:0;padding:15px 13px 96px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top h1{font-size:20px}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;z-index:45;left:0;right:0;bottom:0;background:#15171a;border-top:1px solid var(--line);padding:5px 3px calc(5px + env(safe-area-inset-bottom))}.bottom button{border:0;background:transparent;color:#a2a6ad;padding:5px 2px;font-size:10px}.bottom button b{display:block;font-size:18px;line-height:20px}.bottom button.active{color:#fff}.form{grid-template-columns:1fr}.modal{align-items:flex-end;padding:0}.dialog{width:100%;max-height:92vh;border-radius:18px 18px 0 0;padding:15px}.calendar{grid-template-columns:repeat(7,110px);overflow:auto}.week{grid-template-columns:135px repeat(7,120px)}.table{min-width:780px}}@media(max-width:460px){.grid{grid-template-columns:1fr}.actions .btn{flex:1}.card{padding:12px}.top{align-items:flex-start}.top .actions{max-width:45%}}</style></head><body><aside class="side" id="side"><div class="brand">B<i>+</i> Gestionale</div><div class="who" id="who"></div><nav class="nav" id="nav"></nav></aside><main class="main"><header class="top"><div><h1 id="title">Dashboard</h1><div class="muted" id="sub">Panoramica operativa</div></div><div class="actions"><button class="btn secondary" onclick="menu()">☰</button><button class="btn" onclick="logout()">Esci</button></div></header><section id="view"></section></main><nav class="bottom" id="bottom"></nav><div class="modal" id="modal"><div class="dialog"><div class="top"><h2 id="mTitle"></h2><button class="btn secondary" onclick="closeM()">Chiudi</button></div><div id="mBody"></div></div></div><div class="toast hidden" id="toast"></div><script>
if(!sessionStorage.getItem('bplus_uid'))location.replace('./index.html');
const K='bplus_new_v2',H='bplus_storico_settimane_v1',N='bplus_notifiche_v1';const user=JSON.parse(sessionStorage.getItem('bplus_user')||'{}');
const stores=[{id:'GAG',name:'Gaggiolo',min:[3,3,3,3,3,4,2]},{id:'COC',name:'Cocquio',min:[2,2,2,2,2,3,2]},{id:'DAV',name:'Daverio',min:[2,2,2,2,2,3,2]},{id:'VAR',name:'Varese',min:[2,2,2,2,2,3,2]}];
const seed={employees:[{id:2,nome:'Davide',cognome:'Piaia',email:'d.piaia@laquattrosrl.it',telefono:'',ruolo:3,negozio:'GAG',capacita:5,comp:{tintometro:1,chiavi:1,muletto:1,cassa:1,taglio:1,kasanova:1},contratto:'indeterminato',ore:40,pausa:'flessibile',domenica:'1ogni2',recupero:0,uscita18:false,uscitaN:0,uscitaX:0,riposo:'',riposoDom:'casuale',mobilita:['GAG','COC','DAV','VAR'],stato:'attivo',inTurni:true},{id:3,nome:'Marco',cognome:'Ferrari',email:'',telefono:'',ruolo:2,negozio:'GAG',capacita:4,comp:{},contratto:'indeterminato',ore:40,pausa:'fissa',domenica:'1ogni2',recupero:0,uscita18:false,uscitaN:0,uscitaX:0,riposo:'',riposoDom:'casuale',mobilita:['GAG'],stato:'attivo',inTurni:true},{id:4,nome:'Laura',cognome:'Bianchi',email:'',telefono:'',ruolo:1,negozio:'VAR',capacita:3,comp:{cassa:1},contratto:'indeterminato',ore:30,pausa:'flessibile',domenica:'1ogni3',recupero:0,uscita18:false,uscitaN:0,uscitaX:0,riposo:'',riposoDom:'casuale',mobilita:['VAR'],stato:'attivo',inTurni:true}],shifts:[],absences:[],courses:[],stores:stores.map(s=>({id:s.id,name:s.name,days:{}})),history:[],notifications:[],assignments:{},genCounter:0};
let db=JSON.parse(localStorage.getItem(K)||'null')||seed;if(!db.notifications)db.notifications=[];if(!db.history)db.history=[];if(!db.assignments)db.assignments={};function save(){localStorage.setItem(K,JSON.stringify(db));localStorage.setItem(H,JSON.stringify(db.history));localStorage.setItem(N,JSON.stringify(db.notifications))}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function id(){return Date.now()+Math.random()}function notify(text,to='all'){db.notifications.unshift({id:id(),text,date:new Date().toISOString(),read:false,to});save()}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)}function menu(){side.classList.toggle('open')}function logout(){sessionStorage.clear();location='./index.html'}
const pages={dashboard:'Dashboard',employees:'Dipendenti',shifts:'Turni',history:'Storico turni',absences:'Assenze & Ferie',stores:'Punti vendita',courses:'Corsi',reports:'Report',notifications:'Notifiche',profile:'Profilo'};let page='dashboard',tab='main';function can(p){if(user.ruolo===3)return true;if(user.ruolo===2)return ['dashboard','shifts','history','absences','notifications','profile'].includes(p);return ['dashboard','absences','profile'].includes(p)}function nav(){const a=Object.entries(pages).filter(([p])=>can(p));document.getElementById('nav').innerHTML=a.map(([p,n])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${ico(p)} ${n}</button>`).join('');document.getElementById('bottom').innerHTML=[['dashboard','⌂'],['shifts','▦'],['absences','▤'],['notifications','🔔'],['menu','☰']].map(([p,i])=>`<button class="${page===p?'active':''}" onclick="${p==='menu'?'menu()':`go('${p}')`}"><b>${i}</b>${p==='menu'?'Altro':pages[p]}</button>`).join('');who.innerHTML=`<b>${esc(user.nome||'Utente')} ${esc(user.cognome||'')}</b><small>${['','Lavoratore','Direttore','Titolare'][user.ruolo]||''}${user.negozio?' · '+user.negozio:''}</small>`}function ico(p){return {dashboard:'⌂',employees:'👥',shifts:'▦',history:'◷',absences:'🏖',stores:'🏪',courses:'🎓',reports:'📊',notifications:'🔔',profile:'⚙️'}[p]||'•'}function go(p){if(!can(p))return;page=p;side.classList.remove('open');title.textContent=pages[p];nav();render()}
function openM(t,b){mTitle.textContent=t;mBody.innerHTML=b;modal.classList.add('open')}function closeM(){modal.classList.remove('open')}function days(){return ['Lun','Mar','Mer','Gio','Ven','Sab','Dom']}function iso(d){return new Date(d).toISOString().slice(0,10)}function monday(d=new Date()){d=new Date(d);d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}function dateAt(base,i){const d=new Date(base);d.setDate(d.getDate()+i);return iso(d)}
function dashboard(){const today=iso(new Date()),active=db.employees.filter(e=>e.stato==='attivo'),abs=db.absences.filter(a=>a.stato==='approvato'&&a.da<=today&&a.a>=today),sh=db.shifts.filter(s=>s.date===today),pending=db.absences.filter(a=>a.stato==='in_attesa');if(user.ruolo===1)return `<div class="grid"><div class="card"><div class="muted">Il mio turno oggi</div><div class="stat">${sh.find(s=>s.emp==user.id)?.in||'Riposo'}</div><div class="muted">${sh.find(s=>s.emp==user.id)?.out?'→ '+sh.find(s=>s.emp==user.id).out:''}</div></div><div class="card"><div class="muted">Ferie approvate</div><div class="stat">${db.absences.filter(a=>a.emp==user.id&&a.tipo==='Ferie'&&a.stato==='approvato').length}</div></div><div class="card"><div class="muted">Richieste in attesa</div><div class="stat">${db.absences.filter(a=>a.emp==user.id&&a.stato==='in_attesa').length}</div></div></div><div class="section card"><h3>Ultime 4 settimane</h3>${workerWeeks()}</div>`;return `<div class="grid"><div class="card"><div class="muted">Dipendenti attivi</div><div class="stat">${active.length}</div></div><div class="card"><div class="muted">Turni oggi</div><div class="stat">${sh.length}</div></div><div class="card"><div class="muted">Assenti oggi</div><div class="stat">${abs.length}</div></div><div class="card"><div class="muted">Richieste</div><div class="stat">${pending.length}</div></div></div><div class="section grid">${stores.map(s=>{const n=sh.filter(x=>x.store===s.id).length,m=s.min[(new Date().getDay()+6)%7];return `<div class="card"><b>${s.name}</b><div class="muted">Presenti oggi</div><div class="stat">${n}</div><span class="pill ${n>=m?'ok':'bad'}">${n>=m?'✓ coperto':'✕ sotto minimo'}</span></div>`}).join('')}</div><div class="section card"><h3>Alert e notifiche</h3>${pending.length?`<p>${pending.length} richieste in attesa</p>`:'<p class="muted">Nessun alert.</p>'}</div>`}
function workerWeeks(){return db.history.slice(-4).reverse().map(h=>`<div style="padding:8px 0;border-bottom:1px solid #30343b"><b>${esc(h.label||h.start)}</b><span class="muted"> · ${h.shifts?.length||0} turni</span></div>`).join('')||'<div class="muted">Nessuna settimana pubblicata.</div>'}
function employees(){let list=db.employees.filter(e=>user.ruolo===3&&(filterStore==='all'||e.negozio===filterStore)&&(filterRole==='all'||String(e.ruolo)===filterRole)&&(!filterQ||(`${e.nome} ${e.cognome} ${e.email}`).toLowerCase().includes(filterQ.toLowerCase())));return `<div class="actions"><button class="btn" onclick="employeeForm()">+ Nuovo</button><select onchange="filterStore=this.value;render()"><option value="all">Tutti i negozi</option>${stores.map(s=>`<option ${filterStore===s.id?'selected':''} value="${s.id}">${s.name}</option>`).join('')}</select><select onchange="filterRole=this.value;render()"><option value="all">Tutti i ruoli</option><option value="1">Lavoratore</option><option value="2">Direttore</option><option value="3">Titolare</option></select><input placeholder="Cerca…" value="${esc(filterQ)}" oninput="filterQ=this.value;render()"></div><div class="section tablewrap"><table class="table"><tr><th>Dipendente</th><th>Ruolo</th><th>Negozio</th><th>Ore</th><th>Contratto</th><th>Stato</th><th></th></tr>${list.map(e=>`<tr><td><b>${esc(e.nome+' '+e.cognome)}</b><br><span class="muted">${esc(e.email)}</span></td><td>${role(e.ruolo)}</td><td>${e.negozio}</td><td>${e.ore}</td><td>${e.contratto}</td><td><span class="pill ${e.stato==='attivo'?'ok':'warn'}">${e.stato}</span></td><td><button class="btn secondary" onclick="employeeForm(${e.id})">Apri</button></td></tr>`).join('')}</table></div>`}let filterStore='all',filterRole='all',filterQ='';function role(r){return ['','Lavoratore','Direttore','Titolare'][r]}
function employeeForm(eid){const e=db.employees.find(x=>x.id==eid)||{nome:'',cognome:'',email:'',telefono:'',ruolo:1,negozio:'GAG',capacita:3,comp:{},contratto:'indeterminato',ore:40,pausa:'flessibile',domenica:'1ogni2',recupero:0,uscita18:false,uscitaN:0,uscitaX:0,riposo:'',riposoDom:'casuale',mobilita:['GAG'],stato:'attivo',inTurni:true};openM(eid?'Scheda dipendente':'Nuovo dipendente',`<div class="tabs"><button class="active">Anagrafica</button><button onclick="document.getElementById('extra').classList.toggle('hidden')">Contratto & Turni</button><button onclick="document.getElementById('absExtra').classList.toggle('hidden')">Assenze</button></div><div class="form"><label>Nome<input id="en" value="${esc(e.nome)}"></label><label>Cognome<input id="ec" value="${esc(e.cognome)}"></label><label>Email<input id="ee" value="${esc(e.email)}"></label><label>Telefono<input id="et" value="${esc(e.telefono)}"></label><label>Ruolo<select id="er"><option value="1">Lavoratore</option><option value="2">Direttore</option><option value="3">Titolare</option></select></label><label>Negozio<select id="es">${stores.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></label><label>Capacità generali (1-5)<input id="ecap" type="number" min="1" max="5" value="${e.capacita}"></label><label>Contratto<select id="ect"><option>indeterminato</option><option>a termine</option><option>a chiamata</option></select></label><label>Ore settimanali<input id="eore" type="number" value="${e.ore}"></label><label>Tipo pausa<select id="epa"><option>fissa</option><option>flessibile</option></select></label><label>Policy domenicale<select id="edom"><option value="1ogni2">1 ogni 2</option><option value="1ogni3">1 ogni 3</option><option value="tutte">tutte</option><option value="nessuna">nessuna</option></select></label><label>Ore da recuperare<input id="erec" type="number" value="${e.recupero}"></label><label>Stato<select id="est"><option>attivo</option><option>assente</option><option>ferie</option><option>malattia</option></select></label><label>Riposo fisso<input id="erip" value="${e.riposo||''}"></label><label>Riposo dopo domenica<select id="erd"><option>casuale</option><option>lunedi</option><option>martedi</option><option>mercoledi</option></select></label><label>Uscita alle 18:00 (N su X)<input id="e18" value="${e.uscitaN||0} su ${e.uscitaX||0}"></label><label><span>Includi nei turni</span><input id="eit" type="checkbox" ${e.inTurni?'checked':''}></label></div><div class="section card"><b>Competenze</b><div class="checkrow">${[['tintometro','Tintometro'],['chiavi','Chiavi'],['muletto','Muletto'],['cassa','Cassa'],['taglio','Taglio legno'],['kasanova','Kasanova']].map(([k,n])=>`<label><input type="checkbox" id="c_${k}" ${e.comp?.[k]?'checked':''}>${n}</label>`).join('')}</div></div><div class="section actions"><button class="btn" onclick="saveEmp(${eid||0})">Salva</button>${eid?`<button class="btn secondary" onclick="openAbs(${eid})">Gestisci assenze</button>`:''}</div>`);er.value=e.ruolo;es.value=e.negozio;ect.value=e.contratto;epa.value=e.pausa;edom.value=e.domenica;est.value=e.stato}
function saveEmp(id0){const old=db.employees.find(e=>e.id==id0);const e={id:id0||id(),nome:en.value.trim(),cognome:ec.value.trim(),email:ee.value.trim(),telefono:et.value.trim(),ruolo:+er.value,negozio:es.value,capacita:+ecap.value,comp:{},contratto:ect.value,ore:+eore.value,pausa:epa.value,domenica:edom.value,recupero:+erec.value,uscita18:e18.value.trim()!=='0 su 0',uscitaN:+(e18.value.split(' ')[0]||0),uscitaX:+(e18.value.split(' ')[2]||0),riposo:erip.value,riposoDom:erd.value,mobilita:[es.value],stato:est.value,inTurni:eit.checked};['tintometro','chiavi','muletto','cassa','taglio','kasanova'].forEach(k=>e.comp[k]=document.getElementById('c_'+k).checked?1:0);if(!e.nome||!e.cognome)return toast('Nome e cognome obbligatori');const i=db.employees.findIndex(x=>x.id==id0);if(i<0)db.employees.push(e);else db.employees[i]=e;save();closeM();render();toast(old?'Dipendente aggiornato':'Dipendente creato')}
function shifts(){const base=monday(weekDate),ds=Array.from({length:7},(_,i)=>dateAt(base,i)),emps=db.employees.filter(e=>e.stato==='attivo'&&e.inTurni&&(user.ruolo===3||e.negozio===user.negozio||e.mobilita?.includes(user.negozio)));return `<div class="actions"><button class="btn secondary" onclick="weekDate=new Date(weekDate-604800000);render()">◀</button><button class="btn secondary" onclick="weekDate=new Date();render()">Oggi</button><button class="btn secondary" onclick="weekDate=new Date(weekDate.getTime()+604800000);render()">▶</button><button class="btn blue" onclick="autoGen()">⚙ Auto-generazione</button><button class="btn green" onclick="publishWeek()">Pubblica settimana</button></div><div class="section card"><div class="muted">${ds[0]} → ${ds[6]}</div><div class="week"><div><b>Dipendente</b></div>${ds.map((d,i)=>`<div><b>${days()[i]}</b><br><span class="muted">${d}</span></div>`).join('')}${emps.map(e=>`<div><b>${esc(e.nome)} ${esc(e.cognome)}</b><br><span class="muted">${e.negozio}</span></div>${ds.map((d,i)=>{const s=db.shifts.find(x=>x.emp==e.id&&x.date===d);return `<div class="shift click" onclick="shiftForm(${e.id},'${d}')">${s? s.tipo==='lavoro'?`${s.in}–${s.out}<br><small>${s.pause||'pausa'}</small>`:`<span class="pill warn">${s.tipo}</span>`:'+'}</div>`}).join('')}`).join('')}</div></div><div class="section grid">${stores.map((s,si)=>`<div class="card"><b>${s.name}</b>${ds.map((d,i)=>{const n=db.shifts.filter(x=>x.store===s.id&&x.date===d&&x.tipo==='lavoro').length;return `<div style="display:flex;justify-content:space-between;padding:4px 0"><span>${days()[i]}</span><span class="pill ${n>=s.min[i]?'ok':'bad'}">${n}/${s.min[i]}</span></div>`}).join('')}</div>`).join('')}</div>`}let weekDate=new Date();
function shiftForm(emp,date){const s=db.shifts.find(x=>x.emp==emp&&x.date===date)||{tipo:'lavoro',in:'09:00',pause:'13:00-14:00',out:'18:00',store:db.employees.find(e=>e.id==emp)?.negozio||'GAG'};openM('Modifica turno',`<div class="form"><label>Tipo<select id="st"><option>lavoro</option><option>riposo</option><option>ferie</option><option>malattia</option></select></label><label>Negozio<select id="ss">${stores.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select></label><label>Entrata<input id="si" type="time" value="${s.in||'09:00'}"></label><label>Pausa<input id="sp" value="${s.pause||'13:00-14:00'}"></label><label>Uscita<input id="so" type="time" value="${s.out||'18:00'}"></label></div><div class="section actions"><button class="btn" onclick="saveShift(${emp},'${date}')">Salva</button></div>`);st.value=s.tipo;ss.value=s.store}
function saveShift(emp,date){const s={id:id(),emp,date,store:ss.value,tipo:st.value,in:si.value,pause:sp.value,out:so.value};db.shifts=db.shifts.filter(x=>!(x.emp==emp&&x.date===date));db.shifts.push(s);if(st.value!=='lavoro')db.absences.push({id:id(),emp,tipo:st.value==='ferie'?'Ferie':st.value,da:date,a:date,stato:'approvato',note:'Da turno'});save();closeM();render();toast('Turno salvato')}
function autoGen(){db.genCounter=(db.genCounter||0)+1;const base=monday(weekDate);db.employees.filter(e=>e.stato==='attivo'&&e.inTurni).forEach(e=>{for(let i=0;i<7;i++){const d=dateAt(base,i);if(db.absences.some(a=>a.emp==e.id&&a.stato==='approvato'&&a.da<=d&&a.a>=d))continue;if(e.riposo&&e.riposo===days()[i]){upShift(e,d,'riposo');continue}if(i===6&&e.domenica==='nessuna'){upShift(e,d,'riposo');continue}const alt=(db.genCounter+i+e.id)%3;const starts=['08:00','09:00','10:00'];upShift(e,d,'lavoro',starts[alt],alt===2?'19:00':'18:00')}});save();render();toast('Generazione completata')}
function upShift(e,d,t,inn='09:00',out='18:00'){db.shifts=db.shifts.filter(x=>!(x.emp==e.id&&x.date===d));db.shifts.push({id:id(),emp:e.id,date:d,store:e.negozio,tipo:t,in:inn,pause:'13:00-14:00',out})}
function publishWeek(){const base=monday(weekDate),snap=db.shifts.filter(s=>s.date>=dateAt(base,0)&&s.date<=dateAt(base,6));db.history.push({id:id(),start:dateAt(base,0),end:dateAt(base,6),label:`${dateAt(base,0)} – ${dateAt(base,6)}`,shifts:JSON.parse(JSON.stringify(snap)),published:new Date().toISOString()});snap.forEach(s=>notify(`Settimana pubblicata: ${s.date} · ${s.in||''}-${s.out||''}`,s.emp));save();toast('Settimana pubblicata e salvata nello storico')}
function history(){return `<div class="tabs"><button class="${tab==='weeks'?'active':''}" onclick="tab='weeks';render()">Settimane</button><button class="${tab==='sun'?'active':''}" onclick="tab='sun';render()">Domeniche lavorate</button></div>${tab==='weeks'?`<div class="tablewrap"><table class="table"><tr><th>Settimana</th><th>Turni</th><th>Pubblicata</th><th></th></tr>${db.history.slice().reverse().map(h=>`<tr><td>${h.label}</td><td>${h.shifts.length}</td><td>${new Date(h.published).toLocaleString('it-IT')}</td><td><button class="btn secondary" onclick="restoreWeek(${h.id})">Ripristina</button></td></tr>`).join('')}</table></div>`:`<div class="card"><h3>Riepilogo domeniche</h3>${db.employees.map(e=>{const n=db.history.reduce((a,h)=>a+h.shifts.filter(s=>s.emp==e.id&&new Date(s.date).getDay()===0&&s.tipo==='lavoro').length,0);return `<p style="padding:9px 0;border-bottom:1px solid #30343b"><b>${e.nome} ${e.cognome}</b> · ${n} domeniche</p>`}).join('')}</div>`}`}
function restoreWeek(hid){const h=db.history.find(x=>x.id==hid);if(!h)return;h.shifts.forEach(s=>upShift(db.employees.find(e=>e.id==s.emp)||{},s.date,s.tipo,s.in,s.out));save();go('shifts');toast('Settimana ripristinata')}
function absences(){const mine=user.ruolo===1||user.ruolo===2;const list=db.absences.filter(a=>mine?a.emp==user.id:true);return `<div class="actions"><button class="btn" onclick="absenceForm()">+ Richiedi assenza</button></div><div class="section grid"><div class="card"><div class="muted">Ferie approvate</div><div class="stat">${list.filter(a=>a.tipo==='Ferie'&&a.stato==='approvato').length}</div></div><div class="card"><div class="muted">Permessi</div><div class="stat">${list.filter(a=>a.tipo==='Permesso'&&a.stato==='approvato').length}</div></div><div class="card"><div class="muted">In attesa</div><div class="stat">${list.filter(a=>a.stato==='in_attesa').length}</div></div></div><div class="section card"><h3>Calendario assenze</h3>${absenceCalendar(list)}</div><div class="section tablewrap"><table class="table"><tr><th>Dipendente</th><th>Tipo</th><th>Da</th><th>A</th><th>Stato</th><th></th></tr>${list.slice().reverse().map(a=>`<tr><td>${empName(a.emp)}</td><td>${a.tipo}</td><td>${a.da}</td><td>${a.a}</td><td><span class="pill ${a.stato==='approvato'?'ok':a.stato==='rifiutato'?'bad':'warn'}">${a.stato}</span></td><td>${user.ruolo>=2&&a.stato==='in_attesa'?`<button class="btn green" onclick="approveAbs(${a.id},1)">✓</button> <button class="btn secondary" onclick="approveAbs(${a.id},0)">✕</button>`:''}</td></tr>`).join('')}</table></div>`}
function absenceCalendar(list){const m=new Date();const y=m.getFullYear(),mo=m.getMonth(),first=new Date(y,mo,1).getDay()||7,last=new Date(y,mo+1,0).getDate();let h='<div class="calendar">';for(let i=1;i<first;i++)h+='<div class="day"></div>';for(let d=1;d<=last;d++){const ds=iso(new Date(y,mo,d)),n=list.filter(a=>a.da<=ds&&a.a>=ds&&a.stato==='approvato').length;h+=`<div class="day heat${Math.min(2,n)}"><b>${d}</b><div class="muted">${n} assenti</div></div>`}return h+'</div>'}function empName(id0){const e=db.employees.find(x=>x.id==id0);return e?e.nome+' '+e.cognome:'—'}
function absenceForm(){openM('Nuova richiesta',`<div class="form"><label>Tipo<select id="at"><option>Ferie</option><option>Permesso</option></select></label><label>Da<input id="ad" type="date"></label><label>A<input id="aa" type="date"></label><label>Fascia<select id="af"><option>giornata intera</option><option>fascia specifica</option><option>entrata posticipata</option><option>uscita anticipata</option></select></label><label>Note<textarea id="an"></textarea></label></div><div class="section actions"><button class="btn" onclick="saveAbs()">Invia richiesta</button></div>`);const t=iso(new Date());ad.value=t;aa.value=t}
function saveAbs(){db.absences.push({id:id(),emp:user.id,tipo:at.value,da:ad.value,a:aa.value,fascia:af.value,note:an.value,stato:user.ruolo===3?'approvato':'in_attesa'});notify(`${empName(user.id)} ha richiesto ${at.value}`,'manager');save();closeM();render();toast('Richiesta registrata')}
function approveAbs(id0,ok){const a=db.absences.find(x=>x.id==id0);if(!a)return;a.stato=ok?'approvato':'rifiutato';if(ok&&a.tipo==='Ferie'){for(let d=new Date(a.da);d<=new Date(a.a);d.setDate(d.getDate()+1)){if(d.getDay()===0){const e=db.employees.find(x=>x.id==a.emp);if(e&&e.domenica!=='nessuna')a.note=(a.note||'')+' · Recupero domenica da valutare';}}}save();render();toast(ok?'Richiesta approvata':'Richiesta rifiutata')}
function storesView(){return `<div class="grid">${stores.map(s=>`<div class="card"><h3>${s.name}</h3><p class="muted">Configurazione giornaliera</p>${days().map((d,i)=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #30343b"><span>${d}</span><span>${s.min[i]} min · ${i===6?'domenica':''}</span></div>`).join('')}<button class="btn secondary" style="margin-top:10px" onclick="storeForm('${s.id}')">Configura</button></div>`).join('')}</div><div class="section tablewrap"><table class="table"><tr><th>Negozio</th>${days().map(d=>`<th>${d}</th>`).join('')}</tr>${stores.map(s=>`<tr><td><b>${s.name}</b></td>${s.min.map(n=>`<td>${n}</td>`).join('')}</tr>`).join('')}</table></div>`}function storeForm(id0){const s=stores.find(x=>x.id===id0);openM('Configurazione '+s.name,`<div class="form">${days().map((d,i)=>`<label>${d} — minimo personale<input id="sm${i}" type="number" value="${s.min[i]}"></label>`).join('')}</div><div class="section actions"><button class="btn" onclick="saveStore('${id0}')">Salva</button></div>`)}function saveStore(id0){const s=stores.find(x=>x.id===id0);for(let i=0;i<7;i++)s.min[i]=+document.getElementById('sm'+i).value;save();closeM();render();toast('Negozio aggiornato')}
function courses(){return `<div class="actions"><button class="btn" onclick="courseForm()">+ Nuovo corso</button></div><div class="section tablewrap"><table class="table"><tr><th>Titolo</th><th>Ente</th><th>Sessioni</th><th>Obbligatorio</th><th>Partecipanti</th><th></th></tr>${db.courses.map(c=>`<tr><td><b>${esc(c.titolo)}</b><br><span class="muted">${esc(c.descrizione||'')}</span></td><td>${esc(c.ente)}</td><td>${c.sessioni.length}</td><td>${c.obbligatorio?'Sì':'No'}</td><td>${c.partecipanti.length}</td><td><button class="btn secondary" onclick="courseForm(${c.id})">Modifica</button></td></tr>`).join('')}</table></div>`}function courseForm(cid){const c=db.courses.find(x=>x.id==cid)||{titolo:'',ente:'',descrizione:'',sessioni:[],obbligatorio:false,partecipanti:[]};openM(cid?'Modifica corso':'Nuovo corso',`<div class="form"><label>Titolo<input id="ct" value="${esc(c.titolo)}"></label><label>Ente<input id="ce" value="${esc(c.ente)}"></label><label>Obbligatorio<select id="co"><option value="0">No</option><option value="1">Sì</option></select></label><label>Descrizione<textarea id="cd">${esc(c.descrizione)}</textarea></label><label>Data sessione<input id="cdate" type="date"></label><label>Orario sessione<input id="ctime" value="09:00-13:00"></label></div><div class="section card"><b>Partecipanti</b><div class="checkrow">${db.employees.map(e=>`<label><input type="checkbox" class="cp" value="${e.id}" ${c.partecipanti.includes(e.id)?'checked':''}>${esc(e.nome+' '+e.cognome)}</label>`).join('')}</div></div><div class="actions"><button class="btn" onclick="saveCourse(${cid||0})">Salva</button></div>`);co.value=c.obbligatorio?'1':'0'}function saveCourse(cid){const old=db.courses.find(c=>c.id==cid);const p=[...document.querySelectorAll('.cp:checked')].map(x=>+x.value);const c={id:cid||id(),titolo:ct.value,ente:ce.value,descrizione:cd.value,obbligatorio:co.value==='1',sessioni:old?.sessioni||[],partecipanti:p};if(cdate.value)c.sessioni.push({data:cdate.value,orario:ctime.value});const i=db.courses.findIndex(x=>x.id==cid);if(i<0)db.courses.push(c);else db.courses[i]=c;p.forEach(e=>{if(cdate.value)db.absences.push({id:id(),emp:e,tipo:'Corso',da:cdate.value,a:cdate.value,stato:'approvato',note:c.titolo})});save();closeM();render();toast('Corso salvato')}
function reports(){const y=new Date().getFullYear(),m=new Date().getMonth()+1;return `<div class="tabs"><button class="active">Presenze mensili</button><button onclick="toast('Report assenze per tipo pronto')">Assenze per tipo</button></div><div class="actions"><select id="ry"><option>${y}</option><option>${y-1}</option></select><select id="rm">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i+1===m?'selected':''}>${i+1}</option>`).join('')}</select><button class="btn" onclick="downloadReport()">Esporta CSV</button></div><div class="section tablewrap"><table class="table"><tr><th>Dipendente</th><th>Negozio</th><th>Turni</th><th>Ferie</th><th>Permessi</th><th>Malattia</th></tr>${db.employees.map(e=>`<tr><td>${empName(e.id)}</td><td>${e.negozio}</td><td>${db.shifts.filter(s=>s.emp==e.id&&s.date.startsWith(`${y}-${String(m).padStart(2,'0')}`)&&s.tipo==='lavoro').length}</td><td>${db.absences.filter(a=>a.emp==e.id&&a.tipo==='Ferie'&&a.stato==='approvato').length}</td><td>${db.absences.filter(a=>a.emp==e.id&&a.tipo==='Permesso'&&a.stato==='approvato').length}</td><td>${db.absences.filter(a=>a.emp==e.id&&a.tipo==='malattia'&&a.stato==='approvato').length}</td></tr>`).join('')}</table></div>`}function downloadReport(){const rows=[['Dipendente','Negozio','Turni','Ferie','Permessi','Malattia']];db.employees.forEach(e=>rows.push([empName(e.id),e.negozio,db.shifts.filter(s=>s.emp==e.id&&s.tipo==='lavoro').length,db.absences.filter(a=>a.emp==e.id&&a.tipo==='Ferie'&&a.stato==='approvato').length,db.absences.filter(a=>a.emp==e.id&&a.tipo==='Permesso'&&a.stato==='approvato').length,db.absences.filter(a=>a.emp==e.id&&a.tipo==='malattia'&&a.stato==='approvato').length]));const b=new Blob([rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='bplus-report.csv';a.click()}
function notifications(){return `<div class="actions"><button class="btn" onclick="db.notifications.forEach(n=>n.read=true);save();render()">Segna tutte lette</button></div><div class="section">${db.notifications.length?db.notifications.map(n=>`<div class="card" style="margin-bottom:8px;opacity:${n.read?.6:1}"><b>${n.read?'':'● '}</b>${esc(n.text)}<div class="muted">${new Date(n.date).toLocaleString('it-IT')}</div></div>`).join(''):'<div class="card muted">Nessuna notifica.</div>'}</div>`}
function profile(){return `<div class="card"><h3>Profilo</h3><p style="margin:10px 0">${esc(user.nome)} ${esc(user.cognome)} · ${role(user.ruolo)}</p><p class="muted">${esc(user.email||'')}</p><div class="section actions"><button class="btn" onclick="passwordForm()">Modifica password</button></div></div>`}function passwordForm(){openM('Modifica password',`<div class="form"><label>Nuova password<input id="np" type="password" oninput="strength.textContent=passwordStrength(this.value)"></label><label>Conferma<input id="nc" type="password"></label></div><div id="strength" class="muted" style="margin-top:8px"></div><div class="actions section"><button class="btn" onclick="savePassword()">Salva</button></div>`)}function passwordStrength(v){return v.length<8?'Debole':v.length<12?'Media':'Forte'}function savePassword(){if(np.value.length<8||np.value!==nc.value)return toast('Password non valida o non coincidente');localStorage.setItem('bplus_password_hint','password impostata');closeM();toast('Password aggiornata')}
function openAbs(eid){go('absences');closeM()}function render(){nav();document.getElementById('sub').textContent=user.ruolo===3?'Vista globale':user.ruolo===2?'Vista del negozio':'Vista personale';document.getElementById('view').innerHTML=page==='dashboard'?dashboard():page==='employees'?employees():page==='shifts'?shifts():page==='history'?history():page==='absences'?absences():page==='stores'?storesView():page==='courses'?courses():page==='reports'?reports():page==='notifications'?notifications():profile()}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script><script src="./employee-anagrafica-fix.js"></script><script src="./bplus-notifications.js"></script><script src="./bplus-test-complete.js"></script><script src="./ui-enhancements.js"></script></body></html>
